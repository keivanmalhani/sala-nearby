<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">

<title>Sala Nearby</title>
<meta name="description" content="Every cinema within walking distance of Parque Mexico, with tonight's real showtimes.">

<!-- THE TAGS THAT MAKE IT AN APP AND NOT A PAGE. iOS reads these at the moment you tap
     Add to Home Screen. Without apple-mobile-web-app-capable the icon opens Safari with
     an address bar and a toolbar; with it there is no browser furniture at all. The
     status-bar style has to be black-translucent for the app to draw under the notch,
     which is what env(safe-area-inset-top) in the stylesheet is already compensating
     for -- the two only make sense together. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sala">
<meta name="format-detection" content="telephone=no">

<!-- Two, because the browser chrome is painted before any CSS runs and a single colour
     would flash the wrong ground on launch in one of the themes. -->
<meta name="theme-color" content="#FAF6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100E" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<style>
:root{color-scheme:light dark}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]:not([hidden=until-found]){display:none!important}

/* THE LAUNCH SCREEN. iOS shows a white rectangle between the tap and the first paint
   unless you ship a splash image per device size, which is a dozen PNGs and a dozen
   media queries. This is the cheap version that covers every device: paint the app's
   own ground colour immediately, with the wordmark, and take it away on load. It is
   inside the document so it costs no extra request. */
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
      background:#FAF6F0;color:#191310;transition:opacity .28s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .w{font:800 30px/1 "Bricolage Grotesque",system-ui,-apple-system,sans-serif;
         letter-spacing:-.03em}
#boot .t{margin-top:9px;font:500 10px/1 ui-monospace,"IBM Plex Mono",Menlo,monospace;
         letter-spacing:.22em;text-transform:uppercase;color:#8B7C72}
@media (prefers-color-scheme:dark){#boot{background:#14100E;color:#F4EDE5}
  #boot .t{color:#8A7C72}}
</style>
</head>
<body>
<div id="boot"><div><div class="w">Sala Nearby</div><div class="t">Roma &middot; Condesa</div></div></div>
<style>
/* LEAFLET 1.9.4 core, inlined because the CSP admits scripts from cdnjs but not stylesheets */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-safari .leaflet-tile{image-rendering:-webkit-optimize-contrast}
.leaflet-safari .leaflet-tile-container{width:1600px;height:1600px;-webkit-transform-origin:0 0}
.leaflet-marker-icon,.leaflet-marker-shadow{display:block}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{-ms-touch-action:pan-x pan-y;touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{-ms-touch-action:pinch-zoom;touch-action:none;touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{-ms-touch-action:none;touch-action:none}
.leaflet-container{-webkit-tap-highlight-color:transparent}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}
.leaflet-popup-pane{z-index:700}.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{float:left;clear:both}.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-zoom-animated{-webkit-transform-origin:0 0;transform-origin:0 0}
svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{-webkit-transition:-webkit-transform .25s cubic-bezier(0,0,.25,1);transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{-webkit-transition:none;transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive,svg.leaflet-image-layer.leaflet-interactive path{pointer-events:auto}
.leaflet-container{background:#ddd;outline-offset:1px}
.leaflet-container{font-family:inherit;font-size:12px;line-height:1.5}
.leaflet-tooltip{position:absolute;padding:6px;background:#fff;border:1px solid #fff;border-radius:3px;color:#222;white-space:nowrap;-webkit-user-select:none;user-select:none;pointer-events:none}
.leaflet-tooltip.leaflet-interactive{cursor:pointer;pointer-events:auto}
.leaflet-control-attribution{padding:0 5px;line-height:1.4}
.leaflet-control-attribution a{text-decoration:none}

/* ============================================================
   SALA NEARBY  --  a darkened auditorium with a tungsten lamp on.
   The ground is warm and red-biased rather than neutral black,
   because a cinema at night is never grey; the one accent is
   projector amber. Format colours are a legend, not decoration.
   ============================================================ */
:root{
  --ground:#FAF6F0; --surface:#FFFFFF; --sunk:#F1EAE1; --sunk2:#E9DFD3;
  --ink:#191310; --ink-2:#5C4F47; --ink-3:#8B7C72;
  --line:#E4DACE; --line-2:#EFE7DC;
  --lamp:#A9670C; --lamp-ink:#FFFFFF; --lamp-soft:#F7EBD6;
  --beam:#1E6E86;
  --c-big:#C4471C; --c-lux:#7B4FA6; --c-std:#2C6AA8; --c-art:#1E7C52; --c-free:#96700E;
  --ok:#1E7C52; --ok-soft:#E2F0E8;
  --maybe:#8A6A1F; --maybe-soft:#F5EDD9;
  --no:#9B3F2B; --no-soft:#F7E4DD;
  --tilefilter:none;
  --sheet-shadow:0 -8px 40px rgba(25,19,16,.16);
  --tap:rgba(169,103,12,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#14100E; --surface:#1F1815; --sunk:#0E0B0A; --sunk2:#2A211C;
    --ink:#F4EDE5; --ink-2:#BCADA2; --ink-3:#8A7C72;
    --line:#332A25; --line-2:#261F1B;
    --lamp:#E8A33D; --lamp-ink:#14100E; --lamp-soft:#3A2A12;
    --beam:#86C6DA;
    --c-big:#F0855A; --c-lux:#BE95E0; --c-std:#7FADE0; --c-art:#6DC79C; --c-free:#DCB44E;
    --ok:#6DC79C; --ok-soft:#152A20;
    --maybe:#DCB44E; --maybe-soft:#2E2411;
    --no:#E58A6E; --no-soft:#341C15;
    --tilefilter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.92) saturate(.55) sepia(.18);
    --sheet-shadow:0 -8px 40px rgba(0,0,0,.55);
    --tap:rgba(232,163,61,.14);
  }
}
:root[data-theme="dark"]{
  --ground:#14100E; --surface:#1F1815; --sunk:#0E0B0A; --sunk2:#2A211C;
  --ink:#F4EDE5; --ink-2:#BCADA2; --ink-3:#8A7C72;
  --line:#332A25; --line-2:#261F1B;
  --lamp:#E8A33D; --lamp-ink:#14100E; --lamp-soft:#3A2A12;
  --beam:#86C6DA;
  --c-big:#F0855A; --c-lux:#BE95E0; --c-std:#7FADE0; --c-art:#6DC79C; --c-free:#DCB44E;
  --ok:#6DC79C; --ok-soft:#152A20;
  --maybe:#DCB44E; --maybe-soft:#2E2411;
  --no:#E58A6E; --no-soft:#341C15;
  --tilefilter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.92) saturate(.55) sepia(.18);
  --sheet-shadow:0 -8px 40px rgba(0,0,0,.55);
  --tap:rgba(232,163,61,.14);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:var(--lamp);text-decoration:none}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.read{font-family:Newsreader,Georgia,"Times New Roman",serif}

.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--ground)}
.chrome{-webkit-user-select:none;user-select:none}

.top{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 9px) 14px 9px;
  padding-left:calc(env(safe-area-inset-left,0px) + 14px);
  padding-right:calc(env(safe-area-inset-right,0px) + 14px);
  background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30;
}
.top .from{flex:1;min-width:0}
.top .from .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:block}
.top .from .n{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.2}
.iconbtn{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--sunk)}
.iconbtn:active{background:var(--tap)}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:var(--ink-2);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp)}
.iconbtn[aria-pressed="true"] svg{stroke:var(--lamp-ink)}

.panes{position:relative;min-height:0}
.pane{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:none}
.pane.on{display:block}
.pane.map{overflow:hidden}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);position:relative;z-index:30}
.tabs button{display:grid;place-items:center;gap:3px;padding:8px 4px 7px;min-height:52px;color:var(--ink-3);position:relative}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.tabs button[aria-selected="true"]{color:var(--lamp)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--lamp);border-radius:0 0 2px 2px}
.tabs button:active{background:var(--tap)}

/* ---------- date + filter rails ---------- */
.rail{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail.dates{border-bottom:none;padding-bottom:4px}
.rail button{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--ground);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;gap:7px}
.rail button i{width:8px;height:8px;border-radius:50%;display:block}
.rail button[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.rail button[aria-pressed="true"] i{box-shadow:0 0 0 1.5px var(--lamp-ink)}
.rail .day{flex-direction:column;gap:1px;padding:5px 12px;min-width:56px}
.rail .day b{font-size:15px;font-weight:700;line-height:1.1}
.rail .day em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}

.count{padding:11px 16px 7px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.count b{color:var(--lamp);font-weight:600}

/* ---------- showtime blocks ---------- */
.cin{border-bottom:1px solid var(--line-2);padding:13px 16px 15px}
.cin .hdr{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;width:100%;text-align:left}
.cin .hdr:active{background:var(--tap)}
.cin .n{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.25}
.cin .s{color:var(--ink-2);font-size:12.5px;margin-top:2px;line-height:1.35}
.cin .far{text-align:right;flex:none}
.cin .far b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;letter-spacing:-.02em}
.cin .far em{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;font-style:normal;color:var(--ink-3);letter-spacing:.06em;margin-top:2px;white-space:nowrap}

.film{margin-top:12px}
.film .ft{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.film .ft b{font-size:14.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.film .ft span{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.04em}
.vgrp{margin-top:6px}
.vgrp .vl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.t{
  min-height:38px;min-width:62px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
}
.t:active{background:var(--tap)}
.t.past{opacity:.34}
.t.soon{border-color:var(--lamp);color:var(--lamp);font-weight:600}
.t.low{border-color:var(--no);color:var(--no)}
.t em{font-style:normal;font-size:9px;margin-left:4px;opacity:.75}

.badge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:4px;line-height:1.35;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.badge.imax{background:var(--beam);color:var(--ground)}
.badge.atmos{background:var(--c-lux);color:var(--ground)}
.badge.plat{background:var(--c-big);color:var(--ground)}
.badge.sub{background:var(--ok-soft);color:var(--ok)}
.badge.dub{background:var(--sunk2);color:var(--ink-2)}

.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;line-height:1.35;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.tag.imax{background:var(--beam);color:var(--ground)}
.tag.v{background:var(--ok-soft);color:var(--ok)}
.tag.l{background:var(--maybe-soft);color:var(--maybe)}
.tag.u{background:var(--no-soft);color:var(--no)}

/* ---------- films index ---------- */
.frow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:13px 16px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.frow:active{background:var(--tap)}
.frow .n{font-weight:700;font-size:15.5px;letter-spacing:-.01em;line-height:1.25}
.frow .s{color:var(--ink-2);font-size:12.5px;margin-top:3px;line-height:1.4}
.frow .fm{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.frow .cnt{text-align:right;font-family:"IBM Plex Mono",monospace}
.frow .cnt b{display:block;font-size:16px;font-weight:600;color:var(--lamp)}
.frow .cnt em{display:block;font-style:normal;font-size:9.5px;color:var(--ink-3);letter-spacing:.06em;margin-top:2px}

/* ---------- map ---------- */
#map{position:absolute;inset:0;background:var(--sunk)}
.leaflet-tile-pane{filter:var(--tilefilter)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 82%,transparent);color:var(--ink-3);font-size:9.5px;font-family:"IBM Plex Mono",monospace}
.leaflet-control-attribution a{color:var(--ink-2)}
.lbl{background:none;border:none;box-shadow:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:11.5px;color:var(--ink);text-shadow:0 0 4px var(--ground),0 0 4px var(--ground),0 0 8px var(--ground);padding:0;white-space:nowrap}
.lbl::before{display:none}
.mapctl{position:absolute;right:12px;top:12px;z-index:600;display:grid;gap:8px}
.mapctl button{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.mapctl button:active{background:var(--tap)}
.mapctl svg{width:20px;height:20px;fill:none;stroke:var(--ink-2);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.keybtn{position:absolute;left:12px;bottom:12px;z-index:600;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.18);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);min-height:38px}
.keybtn i{width:9px;height:9px;border-radius:50%;display:block}
.keypanel{position:absolute;left:12px;bottom:12px;z-index:601;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:none;gap:7px;box-shadow:0 4px 24px rgba(0,0,0,.25);max-width:min(78vw,300px)}
.keypanel.on{display:grid}
.keypanel .r{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
.keypanel .r i{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ink-3)}
.keypanel .note{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);line-height:1.5;border-top:1px solid var(--line-2);padding-top:8px;margin-top:2px}

/* ---------- bottom sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,7,6,.42);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:900}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:var(--sheet-shadow);transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);max-height:92dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:translateY(0)}
.grab{padding:9px 0 4px;display:grid;place-items:center;flex:none;touch-action:none;cursor:grab}
.grab::before{content:"";width:38px;height:4px;border-radius:2px;background:var(--line);display:block}
.sheet .head{padding:4px 18px 12px;border-bottom:1px solid var(--line-2);flex:none;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;border-left:4px solid var(--cat,var(--lamp))}
.sheet h2{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:0;text-wrap:balance}
.sheet .addr{color:var(--ink-2);font-size:13px;margin-top:4px;line-height:1.35}
.sheet .far{text-align:right;flex:none}
.sheet .far b{display:block;font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;letter-spacing:-.02em}
.sheet .far em{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;font-style:normal;color:var(--ink-3);margin-top:2px;white-space:nowrap}
.sheet .go{display:flex;gap:8px;padding:12px 18px;flex:none;border-bottom:1px solid var(--line-2)}
.sheet .go a{flex:1;min-height:44px;display:grid;place-items:center;border-radius:12px;font-size:14px;font-weight:700;border:1px solid var(--line);color:var(--ink);text-align:center;padding:0 6px}
.sheet .go a.pri{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:20px}
.sheet .plain{font-family:Newsreader,Georgia,serif;font-size:16.5px;line-height:1.55;padding:14px 18px 4px;margin:0;color:var(--ink)}
.sec{padding:14px 18px;border-top:1px solid var(--line-2)}
.sec h3{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 9px}
.spec{display:grid;grid-template-columns:82px 1fr;gap:8px 12px;margin:0;font-size:13.5px}
.spec dt{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.spec dd{margin:0;line-height:1.45}
.spec dd .tag{margin-left:5px;vertical-align:1px}

/* ---------- reading panes ---------- */
.doc{padding:18px 16px calc(30px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.doc h2{font-size:13px;font-family:"IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:26px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
.doc h2:first-child{margin-top:0;padding-top:0;border-top:none}
.doc .lede{font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.55;color:var(--ink-2);margin:0 0 16px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px}
.card h3{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:0 0 7px;line-height:1.2}
.card .say{font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.55;margin:0 0 9px;color:var(--ink)}
.card .tech{font-size:12.5px;line-height:1.5;color:var(--ink-2);margin:0}
.ruled{width:100%;border-collapse:collapse;font-size:13.5px}
.ruled td{padding:10px 0;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.45;color:var(--ink-2)}
.ruled td:first-child{font-weight:700;color:var(--ink);padding-right:14px;width:38%}
.srcs{font-size:12px;color:var(--ink-2);line-height:1.5}
.srcs p{margin:0 0 8px;padding-left:14px;text-indent:-14px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;margin-bottom:6px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left}
.pick:active{background:var(--tap)}
.pick .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pick .n{font-size:16px;font-weight:700;letter-spacing:-.015em;margin-top:5px;line-height:1.2}
.pick .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--lamp);margin-top:5px;font-weight:500}
.empty{padding:44px 22px;text-align:center;color:var(--ink-3)}
.empty b{display:block;font-size:17px;color:var(--ink-2);margin-bottom:5px;font-weight:700}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);padding:10px 16px 22px;line-height:1.6;border-top:1px solid var(--line-2);margin-top:8px}
.stamp b{color:var(--ink-2);font-weight:600}

/* THUMBS. Everything tappable clears 44px on a touch screen -- measured on a real 375px
   viewport, where the time chips were 38px tall and the rail buttons 38px. Scoped to
   pointer:coarse so no desktop layout moves, and placed below every rule it overrides
   because a media query adds no specificity. */
@media (pointer:coarse){
  .t{min-height:44px;min-width:66px;font-size:15px}
  .rail button{min-height:44px}
  .rail .day{min-height:46px;padding:6px 13px}
  .iconbtn{width:44px;height:44px}
  .tabs button{min-height:56px}
  .keybtn{min-height:44px}
  /* Measured at 42x42 on a 390px viewport, which misses by two pixels in both directions.
     A short control and a narrow one fail a thumb the same way. */
  .mapctl button{width:44px;height:44px}
  .frow,.cin .hdr{min-height:52px}
  .badge{font-size:10.5px}
  /* .vgrp .vl, not .vl -- the base rule is two classes deep and a media query adds no
     specificity, so the bare selector lost and the format label stayed at 9.5px. */
  .vgrp .vl{font-size:11px}
  .count{font-size:11px}
  .sheet .go a{min-height:48px}
}

@media (min-width:900px){
  .sheet{left:auto;right:0;top:0;bottom:0;width:440px;max-height:none;border-radius:0;border-left:1px solid var(--line);border-top:none;transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
  .sheet.on{transform:translateX(0)}
  .grab{display:none}
  .sheet .head{padding-top:18px}
  .scrim{background:rgba(10,7,6,.2)}
  .doc{max-width:720px}
  .picks{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
}

"Cinemex Insurgentes":["lux","A five-minute walk from Parque Mexico. Seven small rooms, all with the wider, softer Premium seats, and it is one of Cinemex's art-house venues, so you get subtitled indie and restored films alongside the blockbusters. Regular screens and sound, nothing giant. This is the everyday neighborhood cinema."],
"Cinemex Pabellon Cuauhtemoc":["std","The cheap, no-frills multiplex on the Roma Norte side of Av. Cuauhtemoc. Twelve rooms, four of them with the nicer Premium seats. Standard screens and sound. Go here for a quick weekday showing when the movie matters more than the room."],
"Cinemex Reforma Casa de Arte":["art","A four-room art-house tucked behind Reforma, all Premium seats, dedicated to independent and festival films. Small rooms, quiet crowd, subtitles. Good for the film you would otherwise stream."],
"Cinemex Reforma 222 Market":["big","The newest-feeling cinema near Roma: fully remodeled in March 2026 with laser projectors in every room and a food hall instead of a candy bar. Eleven Premium rooms; room 4 is the big-screen CinemeXtremo room with Dolby Atmos overhead sound. Expect to pay about double a regular ticket. Best pick for a bright, sharp picture within walking distance of Reforma."],
"Cinemex Centro Telmex":["std","Ten plain rooms on Av. Cuauhtemoc at Chapultepec, two with 3D. Nothing premium, nothing large. It exists for convenience and price."],
"Cinemex Parque Delta + Parque Delta Platino":["big","The best screens closest to Condesa and Roma, in the Parque Delta mall. Room 3 is a real IMAX with laser projection and IMAX's 12-channel sound, the nearest IMAX of any brand. Room 10 is the CinemeXtremo big screen with Dolby Atmos. Next door is a separate five-room Platino cinema with full recliners and waiters bringing food and cocktails to your seat. If someone visiting asks where to see a big movie, this is the answer."],
"Cinemas WTC":["lux","An independent cinema opened in 2023 by the people who founded Cinemex, on the third floor of the World Trade Center mall in Napoles. Fourteen rooms, five of them VIP with recliners. They advertise very large screens and strong sound with acoustic panels, but publish no numbers. Worth a visit to judge for yourself."],
"Cinemex Galerias (Plaza de las Estrellas)":["std","Fourteen rooms in the Plaza de las Estrellas mall on Circuito Interior. One Premium room, one 3D room, the rest standard. Cheap tickets. Convenient if you are already at the mall."],
"Cinemex Patriotismo Market + Patriotismo Platino":["lux","Two cinemas in one mall at Patriotismo and Viaducto. The Market side has eight Premium rooms and a food hall; the Platino side is a small four-room recliner cinema with waiter service, the cheapest Platino in the area. No giant screen, but a comfortable night out."],
"Cinemex Real":["std","Eight standard rooms inside what was the grand 1950 Cine Real near the Alameda. Among the cheapest tickets in the city. Historic shell, ordinary rooms."],
"Cinemex Portal Centro":["std","Nine standard rooms in a newer mall east of Centro. Nothing special; listed so nothing is missed."],
"Cinemex San Antonio":["std","Fourteen standard rooms in San Pedro de los Pinos. Room 1 is big enough to carry Disney's Infinity Vision label, which means a wide screen and at least 7.1 sound. Cheap."],
"Cinepolis Diana":["std","The Cinepolis on Reforma, in the shell of the 1961 Cine Diana. Eight ordinary rooms with non-reclining seats, one 3D room and one art-house room. No VIP, no IMAX. The land has been for sale for years, so do not expect upgrades. Handy location, dated rooms."],
"Cinepolis Forum Buenavista":["big","The nearest Cinepolis with the big formats: a large IMAX room (about the size of two tennis courts of screen) and a 4DX room with moving seats, wind and water. Sixteen rooms total, very busy, book ahead. Reachable by Metro and Metrobus at Buenavista."],
"Cinepolis VIP Miyana Polanco":["lux","An all-VIP Cinepolis in Polanco: seven recliner rooms with food and cocktails served to your seat, and one ScreenX room where the picture wraps onto the side walls in selected scenes. Pricey, comfortable, good for a date or for visitors."],
"Cinemex Universidad":["big","Twelve rooms in Plaza Universidad. Room 1 is a CinemeXtremo big screen with Dolby Atmos and is the cheapest large-format ticket in this list. Worth the taxi if you want the big room without paying IMAX prices."],
"Cinemex Antara Market + Antara Platino":["big","The showpiece cinema in Polanco. Its IMAX with laser is billed as the largest IMAX screen in Latin America, roughly 300 square meters, and it sits inside the Platino recliner wing with waiter service. There is also a CinemeXtremo room with Dolby Atmos and a Market food hall. The most expensive ticket in the area and the most impressive room."],
"Cinemex Felix Cuevas Platino":["lux","A small seven-room cinema in Del Valle that is entirely Platino: recliners, waiters, bar. Quiet and exclusive. No big screen."],
"Cinepolis Plaza Carso + VIP Plaza Carso":["lux","Two Cinepolis under one roof in Plaza Carso, next to the Soumaya museum: five standard rooms and four VIP recliner rooms. Free parking with your ticket. Solid but no large format."],
"Cinemex Manacar":["std","A thirteen-room cinema in the Torre Manacar tower on Insurgentes Sur, reopened in 2022. Every room has the wider Premium seats and it programs art-house films too. Regular screens."],
"Cinemex Galerias Insurgentes Market":["std","A Cinemex Market (food hall concept) in Galerias Insurgentes. Not researched in detail yet."],
"Cinepolis Universidad + VIP Universidad":["big","Outside the five-kilometer ring but home to the largest Cinepolis IMAX in the city, about 21 by 14 meters, plus 4DX and VIP."],
"Cinepolis Mitikah + VIP Mitikah":["lux","A huge new Cinepolis in the Mitikah tower complex: 23 rooms including VIP, ScreenX, 4DX and a kids' room with a playground. Outside the ring."],
"Cine Tonala":["art","The neighborhood art-house, in Roma Sur. One screen with a 4K projector and Dolby Atmos sound after a 2021 refit, plus a bar, a pizza kitchen and a bookstore. Indie and foreign films, restorations, festivals, and stand-up on other nights. The place to take a friend who likes cinema more than blockbusters."],
"Centro Cultural Bella Epoca, Cine Lido":["free","The old Cine Lido in Condesa, now a bookstore and cafe with a 150-seat screening room. The national film archive shows free classic Mexican films here on a loose schedule. Not a daily cinema, but it is the only screen inside Condesa proper."],
"Teatro Casa de la Paz (UAM)":["free","A university theatre in Roma Norte that hosts occasional film events and festival screenings."],
"Goethe-Institut Mexiko":["free","The German cultural institute on Tonala street runs open-air patio screenings and cheap film cycles."],
"Centro Cultural Xavier Villaurrutia":["free","A city cultural center at Glorieta de Insurgentes with free film screenings on a monthly calendar."],
"CASUL, Casa Universitaria del Libro (UNAM)":["free","A UNAM bookhouse in Roma Norte with monthly free screenings from the university film archive."],
"Centro de Cultura Digital, Cine Mas Alla":["free","The digital culture center under the Estela de Luz on Reforma. Experimental films and festival screenings, free, when there is a program."],
"Museo Casa de Carranza, Cineclub Julia Carranza":["free","A museum cineclub on Rio Lerma with free weekday-afternoon screenings."],
"Museo Tamayo":["free","The Tamayo museum auditorium in Chapultepec runs occasional free Mexican film cycles."],
"Cine Club Quinta Colorada":["free","A free Thursday cineclub in a historic house in the first section of Chapultepec park, relaunched in 2025."],
"Casa del Lago UNAM, Sala Lumiere":["free","The UNAM cultural house on the Chapultepec lake, with the Sala Lumiere screening room from 1961. Free film cycles and festival screenings."],
"La Casa del Cine MX":["art","A two-room indie cinema in a Centro apartment building: a 45-seat room and a 17-seat room, films played from Blu-ray, with a cafe. Cheap tickets, festival films, a cinephile hangout."],
"Cinematografo del Chopo (Filmoteca UNAM)":["art","The university film archive's cinema at Museo del Chopo. One room of about 130 seats that can still run 35 mm film. Restorations, retrospectives and festival premieres, daily, very cheap."],
"Cineclub Santa Rosa":["free","A free LGBTQ+ cineclub with mezcal and food, near the Alameda."],
"Centro Cultural Jose Marti":["free","A city cultural center by the Alameda with film cycles for about the price of a coffee."],
"Centro Cultural de Espana, Espacio X":["free","The Spanish cultural center behind the cathedral, with a 100-seat room used for free film cycles and festivals, and a rooftop bar."],
"Salon Rojo":["free","A cult-film cineclub in Centro, free every Thursday night, reopened in 2025."],
"Biblioteca Vasconcelos auditorium":["free","The big library in Buenavista occasionally hosts free screenings."],
"Bar cineclubs: Q'Pedro Pablo, YuYu":["free","Two bars in Juarez that run free film nights: one with coffee and craft beer on Mondays, one with experimental films and DJs on weekends."]

/* =====================================================================
   SALA NEARBY
   Two data sources, deliberately kept apart.

   SHOWS is live: 5,445 real sessions pulled from the endpoint cinemex.com
   itself calls, with real auditorium names, seat availability and checkout
   links. It is a SNAPSHOT with a timestamp on it, not a live feed -- a
   published page cannot fetch across origins, so the page says when it was
   read and links straight to the cinema's own page for the live version.

   V is curated: 42 venues with every claim tagged verified / likely /
   unknown. It knows which IMAX is laser, which rooms are Casa de Arte, what
   a ticket costs and where 35 mm survives. No ticketing app carries that,
   and it is the reason this is not just a worse Fandango.

   Nineteen cinemas appear in both and are shown merged. Thirteen have live
   times and no audit (they are outside the original 5 km study) and say so.
   The rest are audit-only -- the independents, the free cineclubs, the
   Filmoteca -- and no ticketing app lists them at all. Every count the page
   PRINTS is computed from the data rather than written into the prose, because
   a hardcoded "twenty-three" was rendering next to a list of nineteen.
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const HOME = { lat: 19.4117, lng: -99.1690, name: "Parque Mexico" };
let origin = { ...HOME };
let liveLoc = false;

function km(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dp = (b.lat - a.lat) * r, dl = (b.lng - a.lng) * r;
  const h = Math.sin(dp / 2) ** 2 +
    Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const walkMin = d => Math.max(1, Math.round(d / 0.075));   // 4.5 km/h
function far(d) {
  const w = walkMin(d);
  return { d: d < 1 ? Math.round(d * 1000) + " m" : d.toFixed(1) + " km",
           w: w <= 40 ? w + " min walk" : Math.round(d / 0.35) + " min drive" };
}

/* ---------- format vocabulary ---------- */
const FT = {
  imax: ["IMAX", "imax"], dolby_atmos: ["Atmos", "atmos"], platinum: ["Platino", "plat"],
  premium: ["Premium", ""], "infinity-vision": ["Infinity", ""], v3d: ["3D", ""],
  lang_sub: ["Subtitled", "sub"], lang_es: ["Dubbed", "dub"], traditional: ["Standard", ""],
};
function fmtBadges(types) {
  return (types || []).filter(t => FT[t]).map(t => {
    const [label, cls] = FT[t];
    return `<span class="badge ${cls}">${esc(label)}</span>`;
  }).join(" ");
}

/* ---------- state ---------- */
const S = {
  day: 0,
  filter: "all",   // all | now | sub | imax | atmos | plat
  tab: "shows",
};
try { const t = localStorage.getItem("sala.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

/* the day the snapshot was taken, so "today" means the right row */
const DAYS = SHOWS.days;
function dayLabel(iso, i) {
  const d = new Date(iso + "T12:00:00");
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const diff = Math.round((d - today) / 86400000);
  const dow = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getDay()];
  if (diff === 0) return { b: "Today", e: dow + " " + d.getDate() };
  if (diff === 1) return { b: "Tomorrow", e: dow + " " + d.getDate() };
  return { b: dow, e: d.getDate() + "/" + (d.getMonth() + 1) };
}
function nowMins() { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }
function isToday(iso) {
  const d = new Date(iso + "T12:00:00"), t = new Date(); t.setHours(12, 0, 0, 0);
  return +d === +t;
}
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");

/* ---------- filters ---------- */
function passes(fmtIdx, mins, dayIso) {
  const t = SHOWS.fmts[fmtIdx].t || [];
  switch (S.filter) {
    case "now": return isToday(dayIso) && mins >= nowMins() - 10 && mins <= nowMins() + 240;
    case "sub": return t.includes("lang_sub");
    case "imax": return t.includes("imax");
    case "atmos": return t.includes("dolby_atmos");
    case "plat": return t.includes("platinum");
    default: return true;
  }
}

/* ---------- distance-aware cinema list ---------- */
function cinemasSorted() {
  return SHOWS.cin.map(c => ({ ...c, dist: km(origin, { lat: c.lat, lng: c.lng }) }))
    .sort((a, b) => a.dist - b.dist);
}

/* ===================== SHOWTIMES ===================== */
function renderDates() {
  // Only days that actually carry sessions, and only the next fortnight -- the tail of
  // the advance-sales window is three lonely showings in mid-October and a date chip for
  // each of those is noise, not choice.
  const have = new Set();
  SHOWS.cin.forEach(c => c.s.forEach(s => have.add(s[2])));
  const idxs = [...have].sort((a, b) => a - b).slice(0, 14);
  $("dates").innerHTML = idxs.map(i => {
    const L = dayLabel(DAYS[i], i);
    return `<button class="day" data-day="${i}" aria-pressed="${S.day === i}">
      <b>${esc(L.b)}</b><em>${esc(L.e)}</em></button>`;
  }).join("");
}
function renderFilters() {
  const opts = [["all", "Everything"], ["now", "Starting soon"], ["sub", "Subtitled"],
                ["imax", "IMAX"], ["atmos", "Atmos"], ["plat", "Platino"]];
  $("filters").innerHTML = opts.map(([k, l]) =>
    `<button data-filter="${k}" aria-pressed="${S.filter === k}">${esc(l)}</button>`).join("");
}

function renderShows() {
  const dayIso = DAYS[S.day];
  const cins = cinemasSorted();
  let total = 0, shown = 0;
  const html = cins.map(c => {
    // group this cinema's sessions for the chosen day: film -> format -> times
    const byFilm = new Map();
    for (const s of c.s) {
      if (s[2] !== S.day) continue;
      total++;
      if (!passes(s[1], s[3], dayIso)) continue;
      shown++;
      if (!byFilm.has(s[0])) byFilm.set(s[0], new Map());
      const fm = byFilm.get(s[0]);
      if (!fm.has(s[1])) fm.set(s[1], []);
      fm.get(s[1]).push(s);
    }
    if (!byFilm.size) return "";
    const F = far(c.dist);
    const v = c.v != null ? V[c.v] : null;
    const films = [...byFilm.entries()]
      .sort((a, b) => (SHOWS.films[b[0]].c || 0) - (SHOWS.films[a[0]].c || 0))
      .map(([fid, fmMap]) => {
        const f = SHOWS.films[fid];
        const vers = [...fmMap.entries()].map(([fi, list]) => {
          const fmt = SHOWS.fmts[fi];
          list.sort((a, b) => a[3] - b[3]);
          const chips = list.map(s => {
            const past = isToday(dayIso) && s[3] < nowMins();
            const soon = isToday(dayIso) && !past && s[3] - nowMins() <= 75;
            const low = s[4] === "l";
            const cls = ["t", past ? "past" : "", soon ? "soon" : "", low ? "low" : ""].join(" ").trim();
            const href = s[5] ? `https://cinemex.com/checkout/${encodeURIComponent(s[5])}` : "#";
            return `<a class="${cls}" href="${href}" target="_blank" rel="noopener"
              aria-label="${esc(hhmm(s[3]))} ${esc(f.n)} ${esc(s[6] || "")}">${hhmm(s[3])}${low ? "<em>few</em>" : ""}</a>`;
          }).join("");
          return `<div class="vgrp"><div class="vl">${fmtBadges(fmt.t)}<span>${esc(fmt.l)}</span></div>
            <div class="times">${chips}</div></div>`;
        }).join("");
        return `<div class="film"><div class="ft"><b>${esc(f.n)}</b>
          <span>${esc([f.d, f.r, (f.g || [])[0]].filter(Boolean).join(" · "))}</span></div>${vers}</div>`;
      }).join("");
    return `<div class="cin">
      <button class="hdr" data-cin="${c.id}">
        <span><span class="n">${esc(c.n)}</span>
          <span class="s">${esc(v ? (v.op + (c.p ? " · Platino" : "")) : "Cinemex" + (c.p ? " · Platino" : ""))}${v ? "" : " · no audit yet"}</span></span>
        <span class="far"><b>${F.d}</b><em>${F.w}</em></span>
      </button>${films}</div>`;
  }).join("");
  $("showlist").innerHTML = html || `<div class="empty"><b>Nothing matches</b>
    Try another day, or clear the filter.</div>`;
  const lbl = { all: "showings", now: "starting in the next four hours", sub: "subtitled showings",
                imax: "IMAX showings", atmos: "Dolby Atmos showings", plat: "Platino showings" }[S.filter];
  $("scount").innerHTML = `<b>${shown}</b> ${esc(lbl)} &middot; ${cins.length} cinemas`;
  $("stamp").innerHTML =
    `<b>Showtimes read ${esc(SHOWS.at.replace("T", " "))}</b> from Cinemex's own listings.
     They are a snapshot, not a live feed &mdash; tap a time to open Cinemex and book, which is
     always current. Cin&eacute;polis and the independents are in the Guide with their own links;
     their showtimes are not machine-readable the same way.`;
}

/* ===================== FILMS ===================== */
function renderFilms() {
  const cins = cinemasSorted();
  const rows = Object.entries(SHOWS.films).map(([fid, f]) => {
    let n = 0, near = null, types = new Set();
    for (const c of cins) {
      for (const s of c.s) {
        if (String(s[0]) !== String(fid) || s[2] !== S.day) continue;
        n++;
        (SHOWS.fmts[s[1]].t || []).forEach(t => types.add(t));
        if (!near) near = c;
      }
    }
    return { fid, f, n, near, types: [...types] };
  }).filter(r => r.n).sort((a, b) => b.n - a.n);

  $("fcount").innerHTML = `<b>${rows.length}</b> films playing ${S.day === 0 ? "today" : "that day"} near you`;
  $("filmlist").innerHTML = rows.map(r => {
    const F = r.near ? far(km(origin, { lat: r.near.lat, lng: r.near.lng })) : null;
    return `<button class="frow" data-film="${esc(r.fid)}">
      <span><span class="n">${esc(r.f.n)}</span>
        <span class="s">${esc([r.f.d, r.f.r, (r.f.g || []).join(", ")].filter(Boolean).join(" · "))}
          ${r.near ? "&middot; nearest " + esc(r.near.n) + (F ? " " + F.d : "") : ""}</span>
        <span class="fm">${fmtBadges(r.types)}</span></span>
      <span class="cnt"><b>${r.n}</b><em>showings</em></span></button>`;
  }).join("") || `<div class="empty"><b>Nothing that day</b></div>`;
}

/* ===================== SHEETS ===================== */
function gmaps(lat, lng, name) {
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
}
function openSheet(headHtml, goHtml, bodyHtml, accent) {
  $("sheethead").innerHTML = headHtml;
  $("sheetgo").innerHTML = goHtml;
  $("sheetbody").innerHTML = bodyHtml;
  $("sheethead").style.setProperty("--cat", accent || "var(--lamp)");
  $("sheet").classList.add("on"); $("scrim").classList.add("on");
  $("sheet").setAttribute("aria-hidden", "false");
  $("sheetbody").scrollTop = 0;
}
function closeSheet() {
  $("sheet").classList.remove("on"); $("scrim").classList.remove("on");
  $("sheet").setAttribute("aria-hidden", "true");
}

function cinemaSheet(cid) {
  const c = SHOWS.cin.find(x => String(x.id) === String(cid));
  if (!c) return;
  const d = km(origin, { lat: c.lat, lng: c.lng }), F = far(d);
  const v = c.v != null ? V[c.v] : null;
  const plain = v && PLAIN[v.name] ? PLAIN[v.name][1] : "";
  const head = `<div><h2>${esc(c.n)}</h2><div class="addr">${esc(c.a || (v && v.addr) || "")}</div></div>
    <div class="far"><b>${F.d}</b><em>${F.w}</em></div>`;
  const go = `<a class="pri" href="${gmaps(c.lat, c.lng)}" target="_blank" rel="noopener">Walk me there</a>
    <a href="https://cinemex.com/cinema/${c.id}" target="_blank" rel="noopener">Live times &amp; book</a>
    ${c.ph ? `<a href="tel:${esc(String(c.ph).replace(/[^0-9+]/g, ""))}">Call</a>` : ""}`;
  // what it actually has, from the live data
  const types = new Set(); let today = 0;
  c.s.forEach(s => { if (s[2] === S.day) { today++; (SHOWS.fmts[s[1]].t || []).forEach(t => types.add(t)); } });
  let body = plain ? `<p class="plain">${esc(plain)}</p>` : "";
  body += `<div class="sec"><h3>On that day</h3>
    <p style="margin:0;font-size:13.5px;line-height:1.5">${today} showings.
    ${[...types].filter(t => FT[t]).map(t => FT[t][0]).join(", ") || "Standard rooms"}.</p></div>`;
  if (v && v.spec) {
    body += `<div class="sec"><h3>The audit</h3><dl class="spec">` + v.spec.map(([k, txt, conf]) =>
      `<dt>${esc(k)}</dt><dd>${esc(txt)} <span class="tag ${esc(conf)}">${
        conf === "v" ? "verified" : conf === "l" ? "likely" : "unknown"}</span></dd>`).join("") +
      `</dl></div>`;
  } else {
    body += `<div class="sec"><h3>The audit</h3><p style="margin:0;font-size:13.5px;color:var(--ink-2)">
      This one is outside the original five-kilometre study, so its screens and prices have not been
      checked by hand. The showtimes above are real.</p></div>`;
  }
  openSheet(head, go, body, "var(--c-std)");
}

function filmSheet(fid) {
  const f = SHOWS.films[fid];
  if (!f) return;
  const cins = cinemasSorted();
  const rows = [];
  for (const c of cins) {
    const list = c.s.filter(s => String(s[0]) === String(fid) && s[2] === S.day);
    if (list.length) rows.push([c, list.sort((a, b) => a[3] - b[3])]);
  }
  const head = `<div><h2>${esc(f.n)}</h2><div class="addr">${
    esc([f.o && f.o !== f.n ? f.o : "", f.d, f.r, (f.g || []).join(", "), f.dir].filter(Boolean).join(" · "))}</div></div>`;
  const go = rows.length
    ? `<a class="pri" href="${gmaps(rows[0][0].lat, rows[0][0].lng)}" target="_blank" rel="noopener">Walk to the nearest</a>`
    : "";
  const body = `<div class="sec"><h3>${rows.length} cinemas, nearest first</h3></div>` + rows.map(([c, list]) => {
    const F = far(km(origin, { lat: c.lat, lng: c.lng }));
    const byFmt = new Map();
    list.forEach(s => { if (!byFmt.has(s[1])) byFmt.set(s[1], []); byFmt.get(s[1]).push(s); });
    const vers = [...byFmt.entries()].map(([fi, l]) => {
      const fmt = SHOWS.fmts[fi];
      const chips = l.map(s => {
        const past = isToday(DAYS[S.day]) && s[3] < nowMins();
        const href = s[5] ? `https://cinemex.com/checkout/${encodeURIComponent(s[5])}` : "#";
        return `<a class="t ${past ? "past" : ""}" href="${href}" target="_blank" rel="noopener">${hhmm(s[3])}</a>`;
      }).join("");
      return `<div class="vgrp"><div class="vl">${fmtBadges(fmt.t)}<span>${esc(fmt.l)}</span></div>
        <div class="times">${chips}</div></div>`;
    }).join("");
    return `<div class="cin"><button class="hdr" data-cin="${c.id}">
      <span><span class="n">${esc(c.n)}</span></span>
      <span class="far"><b>${F.d}</b><em>${F.w}</em></span></button>${vers}</div>`;
  }).join("");
  openSheet(head, go, body, "var(--c-big)");
}

function venueSheet(i) {
  const v = V[i];
  if (!v) return;
  const d = km(origin, { lat: v.lat, lng: v.lng }), F = far(d);
  const plain = PLAIN[v.name] ? PLAIN[v.name][1] : "";
  const head = `<div><h2>${esc(v.name)}</h2><div class="addr">${esc(v.addr)}</div></div>
    <div class="far"><b>${F.d}</b><em>${F.w}</em></div>`;
  const live = SHOWS.cin.find(c => c.v === i);
  const go = `<a class="pri" href="${gmaps(v.lat, v.lng)}" target="_blank" rel="noopener">Walk me there</a>
    ${live ? `<a href="https://cinemex.com/cinema/${live.id}" target="_blank" rel="noopener">Live times</a>` : ""}`;
  let body = plain ? `<p class="plain">${esc(plain)}</p>` : "";
  body += `<div class="sec"><h3>What it is</h3><dl class="spec">
    <dt>Operator</dt><dd>${esc(v.op)}</dd>
    ${v.salas ? `<dt>Rooms</dt><dd>${esc(v.salas)}</dd>` : ""}
    ${v.price ? `<dt>Price</dt><dd>${esc(v.price)}</dd>` : ""}
    ${v.best ? `<dt>Best room</dt><dd>${esc(v.best)}</dd>` : ""}
    ${v.audio ? `<dt>Audio</dt><dd>${esc(v.audio)}</dd>` : ""}
    ${v.proj ? `<dt>Projection</dt><dd>${esc(v.proj)}</dd>` : ""}
  </dl></div>`;
  if (v.spec) {
    body += `<div class="sec"><h3>The audit</h3><dl class="spec">` + v.spec.map(([k, txt, conf]) =>
      `<dt>${esc(k)}</dt><dd>${esc(txt)} <span class="tag ${esc(conf)}">${
        conf === "v" ? "verified" : conf === "l" ? "likely" : "unknown"}</span></dd>`).join("") + `</dl></div>`;
  }
  openSheet(head, go, body, v.grp === "indie" ? "var(--c-art)" : "var(--c-std)");
}

/* ===================== MAP ===================== */
let map, layer;
const CAT = v => v.grp === "indie" ? "var(--c-art)"
  : (v.f || []).some(x => /IMAX|CinemeXtremo|4DX|ScreenX/i.test(x)) ? "var(--c-big)"
  : (v.f || []).some(x => /Platino|VIP/i.test(x)) ? "var(--c-lux)" : "var(--c-std)";

function initMap() {
  if (map) return;
  map = L.map("map", { center: [HOME.lat, HOME.lng], zoom: 14, minZoom: 13, maxZoom: 18,
    zoomControl: false, attributionControl: true,
    maxBounds: [[19.30, -99.30], [19.52, -99.05]], maxBoundsViscosity: .85, tap: false });
  map.attributionControl.setPrefix("");
  // ESRI'S LIGHT GRAY CANVAS. The artifact baked 7.8 MB of base64 tiles into the page
  // because a published artifact's CSP blocks every image host; on our own domain the
  // layer can just be ordinary, and the service worker caches each tile the first time he
  // pans over it, so the map still works underground on Line 1 once he has seen an area.
  //
  // THREE FREE TILE HOSTS WERE TRIED AND TWO OF THEM ANSWER HTTP 200 WITH A REFUSAL
  // PAINTED INTO THE IMAGE. Same tile, same second:
  //
  //   Esri  Light Gray Canvas   200, 18 KB, a real map
  //   CARTO light_all           200, 24 KB, "API KEY REQUIRED" watermarked across it
  //   OpenStreetMap standard    200,  7 KB, "Access blocked -- App is not following the
  //                                          tile usage policy of OSM's volunteer servers"
  //
  // A status check cannot tell any of those apart. Only looking at the picture can, which
  // is why they were looked at.
  //
  // maxNativeZoom is 16 because 17 and up return a 2,521-byte tile reading "Map data not
  // yet available" -- identical byte-for-byte at 17, 18 and 19, which is the tell. Leaflet
  // upscales past it, which is what the artifact did with its baked tiles too.
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/" +
              "World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    maxNativeZoom: 16, maxZoom: 18, tileSize: 256,
    crossOrigin: true, keepBuffer: 4,
    attribution: "Esri, HERE, Garmin, OpenStreetMap contributors" }).addTo(map);

  const lamp = getComputedStyle(document.documentElement).getPropertyValue("--lamp").trim();
  for (const [r, t] of [[1000, "1 km"], [2000, "2 km"], [3000, "3 km"], [5000, "5 km"]]) {
    L.circle([HOME.lat, HOME.lng], { radius: r, color: lamp, weight: 1.2, dashArray: "3 8",
      fill: false, opacity: .42, interactive: false }).addTo(map);
  }
  L.marker([HOME.lat, HOME.lng], { icon: L.divIcon({ className: "",
    html: '<div style="width:13px;height:13px;border:3px solid var(--lamp);border-radius:50%;background:var(--surface)"></div>',
    iconSize: [13, 13], iconAnchor: [6.5, 6.5] }), interactive: false }).addTo(map)
    .bindTooltip("Parque Mexico", { permanent: true, direction: "top", className: "lbl" });

  // Curated venues, coloured by what kind of place they are.
  V.forEach((v, i) => {
    const c = CAT(v);
    L.circleMarker([v.lat, v.lng], { radius: v.dim ? 5 : 7, color: c, weight: 2,
      fillColor: c, fillOpacity: .55 }).addTo(map).on("click", () => venueSheet(i));
  });
  // Cinemas that have live times but no audit -- drawn smaller and hollow so the map does
  // not imply they were checked to the same depth.
  SHOWS.cin.filter(c => c.v == null).forEach(c => {
    L.circleMarker([c.lat, c.lng], { radius: 4, color: "var(--ink-3)", weight: 1.5,
      fillOpacity: .12 }).addTo(map).on("click", () => cinemaSheet(c.id));
  });

  $("keypanel").innerHTML = [
    ["var(--c-big)", "Large format: IMAX, CinemeXtremo, 4DX, ScreenX"],
    ["var(--c-lux)", "Recliners and waiter service: Platino, VIP"],
    ["var(--c-std)", "Ordinary multiplex"],
    ["var(--c-art)", "Independent, art house, free cineclub"],
  ].map(([c, t]) => `<div class="r"><i style="background:${c}"></i>${esc(t)}</div>`).join("") +
    `<div class="note">A hollow grey dot has live showtimes but was not audited by hand &mdash;
     it sits outside the original five-kilometre study.</div>`;
}

/* ===================== GUIDE ===================== */
function renderGuide() {
  const indies = V.map((v, i) => ({ v, i })).filter(x => x.v.grp === "indie");
  const nearest = (pred) => V.map((v, i) => ({ v, i, d: km(origin, { lat: v.lat, lng: v.lng }) }))
    .filter(x => pred(x.v)).sort((a, b) => a.d - b.d)[0];
  const picks = [
    ["Closest screen", nearest(() => true)],
    ["Closest IMAX", nearest(v => (v.f || []).some(f => /IMAX/i.test(f)))],
    ["Best independent", nearest(v => v.name.indexOf("Tonala") >= 0)],
    ["35 mm still runs", nearest(v => (v.f || []).some(f => /35 mm/i.test(f)))],
  ].filter(x => x[1]);
  $("doc-guide").innerHTML = `
    <p class="lede">Forty-two places within about five kilometres of Parque Mexico, audited one by
    one. Every claim is tagged: <span class="tag v">verified</span> means it was read off the
    operator's own listing, <span class="tag l">likely</span> means one good source said so, and
    <span class="tag u">unknown</span> means nobody publishes it. This is the part no ticketing app
    has.</p>
    <h2>Nearest of each kind</h2>
    <div class="picks">${picks.map(([k, x]) =>
      `<button class="pick" data-venue="${x.i}"><span class="k">${esc(k)}</span>
        <span class="n">${esc(x.v.name.replace(/^Cinemex |^Cinepolis /, ""))}</span>
        <span class="d">${far(x.d).d} &middot; ${far(x.d).w}</span></button>`).join("")}</div>
    <h2>What the formats actually mean</h2>
    ${[["IMAX with Laser", "A 4K laser projector, twelve channels of sound and a 1.90:1 screen. In this area only Cinemex Parque Delta and Cinemex Antara have it. Antara's is billed as the largest in Latin America at about 300 square metres."],
       ["CinemeXtremo (CX)", "Cinemex's own big-screen room, usually with Dolby Atmos. Cheaper than IMAX and often the same film."],
       ["Dolby Atmos", "Speakers overhead as well as around. You hear it most in a room built for it, which here means the CX rooms."],
       ["Platino", "Full recliners, a waiter, a menu. A flat price, usually 200 to 230 pesos. It is about the seat, not the screen."],
       ["Premium", "Just a wider, softer seat. Not a format. Most Cinemex sites near Roma sell every seat as Premium."],
       ["Casa de Arte", "Cinemex's art-house programming: restorations, festival films, subtitled. Insurgentes and Reforma are the closest."],
       ["Subtitulada vs Espanol", "Subtitled versus dubbed. Worth checking before you book &mdash; most family films only play dubbed."],
      ].map(([h, t]) => `<div class="card"><h3>${esc(h)}</h3><p class="tech">${esc(t)}</p></div>`).join("")}
    <h2>What is not here at all</h2>
    <table class="ruled">
      <tr><td>Dolby Cinema</td><td>Nowhere in Mexico City.</td></tr>
      <tr><td>70 mm</td><td>Nowhere in Mexico City.</td></tr>
      <tr><td>1.43:1 IMAX</td><td>Nowhere in Mexico. Every IMAX here is the 1.90:1 digital kind.</td></tr>
      <tr><td>35 mm</td><td>Survives at Cinematografo del Chopo, Filmoteca UNAM.</td></tr>
    </table>
    <h2>The independents and the free rooms</h2>
    <p class="lede">${indies.length} of the ${V.length}. None of these appear in a ticketing app,
    several are free, and one of them is the only screening room actually inside Condesa.</p>
    ${indies.map(x => {
      const d = km(origin, { lat: x.v.lat, lng: x.v.lng });
      return `<button class="frow" data-venue="${x.i}">
        <span><span class="n">${esc(x.v.name)}</span>
          <span class="s">${esc(x.v.op)}${x.v.price ? " &middot; " + esc(x.v.price) : ""}</span></span>
        <span class="cnt"><b>${far(d).d}</b><em>${esc(far(d).w)}</em></span></button>`;
    }).join("")}
    <h2>How this was made</h2>
    <p class="lede">Showtimes come from Cinemex's own public listings and were read at
    ${esc(SHOWS.at.replace("T", " "))}. The venue audit was done by hand in September 2026.
    Distances are straight-line from ${esc(origin.name || "where you are")}; walking time assumes
    4.5 km/h, which is optimistic on Insurgentes.</p>`;
}

/* ===================== WIRING ===================== */
function setTab(t) {
  S.tab = t;
  document.querySelectorAll(".tabs button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  ["shows", "map", "films", "guide"].forEach(k =>
    $("pane-" + k).classList.toggle("on", k === t));
  if (t === "map") { initMap(); setTimeout(() => map && map.invalidateSize(), 60); }
  if (t === "films") renderFilms();
  if (t === "guide") renderGuide();
}
document.addEventListener("click", e => {
  const tab = e.target.closest(".tabs button"); if (tab) return setTab(tab.dataset.tab);
  const day = e.target.closest("[data-day]");
  if (day) { S.day = +day.dataset.day; renderDates(); renderShows();
             if (S.tab === "films") renderFilms(); return; }
  const f = e.target.closest("[data-filter]");
  if (f) { S.filter = f.dataset.filter; renderFilters(); renderShows(); return; }
  const cin = e.target.closest("[data-cin]"); if (cin) return cinemaSheet(cin.dataset.cin);
  const film = e.target.closest("[data-film]"); if (film) return filmSheet(film.dataset.film);
  const ven = e.target.closest("[data-venue]"); if (ven) return venueSheet(+ven.dataset.venue);
  if (e.target.closest("#scrim")) return closeSheet();
  if (e.target.closest("#keybtn")) { $("keypanel").classList.toggle("on"); return; }
  if (e.target.closest("#keypanel")) { $("keypanel").classList.remove("on"); return; }
  if (e.target.closest("#zin")) return map && map.zoomIn();
  if (e.target.closest("#zout")) return map && map.zoomOut();
  if (e.target.closest("#recenter")) return map && map.setView([HOME.lat, HOME.lng], 14);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

$("themebtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("sala.theme", next); } catch (e) {}
});

$("locbtn").addEventListener("click", () => {
  if (liveLoc) {
    liveLoc = false; origin = { ...HOME };
    $("locbtn").setAttribute("aria-pressed", "false");
    $("fromk").textContent = "Distances from"; $("fromn").textContent = HOME.name;
    renderShows(); if (S.tab === "films") renderFilms(); if (S.tab === "guide") renderGuide();
    return;
  }
  if (!navigator.geolocation) { $("fromn").textContent = "Location unavailable"; return; }
  $("fromk").textContent = "Finding you";
  navigator.geolocation.getCurrentPosition(p => {
    origin = { lat: p.coords.latitude, lng: p.coords.longitude, name: "where you are" };
    liveLoc = true;
    $("locbtn").setAttribute("aria-pressed", "true");
    $("fromk").textContent = "Distances from"; $("fromn").textContent = "Where you are standing";
    renderShows(); if (S.tab === "films") renderFilms(); if (S.tab === "guide") renderGuide();
  }, () => {
    $("fromk").textContent = "Distances from";
    $("fromn").textContent = HOME.name + " (location refused)";
  }, { enableHighAccuracy: true, timeout: 8000 });
});

/* start on today if the snapshot has it */
const todayIdx = DAYS.findIndex(isToday);
S.day = todayIdx >= 0 ? todayIdx : 0;
renderDates(); renderFilters(); renderShows();

</script>


<script>
// The launch screen goes as soon as the map and the lists exist, not on `load` -- `load`
// waits for every font and tile and would sit there for a second on a cold cellular
// connection. requestAnimationFrame twice guarantees one painted frame first, so the
// fade never reveals a half-built page.
requestAnimationFrame(function () { requestAnimationFrame(function () {
  var b = document.getElementById("boot");
  if (b) { b.classList.add("gone"); setTimeout(function () { b.remove(); }, 320); }
}); });

// Offline. Registered after load so it never competes with the first paint.
if ("serviceWorker" in navigator) {
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}

// Add to Home Screen, offered once, only where the browser supports the prompt -- which
// is Android and desktop Chrome. iOS has no such API, so iOS gets the instructions
// instead, and only in Safari, and only when not already installed.
var deferred = null;
addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); deferred = e; showInstall(function () {
    deferred.prompt(); deferred = null;
  });
});
(function () {
  var standalone = matchMedia("(display-mode: standalone)").matches
                || navigator.standalone === true;
  if (standalone || localStorage.getItem("sala.install") === "done") return;
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent)
         || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var safari = ios && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);
  if (safari) setTimeout(function () { showInstall(null); }, 2600);
})();
function showInstall(onTap) {
  var d = document.createElement("div");
  d.setAttribute("role", "dialog");
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);"
    + "z-index:1200;background:var(--surface);border:1px solid var(--line);border-radius:16px;"
    + "padding:14px 16px;box-shadow:0 8px 34px rgba(0,0,0,.28);display:grid;gap:9px;"
    + "font-family:'Bricolage Grotesque',system-ui,sans-serif;max-width:520px;margin:0 auto";
  d.innerHTML = '<div style="font-weight:700;font-size:15.5px;letter-spacing:-.01em">Put it on your home screen</div>'
    + '<div style="font-size:13.5px;line-height:1.45;color:var(--ink-2)">'
    + (onTap ? 'Installs like an app. No store, nothing to pay.'
             : 'Tap Share, then <b>Add to Home Screen</b>. It opens full screen with no browser bars, and works with no signal.')
    + '</div><div style="display:flex;gap:8px;margin-top:2px">'
    + (onTap ? '<button id="sala-ok" style="flex:1;min-height:44px;border-radius:11px;background:var(--lamp);color:var(--lamp-ink);font-weight:700;font-size:14px">Install</button>' : '')
    + '<button id="sala-no" style="flex:' + (onTap ? '0 0 34%' : '1') + ';min-height:44px;border-radius:11px;'
    + 'border:1px solid var(--line);background:var(--sunk);font-weight:600;font-size:14px">'
    + (onTap ? 'Not now' : 'Got it') + '</button></div>';
  document.body.appendChild(d);
  var close = function () { localStorage.setItem("sala.install", "done"); d.remove(); };
  d.querySelector("#sala-no").onclick = close;
  if (onTap) d.querySelector("#sala-ok").onclick = function () { close(); onTap(); };
}
</script>
