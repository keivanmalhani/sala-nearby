    const on = k === "all" ? !S.filters.size : S.filters.has(k);
    // A lit chip is never disabled. Without this an active chip greys out the moment it
    // is the only thing standing between him and an empty list, and then he cannot tap
    // it off again.
    const dead = !counts[k] && !on;
    return `<button data-filter="${k}" aria-pressed="${on}"${dead ? " disabled" : ""}
      ${dead ? `aria-label="${esc(l)}, nothing on this day"` : ""}>${esc(l)}</button>`;
  }).join("");
  // Both lists carry the rail, because the preference is saved and a film quietly missing
  // from the Films tab with no visible reason is worse than no filter at all. Same
  // pattern as the search box, which is already two inputs sharing one piece of state.
  ["filters", "ffilters"].forEach(id => { const el = $(id); if (el) el.innerHTML = draw; });
}

function renderShows() {
  const dayIso = DAYS[S.day];
  const cins = cinemasSorted();
  let total = 0, shown = 0, withAny = 0, unlisted = 0;
  const html = cins.map(c => {
    // group this cinema's sessions for the chosen day: film -> format -> times
    const byFilm = new Map();
    for (const s of c.s) {
      if (s[2] !== S.day) continue;
      total++;
      if (!passes(s[1], s[3], dayIso, null, s[0], c)) continue;
      if (!matchesQuery(SHOWS.films[s[0]])) continue;
      shown++;
      // How many of what he is looking at are Cineteca screenings with no language on
      // them. It decides one word in the count line, and only when the Subtitled chip
      // is the reason they are here.
      if ((SHOWS.fmts[s[1]].t || []).includes("lang_unknown")) unlisted++;
      if (!byFilm.has(s[0])) byFilm.set(s[0], new Map());
      const fm = byFilm.get(s[0]);
      if (!fm.has(s[1])) fm.set(s[1], []);
      fm.get(s[1]).push(s);
    }
    if (!byFilm.size) return "";
    withAny++;
    const F = far(c.dist);
    // The soonest showing here that he could still sit down for, across every film left
    // after the filters and the search -- so the line answers the question he is actually
    // asking while scanning this list: is this cinema still catchable.
    let nextStart = null;
    if (isToday(dayIso)) {
      for (const [, fm] of byFilm) {
        for (const [, list] of fm) {
          for (const x of list) {
            if (x[3] >= nowMins() && (nextStart === null || x[3] < nextStart)) nextStart = x[3];
          }
        }
      }
    }
    const lv = nextStart === null ? null : leaveBy(nextStart, c.dist, dayIso);
    const v = c.v != null ? V[c.v] : null;
    const films = [...byFilm.entries()]
      .sort((a, b) => (isStarred(b[0]) - isStarred(a[0])) || (SHOWS.films[b[0]].c || 0) - (SHOWS.films[a[0]].c || 0))
      .map(([fid, fmMap]) => {
        const f = SHOWS.films[fid];
        const vers = [...fmMap.entries()].map(([fi, list]) => {
          const fmt = SHOWS.fmts[fi];
          list.sort((a, b) => a[3] - b[3]);
          const chips = list.map(s => {
            const past = isToday(dayIso) && s[3] < nowMins();
            const soon = isToday(dayIso) && !past && s[3] - nowMins() <= 75;
            const low = s[4] === "l", mid = s[4] === "m";
            const cls = ["t", past ? "past" : "", soon ? "soon" : "",
                         low ? "low" : mid ? "mid" : ""].join(" ").trim();
            const href = ticketUrl(s);
            // In the label rather than on the face of the chip. A second line on every
            // time would double the height of this list, which is the same objection the
            // price tag is grouped for -- but there is no cost to saying it out loud.
            const lvs = past ? null : leaveBy(s[3], c.dist, dayIso);
            return `<a class="${cls}" href="${href}" target="_blank" rel="noopener"
              aria-label="${esc(hhmm(s[3]))} ${esc(f.n)} ${esc(s[6] || "")}${
                lvs === null ? "" : lvs <= nowMins() ? ", leave now" : ", leave at " + hhmm(lvs)
              }">${hhmm(s[3])}${
              low ? "<em>few</em>" : mid ? "<em>filling</em>" : ""}</a>`;
          }).join("");
          // THE PRICE, ON THE VERSION GROUP RATHER THAN ON EVERY CHIP. It is a
          // per-cinema, per-format number, which is exactly this line's granularity, and
          // putting it on each chip would add a second row to every time and double the
          // height of the list -- the same problem the badge `cap` exists to solve.
          //
          // 93% of showings sit behind a cinema-and-format pair that has an observed
          // price. Where there is none, nothing is drawn rather than a placeholder.
          const price = isCineteca(c.id)
            ? (DETAIL && DETAIL.cineteca_price ? DETAIL.cineteca_price.general : null)
            : priceOf(c.id, fmt.l);
          const ptag = price != null
            ? `<span class="pri" title="Adult ticket, read from the cinema's own checkout. A premiere or a promo day can differ.">${pesos(price)}</span>`
            : "";
          return `<div class="vgrp"><div class="vl">${versionLabel(fmt)}${ptag}</div>
            <div class="times">${chips}</div></div>`;
        }).join("");
        return `<div class="film">${posterCard(fid, f.n, "", true)}
          <div class="fb"><div class="ft"><b>${isStarred(fid) ? STAR_MARK : ""}${esc(f.n)}</b>
          <span>${esc([f.d, (f.g || [])[0]].filter(Boolean).join(" · "))}</span></div>${vers}</div></div>`;
      }).join("");
    return `<div class="cin">
      <button class="hdr" data-cin="${c.id}">
        <span><span class="n">${esc(c.n)}</span>
          <span class="s">${esc((v ? v.op : chainOf(c)) + (c.p ? " · Platino" : ""))}${
            v ? "" : " · no audit yet"}${cinBits(c)}</span></span>
        <span class="far"><b>${F.d}</b><em>${F.w}</em></span>
        ${lv === null ? "" : `<span class="lv${lv <= nowMins() ? " now" : ""}">${
          lv <= nowMins() ? "Leave now" : "Leave " + hhmm(lv)} for the ${hhmm(nextStart)}</span>`}
      </button>${films}</div>`;
  }).join("");
  $("showlist").innerHTML = html || (S.q
    ? `<div class="empty"><b>No film called that</b>
       Nothing playing this day matches &ldquo;${esc(S.q)}&rdquo;. Try another day, or clear the box.</div>`
    : `<div class="empty"><b>Nothing matches</b>
       Try another day, or tap Everything to clear the filters.</div>`);
  let lbl = countLabel(shown, S.filters.has("sub") ? unlisted : 0);
  $("scount").innerHTML = staleLine() + `<b>${shown}</b> ${esc(lbl)}${
    S.q ? ` matching &ldquo;${esc(S.q)}&rdquo;` : ""} &middot; ${withAny} ${
    withAny === 1 ? "cinema" : "cinemas"}`;
  /* THE GUIDE TAB IS GONE, so this no longer points at it. It said "Cinepolis and the
     independents are in the Guide with their own links" for the whole afternoon after the
     tab was removed, which is a footnote pointing at a place that does not exist. */
  $("stamp").innerHTML =
    `<b>Showtimes read ${esc(SHOWS.at.replace("T", " "))}</b> from Cinemex and Cineteca
     Nacional's own listings. They are a snapshot, not a live feed &mdash; tap a time to open
     the cinema's own checkout, which is always current. Cin&eacute;polis is not here: it
     publishes nothing a page like this can read, and its own site is the only way to see
     its times.`;
}

/* ===================== FILMS ===================== */
function renderFilms() {
  const cins = cinemasSorted();
  const dayIso = DAYS[S.day];
  const rows = Object.entries(SHOWS.films).map(([fid, f]) => {
    let n = 0, near = null, types = new Set();
    for (const c of cins) {
      for (const s of c.s) {
        if (String(s[0]) !== String(fid) || s[2] !== S.day) continue;
        // THE FILTERS APPLY HERE TOO, now that they are a saved preference. A standing
        // "subtitled" honoured by one list and not the other is worse than no preference:
        // the two lists disagree about how many showings a film has and neither says why.
        if (!passes(s[1], s[3], dayIso, null, s[0], c)) continue;
        n++;
        (SHOWS.fmts[s[1]].t || []).forEach(t => types.add(t));
        if (!near) near = c;
      }
    }
    return { fid, f, n, near, types: [...types] };
  }).filter(r => r.n && matchesQuery(r.f)).sort((a, b) => (isStarred(b.fid) - isStarred(a.fid)) || b.n - a.n);

  // Same word, same reason, on the Films count line.
  const unlisted = rows.reduce((a, r) => a + (r.types.includes("lang_unknown") ? 1 : 0), 0);
  const w = filterWords(S.filters.has("sub") ? unlisted : 0);
  const nf = (w ? w + " " : "") + (rows.length === 1 ? "film" : "films");
  // WHAT IS ON LATER. The app opens on today and the only way to find a one-night
  // screening three weeks out is to tap along the day rail, thirty chips of it. Twenty
  // of the eighty films in this payload are not on today at all.
  const runs = filmRuns();
  const later = S.filters.has("now") ? []
    : [...runs.values()].filter(r => r.first > S.day)
        .sort((a, b) => a.first - b.first || b.n - a.n);
  $("fcount").innerHTML = staleLine() + (S.q
    ? `<b>${rows.length}</b> ${esc(nf)} matching &ldquo;${esc(S.q)}&rdquo; ${isToday(dayIso) ? "today" : "that day"}`
    : `<b>${rows.length}</b> ${esc(nf)} playing ${isToday(dayIso) ? "today" : "that day"} ${esc(whereFrom())}`);
  if (later.length) $("fcount").innerHTML +=
    ` &middot; ${later.length} more start${later.length === 1 ? "s" : ""} later`;
  $("filmlist").innerHTML = rows.map(r => {
    const F = r.near ? far(km(origin, { lat: r.near.lat, lng: r.near.lng })) : null;
    return `<button class="frow haspos" data-film="${esc(r.fid)}">
      ${posterCard(r.fid, r.f.n, "", false)}
      <span><span class="n">${isStarred(r.fid) ? STAR_MARK : ""}${esc(r.f.n)}</span>
        <span class="s">${esc([r.f.d, (r.f.g || []).join(", ")].filter(Boolean).join(" · "))}</span>
        ${r.near ? `<span class="at"><b>${esc(r.near.n)}</b>${
          // MINUTES, NOT BOTH. The metres and the walking time are the same fact -- the
          // one is computed from the other at 4.5 km/h -- and carrying both pushed the
          // longer cinema names onto a second line for nothing. The sheet still gives the
          // distance; the list gives the number he would actually act on.
          F ? ` <span>${esc(F.w)}</span>` : ""}</span>` : ""}
        <span class="fm">${(() => {
          // LAST DAY, and only where the listing can support the word. The run has to be
          // finished -- every cinema playing it has published a whole week without it --
          // and it has to finish on the day being looked at. Nothing at Cineteca ever
          // qualifies, because two days is not a week, which is the point.
          const run = runs.get(String(r.fid));
          return run && run.closed && run.last === S.day
            ? `<span class="badge last">Last day</span> ` : "";
        })()}${fmtBadges(r.types, 3)}</span></span>
      <span class="cnt"><b>${r.n}</b><em>showings</em></span></button>`;
  }).join("") || `<div class="empty"><b>${S.q ? "No film called that" : "Nothing that day"}</b>${
    later.length ? `Nothing on this day, but ${later.length === 1 ? "one film starts" : later.length + " films start"} later.` : ""}</div>`;

  // The dates are read off the listing and nothing is called rare. A film with one date
  // in this payload has one date in this payload; whether it returns in October is a
  // question about a listing nobody has published yet, and the note at the foot says so
  // by naming how far each chain actually goes -- both numbers measured here rather than
  // written down, so the sentence cannot go stale the way a hardcoded count would.
  const lastDayOf = pred => {
    let m = -1;
    for (const c of SHOWS.cin) { if (!pred(c)) continue; for (const x of c.s) if (x[2] > m) m = x[2]; }
    return m;
  };
  const ctLast = lastDayOf(c => isCineteca(c.id)), cxLast = lastDayOf(c => !isCineteca(c.id));
  $("filmlist").innerHTML += later.length ? `<div class="up"><h3>Coming up</h3>${
    later.map(r => {
      const f = SHOWS.films[r.fid];
      const ds = [...r.days].sort((a, b) => a - b);
      const when = ds.length <= 2
        ? ds.map(dateWords).join(" and ")
        : `from ${dateWords(ds[0])} &middot; ${ds.length} dates`;
      return `<button class="frow haspos" data-film="${esc(r.fid)}" data-jump="${ds[0]}">
        ${posterCard(r.fid, f.n, "", false)}
        <span><span class="n">${esc(f.n)}</span>
          <span class="s">${esc([f.d, (f.g || []).join(", ")].filter(Boolean).join(" \u00b7 "))}</span>
          <span class="at"><b>${when}</b> <span>${r.cin.size} ${
            r.cin.size === 1 ? "cinema" : "cinemas"}</span></span></span>
        <span class="cnt"><b>${r.n}</b><em>showings</em></span></button>`;
    }).join("")}<p class="note">These are the dates as each chain has published them, and
    the two windows are nothing like the same length.${cxLast >= 0
      ? ` Cinemex here goes out to ${esc(dateAbs(cxLast))}.` : ""}${ctLast >= 0
      ? ` Cineteca goes out to ${esc(dateAbs(ctLast))} and publishes two days at a time,
        so a Cineteca title with one date here has one date on the board rather than one
        date in its run.` : ""}</p></div>` : "";
}

/* THE SYNOPSES, fetched once rather than baked in. posters/index.json is written by
   refresh-posters.py alongside the images and holds Cinemex's own sinopsis for each film.
   It is same-origin, so the service worker caches it with everything else and it is there
   with no signal after the first visit. Starting as {} means a sheet opened before it
   lands simply shows no synopsis rather than throwing. */
let POSTERS = {};
fetch("posters/index.json").then(r => r.ok ? r.json() : {}).then(j => { POSTERS = j || {}; })
  .catch(() => {});

/* THE CINEMA DETAIL -- prices, rooms, seats, ratings, loyalty, menus.
   Fetched rather than baked in, for the same reason the synopses are. The three research
   files behind it are 577 KB because every value in them carries its source, its
   confidence and the quote it came from; `build-detail.py` reduces that to the 30 KB that
   actually reaches the screen. None of it is needed for the first paint -- the first
   paint is a list of times -- and the service worker caches it, so from the second launch
   it is there with no signal.

   Starting as null rather than {} is deliberate: a section can then tell "not loaded yet"
   apart from "this cinema has no price", and say the right thing in each case instead of
   claiming a cinema has no rooms because a fetch is in flight. */
let DETAIL = null;
fetch("detail.json").then(r => r.ok ? r.json() : null).then(j => {
  if (!j) return;
  DETAIL = j;
  // The list is already on screen by now and has no prices on it, so redraw. Cheap
  // enough: it is the same work the day chips already do on every tap.
  renderShows();
  if (S.tab === "films") renderFilms();
}).catch(() => {});

/** Everything known about one cinema, by the id the payload already uses. */
function det(cid) { return (DETAIL && DETAIL.ven[String(cid)]) || null; }
const pesos = v => "$" + Number(v).toLocaleString("en-US");

/** The observed adult price for a cinema and one of the format labels the page prints,
 *  or null. `plain` band only -- never the promo, because which film is in the slot
 *  decides whether the promo applies and a number beside a time cannot say that. */
function priceOf(cid, label) {
  const d = det(cid);
  const row = d && d.price && d.price[label];
  return row ? row[0] : null;
}
/** Cheapest adult price observed anywhere in a cinema, for the row header. */
function fromPrice(cid) {
  const d = det(cid);
  if (!d || !d.price) return null;
  const all = Object.values(d.price).map(r => r[1] != null ? r[1] : r[0]).filter(v => v != null);
  return all.length ? Math.min(...all) : null;
}
function isCineteca(cid) { return /^cineteca-/.test(String(cid)); }

/* The two things worth putting on a cinema's own row in the list, and nothing else: what
   the cheapest ticket in the building costs, and what people score it. Both are one
   glance, both are why you would pick this cinema over the next one, and neither is
   available anywhere else without opening two more tabs. A room count and a theme list
   are detail and belong in the sheet. */
function cinBits(c) {
  const d = det(c.id);
  const bits = [];
  const from = isCineteca(c.id)
    ? (DETAIL && DETAIL.cineteca_price ? DETAIL.cineteca_price.reduced : null)
    : fromPrice(c.id);
  if (from != null) bits.push("from " + pesos(from));
  if (d && d.rating != null) bits.push(d.rating.toFixed(1) + "★");
  return bits.length ? " · " + esc(bits.join(" · ")) : "";
}

/* WHERE A SENTENCE CAME FROM, said out loud, because they are not equally strong and the
   difference matters here. "Cinemex says" is the operator's own words. "Measured" is
   computed from their data by the build. "Third party" is Wikipedia or a news site --
   which is what the Infinity Vision entry is, and presenting a Disney claim from a
   newspaper as flat fact is exactly the move this app does not make. "Name only" means
   the words translate the label and claim no mechanism.

   Same vocabulary as the venue audit's verified / likely / unknown tags, so the reader
   only learns one convention. */
const SRC_TAG = {
  operator_published: ["v", "Cinemex says"],
  measured: ["v", "measured"],
  ocr_vision_verified_visually: ["v", "read off their menu"],
  pdf_text_layer_two_extractors_agree: ["v", "read off their menu"],
  audit: ["v", "checked by hand"],
  third_party: ["l", "third party"],
  third_party_expired_page: ["l", "their words, expired page"],
  format_level_inference: ["l", "about the format, not this venue"],
  label_translation: ["l", "name only"],
  term_definition: ["l", "standard term"],
  unknown: ["u", "unknown"],
  // Added rather than reaching for the nearest fit, because no existing label described
  // this shape: the audit names a room as a format, the room exists, and the operator's
  // own showtimes never carry that format anywhere. It is not unknown -- CX-prefixed
  // ticket products exist and the building carries the cx attribute -- and it is not
  // verified either.
  named_not_in_times: ["l", "not in the showtimes"],
};
/* THE DEFAULT IS A VISIBLE HEDGE, NEVER NOTHING, and that is the whole point of this
   function. The vocabulary behind these labels is prose in a research file and it grows:
   it was eight members when this was written and is ten now, and the two that arrived --
   `format_level_inference` ("the operator publishes this about the FORMAT and does not
   name this venue") and `third_party_expired_page` -- are exactly the ones that need a
   hedge most. A lookup that returns "" for an unrecognised label renders the strongest
   possible version of a claim, which is a bare sentence with nothing beside it. So an
   unmapped label shows itself instead, hedged, and is impossible to miss. */
function srcTag(conf) {
  if (!conf) return "";
  const t = SRC_TAG[conf];
  if (t) return `<span class="tag ${t[0]}">${esc(t[1])}</span>`;
  return `<span class="tag l">${esc(String(conf).replace(/_/g, " "))}</span>`;
}

/* INFINITY VISION FOLLOWS THE FILM, NOT THE ROOM, and this works that out from the
   payload rather than being told it.

   The glossary entry for it is a third-party claim -- a newspaper saying it is a Disney
   certification rather than a Cinemex room type -- and a sourced sentence about a badge
   nobody publishes is worth having. But the thing that changes what he does with it is
   not in that sentence: seeing "Infinity Vision" on a time means the FILM was certified,
   so there is no point going to that room for a different film expecting the same thing.

   That is checkable here: 150 showings, exactly one film, and all six rooms that run it
   also run films without it. So this computes it and says it as a measurement.

   IT WITHDRAWS ITSELF IF THE DATA STOPS SUPPORTING IT. If a later refresh puts the flag
   on more than one film, or on a room that runs nothing else, the shape is no longer
   film-shaped and this returns nothing rather than repeating a claim that has expired.
   That is the whole reason it is derived instead of written down. */
function ivFact() {
  const idx = [];
  SHOWS.fmts.forEach((f, i) => { if ((f.t || []).includes("infinity-vision")) idx.push(i); });
  if (!idx.length) return "";
  const films = new Set(), rooms = new Map();
  let n = 0;
  for (const c of SHOWS.cin) {
    for (const s of c.s) {
      if (!idx.includes(s[1])) continue;
      n++; films.add(String(s[0]));
      rooms.set(c.n + "|" + (s[6] || ""), [c.n, s[6] || ""]);
    }
  }
  if (!n || films.size !== 1) return "";
  // Every room carrying it must also run something without it, or it looks like a room
  // property after all and this must not claim otherwise.
  for (const [cn, room] of rooms.values()) {
    let other = 0;
    for (const c of SHOWS.cin) {
      if (c.n !== cn) continue;
      for (const s of c.s) if ((s[6] || "") === room && !idx.includes(s[1])) other++;
    }
    if (!other) return "";
  }
  const f = SHOWS.films[[...films][0]];
  return ` Checked against the ${n} showings of it in this app: they are all one film, `
    + `${f ? f.n : "one title"}, and every one of the ${rooms.size} rooms that runs it also `
    + `runs films without it. So it travels with the film, not with the room — the same `
    + `room showing something else is just that room.`;
}

/* WHERE THE AUDIT NAMES A ROOM AS A FORMAT, CHECK IT AGAINST THE SHOWTIMES.
   A `verified` badge is a promise about how something was established, and one was
   sitting on "Sala 10 CinemeXtremo" while no showtime anywhere in the operator's own data
   carries that format. A verified tag on a contradicted claim is worse than no tag,
   because the tag is what stops the next reader checking.

   The rule matches the CLAIM'S SHAPE rather than a word: a specific sala named as a
   specific format. That distinction is the whole safety of it. A rule that merely looked
   for a format name with no showtimes flagged twelve rows, and nine were fine -- "No
   Atmos, CX or IMAX sala" is a denial, and one row is titled "What it is not". Matching
   "Sala 4 = CinemeXtremo" and "Atmos in sala 10" hits the five real assertions and no
   denial.

   Two guards beyond that. A venue with no showtimes here cannot be contradicted by them:
   Cinepolis publishes nothing this page can read, so every format reads zero at its
   venues and that is a fact about our data, not theirs. And a partial match is reported
   as a ratio rather than as a contradiction -- Parque Delta Sala 10 is Atmos on 72 of its
   76 showings, and the other four are plain Tradicional, which is worth saying rather
   than smoothing over. */
const AUDIT_FMT = { "CinemeXtremo": "cx", "IMAX": "imax", "Dolby Atmos": "dolby_atmos",
  "Atmos": "dolby_atmos", "Infinity Vision": "infinity-vision", "Platino": "platinum",
  "Premium": "premium" };
const AUDIT_NAMES = Object.keys(AUDIT_FMT).sort((a, b) => b.length - a.length)
  .map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
const SALA_IS = new RegExp("[Ss]ala\\s*(\\d+)\\s*=?\\s*(?:with\\s+)?(" + AUDIT_NAMES + ")", "g");
const IS_IN_SALA = new RegExp("(" + AUDIT_NAMES + ")\\s+in\\s+sala\\s*(\\d+)", "gi");

/** Every cinema row in the payload that belongs to this audit venue. It is many-to-one:
 *  Parque Delta and Parque Delta Platino are two rows under one audited building. */
function roomsOfVenue(vi) { return SHOWS.cin.filter(c => c.v === vi); }

/** For a claim "Sala N is FORMAT", how many of that room's showings actually carry it.
 *  Returns null when the venue has no showtimes at all, because then nothing here can
 *  speak to the claim either way. */
function salaClaims(vi, text) {
  const cins = roomsOfVenue(vi);
  if (!cins.length || !cins.some(c => c.s.length)) return null;
  const found = [];
  let m;
  SALA_IS.lastIndex = 0;
  while ((m = SALA_IS.exec(text))) found.push([m[1], m[2]]);
  IS_IN_SALA.lastIndex = 0;
  while ((m = IS_IN_SALA.exec(text))) found.push([m[2], m[1]]);
  const out = [];
  for (const [num, name] of found) {
    const key = AUDIT_FMT[Object.keys(AUDIT_FMT).find(k => k.toLowerCase() === name.toLowerCase())];
    if (!key) continue;
    // ONE CINEMA ROW AT A TIME, NEVER POOLED, and this is not a refinement -- pooling
    // produced a wrong number on the first venue tried. An audited building can be two
    // cinema rows in the payload, and their sala names collide completely: Parque Delta
    // has Sala 1-10 and Parque Delta Platino has Sala 1-5, so a bare "Sala 3" names two
    // different rooms in two different parts of the building. Summing them reported
    // Sala 3 as IMAX on "75 of its 156 showings" when it is 75 of 75 in the room the
    // audit is talking about and 0 of 81 in an unrelated recliner room next door.
    const per = cins.map(c => {
      let hit = 0, tot = 0;
      for (const x of c.s) {
        if (String(x[6] || "").replace(/[^0-9]/g, "") !== String(num)) continue;
        tot++;
        if ((SHOWS.fmts[x[1]].t || []).includes(key)) hit++;
      }
      return { c, hit, tot };
    }).filter(r => r.tot);
    if (!per.length) continue;
    // The room the audit means is the one that actually runs the format. Where none does,
    // the claim is unsupported everywhere and any of them will do to say so.
    const best = per.reduce((a, b) => (b.hit > a.hit ? b : a));
    out.push({ num, name, key, hit: best.hit, tot: best.tot, where: best.c.n,
               split: per.length > 1 });
  }
  return out.length ? out : null;
}

/** Render one audit row, with its badge corrected where the showtimes disagree. */
function auditRow(vi, k, txt, conf) {
  const claims = salaClaims(vi, txt);
  let note = "", tag = conf;
  if (claims) {
    const zero = claims.filter(c => c.hit === 0);
    const part = claims.filter(c => c.hit > 0 && c.hit < c.tot);
    if (zero.length) {
      // The badge comes off THIS row, not off the whole audit, and only the clause the
      // data contradicts is what the new label describes.
      tag = "named_not_in_times";
      note = " " + zero.map(c => `No showing anywhere in this app is a ${c.name}
        screening, so nothing in the times backs Sala ${c.num} being one — the name is on
        the ticket products and on the building, not on the format.`).join(" ");
    }
    if (part.length) {
      note += " " + part.map(c => `Sala ${c.num} runs ${c.name} on ${c.hit} of its ${c.tot}
        showings here; the rest are ordinary screenings in the same room.`).join(" ");
    }
  }
  return `<dt>${esc(k)}</dt><dd>${esc(txt)}${note ? `<span class="qual">${esc(note)}</span>` : ""}
    ${srcTag(tag === "v" ? "audit" : tag === "l" ? "third_party" : tag === "u" ? "unknown" : tag)}</dd>`;
}

/* ---------- the sheet sections that read detail.json ---------- */

/** What a ticket costs here. Cineteca publishes a flat price; Cinemex does not publish
 *  prices at all, so these were read from its own checkout one session at a time and the
 *  section says which day each came from. */
function priceSection(cid) {
  const d = det(cid);
  if (isCineteca(cid)) {
    const p = DETAIL && DETAIL.cineteca_price;
    if (!p) return "";
    const days = (p.cheap_days || []).join(" and ");
    return `<div class="sec"><h3>What a ticket costs</h3>
      <div class="pricetab">
        <b>General</b><em>${pesos(p.general)}</em>
        <b>Under 25, students, over 60</b><em>${pesos(p.reduced)}</em>
        ${days ? `<b>${esc(days)}, any screening</b><em>${pesos(p.cheap_price)}</em>` : ""}
      </div>
      <p class="note">Cineteca publishes these, so they are the actual prices rather than
      a reading.${(p.cheap_not || []).length
        ? ` The ${esc(days)} price does not apply to ${esc((p.cheap_not || []).join(", "))}.`
        : ""}${p.max_tickets ? ` ${p.max_tickets} tickets a session at most.` : ""}</p></div>`;
  }
  if (!d || !d.price) {
    return DETAIL ? `<div class="sec"><h3>What a ticket costs</h3>
      <p class="note">Not read at this cinema. Cinemex publishes no price list anywhere, so
      every price in this app came from opening one of its own checkout pages, and this one
      was not among them. Tap a time to see it.</p></div>` : "";
  }
  const rows = Object.entries(d.price).sort((a, b) => a[1][0] - b[1][0]).map(([lab, v]) =>
    `<b>${esc(lab)}</b><em>${pesos(v[0])}</em>`).join("");
  const promo = DETAIL && DETAIL.promo;
  return `<div class="sec"><h3>What a ticket costs</h3>
    <div class="pricetab">${rows}</div>
    <p class="note">One adult ticket, read from Cinemex's own checkout${
      DETAIL && DETAIL.at ? " on " + esc(DETAIL.at.slice(0, 10)) : ""}${
      /* THE DATE IN price_read IS THE SESSION SAMPLED, NOT THE DAY OF THE READING, and
         this sentence used to print it as the latter. It said "read from Cinemex's own
         checkout on 2026-09-11" on a page built on the 9th -- a reading taken two days in
         the future, which is impossible and reads as a bug in the data rather than as a
         sentence with the wrong subject. The field beside it in the source is a
         session_id, an auditorium and a seat count, so it is unambiguously a description
         of one screening. Both dates are true and saying both is what makes the future
         one make sense. */
      (d.priced_session_day || []).length
        ? `, against a session on ${esc(d.priced_session_day.join(" and "))}` : ""
    }. Cinemex publishes no
    price list, so there is no other way to get these. Which film is in the slot changes
    them &mdash; a premiere or a special screening is dearer, and the number beside a time
    in the list is this same reading, not that showing's price.</p>
    ${promo ? `<p class="note"><b>${esc(promo.name)}.</b> ${pesos(promo.price)} on
      ${esc(String(promo.days).toLowerCase())}${promo.window ? ", " + esc(promo.window) : ""},
      for ${esc((promo.yes || []).join(" and ").toLowerCase())} rooms. Not
      ${esc((promo.no || []).join(", "))}, and not
      ${esc((promo.also_no || []).join(", "))}. It arrives as a different ticket at the
      till rather than as a discount, which is why it cannot be shown against a time.</p>` : ""}
    </div>`;
}

/** The rooms, which is the part no ticketing site will tell you. Wheelchair spaces are
 *  the reason this section exists: a seat count is nice to know and an accessible space
 *  is the difference between going and not. */
function roomSection(cid, highlight) {
  const d = det(cid);
  if (isCineteca(cid)) {
    return `<div class="sec"><h3>The rooms</h3>
      <p class="note">Cineteca publishes no seat map, so there is no seat count here. Its
      own FAQ says every room is wheelchair accessible and that seats are assigned, up to
      eight a session.</p></div>`;
  }
  if (!d || !d.rooms) return "";
  const names = Object.keys(d.rooms).sort((a, b) =>
    (d.rooms[a][0] || 0) - (d.rooms[b][0] || 0));
  const noWheel = names.filter(k => !d.rooms[k][2]).length;
  const seats = names.map(k => d.rooms[k][1]).filter(v => v != null);
  const rows = names.map(k => {
    const [screen, seat, wheel, rows_] = d.rooms[k];
    const on = highlight && String(highlight) === String(k);
    return `<tr${on ? ' style="background:var(--sunk)"' : ""}><td>${esc(k)}</td>
      <td>${seat != null ? seat : "&mdash;"}</td>
      <td>${rows_ != null ? rows_ : "&mdash;"}</td>
      <td${wheel ? "" : ' class="no"'}>${wheel ? wheel : "none"}</td></tr>`;
  }).join("");
  return `<div class="sec"><h3>The rooms</h3>
    <div class="rmwrap"><table class="rooms">
      <thead><tr><th>Room</th><th>Seats</th><th>Rows</th><th>Wheelchair</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="note">${names.length} rooms, ${Math.min(...seats)} to ${Math.max(...seats)}
    seats. Read from the seat map Cinemex draws at checkout, one read per room, and seats
    that are already sold are counted &mdash; this is how big the room is, not how much of
    it is left.</p>
    ${noWheel ? `<p class="note">${noWheel} of these ${noWheel === 1 ? "rooms has" : "rooms have"}
      no wheelchair seat in the seat map at all. That is a fact about the seat map rather
      than a claim the building cannot be got into, and the two are not the same thing
      &mdash; ask the cinema.</p>`
      : `<p class="note">Every room here has at least one wheelchair seat in its map.</p>`}
    <p class="note">There is no format column here on purpose. The room is where the
    equipment is and the showtime is where the format is, and the two disagree: Parque
    Delta Sala 10 is Dolby Atmos on 72 of its 76 showings and an ordinary screening on the
    other four. So the format is on the time, and this table is what the room is.</p>
    <p class="note">No room anywhere at Cinemex has a companion seat beside the wheelchair
    spaces. The seat type exists in their own data and is applied to nothing, in all 287
    rooms. Seats are assigned in every room, in every format &mdash; that is how Cinemex
    works everywhere and it is not something Platino or Premium buys you.</p></div>`;
}

/** What reviewers keep coming back to. A star average for a multiplex is mostly a rating
 *  of the queue and the bathrooms, so the themes are the useful half and they are what
 *  gets the space. */
function reviewSection(cid) {
  const d = det(cid);
  if (!d || d.rating == null) return "";
  const th = (d.themes || []).map(([name, pct]) =>
    `<b>${esc(name)}</b><em>${pct}%</em><i><span style="width:${Math.min(100, pct)}%"></span></i>`
  ).join("");
  return `<div class="sec"><h3>What reviewers say</h3>
    <div class="pricetab" style="margin-bottom:9px">
      <b>${d.n ? d.n.toLocaleString("en-US") + " Google reviews" : "Google rating"}</b>
      <em>${d.rating.toFixed(1)} ★</em></div>
    ${th ? `<div class="thm">${th}</div>` : ""}
    ${d.sampled ? `<p class="note">Themes are from the ${d.sampled} most recent reviews,
      counted rather than summarised.</p>` : ""}
    ${d.hot ? `<div class="warm" style="margin-top:10px"><b>People say it gets hot</b>
      ${d.hot.n} of the reviews read complain about the heat or the air conditioning.
      <span class="q">&ldquo;${esc(d.hot.quote)}&rdquo;</span>${
        d.hot.when ? " &mdash; " + esc(d.hot.when) : ""}</div>` : ""}
    </div>`;
}

/** Cinemex Loop, and the membership packages, whose prices genuinely differ by cinema --
 *  Cinemex's own terms say the package is priced by the cinema you sign up at and that the
 *  tickets are only good there. */
function loyaltySection(cid) {
  const L = DETAIL && DETAIL.loyalty;
  if (!L || isCineteca(cid)) return "";
  const d = det(cid);
  const tiers = (L.tiers || []).map(([name, pct]) =>
    `<b>${esc(name)}</b><em>${pct}%</em>`).join("");
  const pk = (d && d.packages || []).map(([name, price]) =>
    `<b>${esc(name)}</b><em>${pesos(price)}</em>`).join("");
  return `<div class="sec"><h3>${esc(L.name || "Loyalty")}</h3>
    ${tiers ? `<div class="pricetab">${tiers}</div>
      <p class="note">Points back on what you spend, by card tier. Cinemex says the points
      are spendable as payment and never says anywhere what one is worth in pesos, so this
      does not guess.</p>` : ""}
    ${pk ? `<p class="note" style="margin-top:9px"><b>Prepaid packages at this cinema</b></p>
      <div class="pricetab">${pk}</div>
      <p class="note">Priced per cinema, and the tickets are only good at the one you sign
      up at &mdash; Cinemex's own terms say so.</p>` : ""}</div>`;
}

/** The bar, and Cineteca's menu. Cinemex has no snack menu to show: all 32 venues answer
 *  with an empty catalogue and the endpoint returns an error when the parameter is
 *  missing, so the empty answer is real rather than a wrong request. */
function foodSection(cid) {
  const d = det(cid);
  if (!d) return "";
  let out = "";
  if (d.bar) {
    const items = (d.bar.items || []).map(([name, price]) =>
      `<b>${esc(name)}</b><em>${pesos(price)}</em>`).join("");
    out += `<div class="sec"><h3>${esc(d.bar.outlet || "The bar")}</h3>
      ${d.bar.detail ? `<p class="note" style="margin-top:0">${esc(d.bar.detail)}</p>` : ""}
      ${items ? `<div class="pricetab">${items}</div>` : ""}</div>`;
  }
  if (d.menu) {
    const combos = (d.menu.combos || []).map(c => {
      const p = (c.p || []).map(([variant, price]) =>
        variant ? `${pesos(price)} ${esc(variant)}` : pesos(price)).join(" &middot; ");
      return `<b>${esc(c.name)}${c.what ? " — " + esc(c.what) : ""}</b><em>${p}</em>`;
    }).join("");
    out += `<div class="sec"><h3>The snack counter</h3>
      ${combos ? `<div class="pricetab">${combos}</div>` : ""}
      <p class="note">From Cineteca's own dulceria list. Cinemex has none to show: every
      one of its cinemas here answers with an empty menu.</p></div>`;
  }
  return out;
}

/* ===================== SHEETS ===================== */
function gmaps(lat, lng, name) {
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
}
function openSheet(headHtml, goHtml, bodyHtml, accent) {
  $("sheethead").innerHTML = headHtml;
  $("sheetgo").innerHTML = goHtml;
  $("sheetbody").innerHTML = bodyHtml;
  $("sheethead").style.setProperty("--cat", accent || "var(--lamp)");
  $("sheet").classList.add("on"); $("scrim").classList.add("on");
  $("sheet").setAttribute("aria-hidden", "false");
  $("sheetbody").scrollTop = 0;
}
function closeSheet() {
  $("sheet").classList.remove("on"); $("scrim").classList.remove("on");
  $("sheet").setAttribute("aria-hidden", "true");
}

function cinemaSheet(cid) {
  const c = SHOWS.cin.find(x => String(x.id) === String(cid));
  if (!c) return;
  const d = km(origin, { lat: c.lat, lng: c.lng }), F = far(d);
  const v = c.v != null ? V[c.v] : null;
  const plain = v && PLAIN[v.name] ? PLAIN[v.name][1] : "";
  const head = `<div><h2>${esc(c.n)}</h2><div class="addr">${esc(c.a || (v && v.addr) || "")}</div></div>
    <div class="far"><b>${F.d}</b><em>${F.w}</em></div>`;
  const go = `<a class="pri" href="${gmaps(c.lat, c.lng)}" target="_blank" rel="noopener">Walk me there</a>
    <a href="${cinemaUrl(c)}" target="_blank" rel="noopener">Live times &amp; book</a>
    ${c.ph ? `<a href="tel:${esc(String(c.ph).replace(/[^0-9+]/g, ""))}">Call</a>` : ""}`;
  // what it actually has, from the live data
  const types = new Set(); let today = 0;
  c.s.forEach(s => { if (s[2] === S.day) { today++; (SHOWS.fmts[s[1]].t || []).forEach(t => types.add(t)); } });
  let body = plain ? `<p class="plain">${esc(plain)}</p>` : "";
  body += `<div class="sec"><h3>On that day</h3>
    <p style="margin:0;font-size:13.5px;line-height:1.5">${today} showings.
    ${[...types].filter(t => FT[t]).map(t => FT[t][0]).join(", ") || "Standard rooms"}.</p></div>`;
  // Price first, because it is the question nobody else answers before checkout, then
  // the rooms, then what people say about the place. The hand audit stays last: it is the
  // deepest writing here but it is also the part he already knows, and a stranger reading
  // this wants the number.
  body += priceSection(c.id);
  body += roomSection(c.id);
  body += reviewSection(c.id);
  if (v && v.spec) {
    body += `<div class="sec"><h3>The audit</h3><dl class="spec">`
      + v.spec.map(([k, txt, conf]) => auditRow(c.v, k, txt, conf)).join("") + `</dl></div>`;
  } else {
    body += `<div class="sec"><h3>The audit</h3><p style="margin:0;font-size:13.5px;color:var(--ink-2)">
      This one is outside the original five-kilometre study, so its screens and prices have not been
      checked by hand. The showtimes above are real.</p></div>`;
  }
  body += foodSection(c.id);
  body += loyaltySection(c.id);
  openSheet(head, go, body, "var(--c-std)");
}

/* THE GUIDE WRITING, PUT WHERE IT IS ACTUALLY NEEDED. He removed the Guide tab and kept
   the writing -- "what IMAX with Laser means in this city" is the part no ticketing app
   has, and it is useless behind a tab and useful next to the badge that raised the
   question. A film sheet shows only the formats that film actually plays in, so nobody
   reads about Platino for a film that is not in one. Wording is the audited copy from the
   old guide, unchanged. Nothing is written here for a format the audit did not cover. */
/* IMAX, ROOM BY ROOM. Ask 10 on 12 September: "IMAX 4K digital? IMAX 2K digital? Screen
   size?". Baked from docs/imax-specs.json by imax-rooms.py, where every value has a source
   and a confidence. Keyed "cinema id|room". Likely facts say "(press)"; unknown ones say "not
   published", because that is the honest answer to the question he asked. */
const IMAX_ROOMS = {"32|Sala 3":{"label":["IMAX with Laser","verified"],"projection":["laser","verified"],"resolution":["4K","likely"],"sound":["IMAX 12-channel","likely"],"aspect_ratio":["1.90:1","likely"],"screen_area_m2":[null,"unknown"]},"76|Sala 5":{"label":["IMAX with Laser, Platino seating","verified"],"projection":["laser","verified"],"resolution":["4K","likely"],"sound":["IMAX 12-channel","likely"],"aspect_ratio":["1.90:1","likely"],"screen_area_m2":[300,"likely"],"billed_as":["largest IMAX screen in Mexico City and Latin America","likely"]},"410|Sala 1":{"label":["IMAX","verified"],"projection":[null,"unknown"],"resolution":[null,"unknown"],"sound":["IMAX 12-channel","likely"],"aspect_ratio":["1.90:1","likely"],"screen_area_m2":[null,"unknown"]}};
function imaxLine(cid, room) {
  const r = IMAX_ROOMS[String(cid) + "|" + room];
  if (!r) return "";
  const v = (k, fmt) => {
    const x = r[k];
    if (!x || x[1] === "unknown" || x[0] == null) return null;
    return (fmt ? fmt(x[0]) : String(x[0])) + (x[1] === "likely" ? " (press)" : "");
  };
  const parts = [
    v("label"),
    r.projection && r.projection[1] !== "unknown" ? v("projection", p => p + " projection") : "projector not published",
    v("resolution"), v("sound", x => x + " sound"), v("aspect_ratio"),
    r.screen_area_m2 && r.screen_area_m2[1] !== "unknown" ? v("screen_area_m2", a => "about " + a + " m² screen") : "screen size not published",
  ].filter(Boolean);
  return parts.join(", ");
}
const FORMAT_NOTE = {
  imax: ["IMAX",
    "IMAX's own digital format: a 1.90:1 screen and IMAX's twelve-channel sound. None of the "
    + "tall 1.43:1 rooms exists in Mexico. Cinemex names Parque Delta and Antara as laser; "
    + "each room's own line under its times says what else is known about it."],
  dolby_atmos: ["Dolby Atmos",
    "Speakers overhead as well as around you. You hear it most in a room built for it, "
    + "which here means the CinemeXtremo screens."],
  platinum: ["Platino",
    "Full recliners, a waiter and a menu, at a flat price, usually 200 to 230 pesos. It "
    + "is about the seat, not the screen."],
  premium: ["Premium",
    "Just a wider, softer seat. Not a format. Most Cinemex sites near Roma sell every "
    + "seat as Premium."],
  traditional: ["Standard",
    "An ordinary room, and the cheapest ticket in the building."],
  v3d: ["3D", "Glasses are sold at the counter for a few pesos if you do not bring your own."],
  lang_sub: ["Subtitulada",
    "Original audio, Spanish subtitles."],
  lang_es: ["Espanol",
    "Dubbed into Spanish. Most family films only play this way, so it is worth checking "
    + "before you book."],
  lang_unknown: ["Language unknown",
    "Cineteca marks the language in the title of a screening and often leaves it off. "
    + "Most of what it programmes is the original with Spanish subtitles, but it is not "
    + "stated here, so this does not claim it. These screenings show under Subtitled "
    + "rather than being hidden from it; the sede's own page says which."],
};

/* Delegated, because the sheet's contents are replaced wholesale on every open and a
   listener bound to the button would be a new one each time with no removal. */
addEventListener("click", e => {
  const b = e.target.closest(".sheet .syn .more");
  if (!b) return;
  const box = b.closest(".syn");
  const open = box.classList.toggle("open");
  b.textContent = open ? "Read less" : "Read more";
});

/* AGE RATINGS SIT LOW ON PURPOSE. His words, 12 September: nobody looks at them "unless they
   click on the movie or want to book a ticket", so they are off every list row and appear
   once, here, saying what the letter means. The meanings are Article 51 of the Ley Federal de
   Cine y el Audiovisual, DOF 22 May 2026 (diputados.gob.mx/LeyesBiblio/pdf/LFCA.pdf), not a
   press summary. Only C and D keep anyone out; the other four are guidance. */
const RATING = {
  AA: "for everyone, made for children under 7",
  A: "for everyone",
  B: "for teens 12 and up",
  B15: "for teens over 15",
  C: "adults 18 and up, checked at the door",
  D: "adults only, explicit sex or extreme violence",
};
function rateLine(r) {
  const k = String(r || "").trim().toUpperCase();
  if (!k) return "";
  const txt = RATING[k] ? `Rated ${k}, ${RATING[k]}` : k === "TBC" ? "Age rating not published yet" : `Rated ${k}`;
  return `<div class="rate">${esc(txt)}</div>`;
}

function filmSheet(fid) {
  const f = SHOWS.films[fid];
  if (!f) return;
  const cins = cinemasSorted();
  const rows = [];
  for (const c of cins) {
    const list = c.s.filter(s => String(s[0]) === String(fid) && s[2] === S.day);
    if (list.length) rows.push([c, list.sort((a, b) => a[3] - b[3])]);
  }
  const syn = (POSTERS[fid] || {}).syn || "";
  // CAST, COUNTRY, YEAR AND TRAILER, from the same file as the synopsis and missing the same
  // way: a Cineteca title, or a sheet opened before the file lands, shows none of it rather
  // than an empty line. The trailer is checked again here, so a bad manifest cannot draw a
  // button that goes anywhere but a YouTube video.
  const meta = POSTERS[fid] || {};
  const made = [[meta.country, meta.year].filter(Boolean).join(", "),
                meta.cast ? "with " + meta.cast : ""].filter(Boolean).join(" · ");
  const yt = /^https:\/\/www\.youtube\.com\/watch\?v=[\w-]{11}$/.test(meta.trailer || "") ? meta.trailer : "";
  // The backdrop only exists where there is artwork to make one from. A film with no
  // poster gets the header it always had rather than an empty tinted box, which is the
  // same rule the placeholder initials already follow.
  const bd = hasArtwork(fid)
    ? `<div class="bd" style="background-image:url(posters/${esc(fid)}.jpg)"></div><div class="sc"></div>`
    : "";
  const head = `<div class="poshead">${bd}
      ${posterCard(fid, f.n, "", false)}
      <div><h2>${esc(f.n)}</h2>${starBtn(fid)}<div class="addr">${
    esc([f.o && f.o !== f.n ? f.o : "", f.d, (f.g || []).join(", "), f.dir].filter(Boolean).join(" · "))}</div>
      ${made ? `<div class="made">${esc(made)}</div>` : ""}
      ${syn ? `<div class="syn" id="syn"><p>${esc(syn)}</p>${
        // The toggle is only offered where there is something hidden to reveal. Three
        // lines at 13px over this column is about 150 characters; below that the clamp
        // never bites and a "more" button that reveals nothing is a small lie.
        syn.length > 150 ? `<button class="more" data-syn="1">Read more</button>` : ""}</div>` : ""}${rateLine(f.r)}</div></div>`;
  // NOT THE AMBER SLAB. On a cinema's sheet "Walk me there" is the action and earns the
  // primary style; on a film's sheet it was the loudest thing on the screen for a link
  // that only repeats the first row of the list underneath it. Left neutral, and it names
  // the cinema and the distance, because "the nearest" is not a place he can picture.
  const go = rows.length
    ? `<a href="${gmaps(rows[0][0].lat, rows[0][0].lng)}" target="_blank" rel="noopener"
        >Walk to ${esc(rows[0][0].n)} &middot; ${
          esc(far(km(origin, { lat: rows[0][0].lat, lng: rows[0][0].lng })).d)}</a>`
    : "";
  // A link out, never an embed: a player breaks the no-signal promise and puts a third party
  // on a page that has none. It sits in the bar beside Walk to.
  const trailer = yt ? `<a class="yt" href="${esc(yt)}" target="_blank" rel="noopener">Trailer</a>` : "";
  const body = `<div class="sec"><h3>${rows.length} ${
    rows.length === 1 ? "cinema" : "cinemas"}, nearest first</h3></div>` + rows.map(([c, list]) => {
    const F = far(km(origin, { lat: c.lat, lng: c.lng }));
    const byFmt = new Map();
    list.forEach(s => { if (!byFmt.has(s[1])) byFmt.set(s[1], []); byFmt.get(s[1]).push(s); });
    const vers = [...byFmt.entries()].map(([fi, l]) => {
      const fmt = SHOWS.fmts[fi];
      const chips = l.map(s => {
        const past = isToday(DAYS[S.day]) && s[3] < nowMins();
        const low = s[4] === "l", mid = s[4] === "m", room = s[6] || "";
        const href = ticketUrl(s);
        const cls = ["t", room ? "room" : "", past ? "past" : "",
                     low ? "low" : mid ? "mid" : ""].join(" ").trim();
        return `<a class="${cls}" href="${href}" target="_blank" rel="noopener"
          >${hhmm(s[3])}${room ? `<i>${esc(room)}</i>` : ""}</a>`;
      }).join("");
      // THE ROOM, SPELLED OUT, at the moment he is choosing between two times. The chip
      // already says "SALA 2"; this says how big Sala 2 is and whether it has a
      // wheelchair space, which is the thing that decides it and which no ticketing site
      // puts in front of you.
      const dd = det(c.id);
      const seen = [];
      if (dd && dd.rooms) {
        for (const x of l) {
          const k = (x[6] || "").trim();
          if (k && dd.rooms[k] && !seen.some(r => r[0] === k)) seen.push([k, dd.rooms[k]]);
        }
      }
      const rline = seen.map(([k, r]) =>
        `${esc(k)}: ${r[1]} seats, ${r[2] ? r[2] + " wheelchair" : "no wheelchair space"}${
          imaxLine(c.id, k) ? " &middot; " + esc(imaxLine(c.id, k)) : ""}`
      ).join(" &middot; ");
      const price = isCineteca(c.id)
        ? (DETAIL && DETAIL.cineteca_price ? DETAIL.cineteca_price.general : null)
        : priceOf(c.id, fmt.l);
      return `<div class="vgrp"><div class="vl">${versionLabel(fmt)}${
        price != null ? `<span class="pri">${pesos(price)}</span>` : ""}</div>
        <div class="times">${chips}</div>
        ${rline ? `<p class="note" style="margin-top:5px">${rline}</p>` : ""}</div>`;
    }).join("");
    return `<div class="cin"><button class="hdr" data-cin="${c.id}">
      <span><span class="n">${esc(c.n)}</span></span>
      <span class="far"><b>${F.d}</b><em>${F.w}</em></span></button>${vers}</div>`;
  }).join("");
  // Only the formats this film actually plays in, in a fixed order so the screen comes
  // before the seat and the seat before the language.
  const ORDER = ["imax", "dolby_atmos", "v3d", "platinum", "premium", "traditional",
                 "lang_sub", "lang_es", "lang_unknown"];
  const types = new Set();
  rows.forEach(([, list]) => list.forEach(s =>
    ((SHOWS.fmts[s[1]] || {}).t || []).forEach(t => types.add(t))));
  // THE GLOSSARY, from two places, and neither invents anything.
  //
  // FORMAT_NOTE is the audited copy and wins where it has an entry: it carries local
  // knowledge no dictionary has -- that every IMAX in Mexico is the 1.90:1 kind and the
  // tall rooms do not exist here. detail.json fills the rest from the operator's own
  // 52-key format dictionary, and where the operator NAMES a format and describes it
  // nowhere, this says exactly that rather than writing a plausible sentence. Infinity
  // Vision is the live case: 150 showtimes in this app run in one and Cinemex's entire
  // CMS does not mention it once.
  const gk = [...new Set([...ORDER, ...types])].filter(t => types.has(t));
  const glossRows = gk.map(t => {
    if (FORMAT_NOTE[t]) return [FORMAT_NOTE[t][0], FORMAT_NOTE[t][1], "audit"];
    const f = DETAIL && DETAIL.fmt && DETAIL.fmt[t];
    if (!f) return null;
    // The third-party sentence, plus what the payload itself can prove about it. The
    // measured half is appended rather than replacing the source's words, so the reader
    // gets the claim and the corroboration and can see which is which.
    if (f.en) return [f.es || t,
      f.en + (t === "infinity-vision" ? ivFact() : ""), f.conf];
    return [f.es || t, "Cinemex names this format and describes it nowhere in its own "
      + "site, app or API, so there is nothing honest to put here. It is a real room you "
      + "can buy a seat in; what makes it different is not published.", "unknown"];
  }).filter(Boolean);
  const gloss = glossRows.length
    ? `<div class="sec"><h3>What these formats mean</h3><dl class="spec">` + glossRows.map(
        ([k, txt, conf]) => `<dt>${esc(k)}</dt><dd>${esc(txt)} ${srcTag(conf)}</dd>`
      ).join("") + `</dl></div>`
    : "";
  openSheet(head, go + trailer, body + gloss, "var(--c-big)");
}

function venueSheet(i) {
  const v = V[i];
  if (!v) return;
  const d = km(origin, { lat: v.lat, lng: v.lng }), F = far(d);
  const plain = PLAIN[v.name] ? PLAIN[v.name][1] : "";
  const head = `<div><h2>${esc(v.name)}</h2><div class="addr">${esc(v.addr)}</div></div>
    <div class="far"><b>${F.d}</b><em>${F.w}</em></div>`;
  const live = SHOWS.cin.find(c => c.v === i);
  const go = `<a class="pri" href="${gmaps(v.lat, v.lng)}" target="_blank" rel="noopener">Walk me there</a>
    ${live ? `<a href="${cinemaUrl(live)}" target="_blank" rel="noopener">Live times</a>` : ""}`;
  let body = plain ? `<p class="plain">${esc(plain)}</p>` : "";
  body += `<div class="sec"><h3>What it is</h3><dl class="spec">
    <dt>Operator</dt><dd>${esc(v.op)}</dd>
    ${v.salas ? `<dt>Rooms</dt><dd>${esc(v.salas)}</dd>` : ""}
    ${v.price ? `<dt>Price</dt><dd>${esc(v.price)}</dd>` : ""}
    ${v.best ? `<dt>Best room</dt><dd>${esc(v.best)}</dd>` : ""}
    ${v.audio ? `<dt>Audio</dt><dd>${esc(v.audio)}</dd>` : ""}
    ${v.proj ? `<dt>Projection</dt><dd>${esc(v.proj)}</dd>` : ""}
    ${BAR[v.name] && !(live && (det(live.id) || {}).bar)
      ? `<dt>Drinks</dt><dd>Bar on site</dd>` : ""}
  </dl></div>`;
  if (v.spec) {
    body += `<div class="sec"><h3>The audit</h3><dl class="spec">`
      + v.spec.map(([k, txt, conf]) => auditRow(i, k, txt, conf)).join("") + `</dl></div>`;
  }
  // THE FOUR INDEPENDENTS ARE ON THE MAP AND CARRY NO SHOWTIMES, so this sheet is the
  // only place anything can be said about them. They join by the map's own spelling of
  // the name rather than by an id, because they have no id in the showtimes payload --
  // that is what `map_venue` is for, and all four strings match a venue here exactly.
  const indie = DETAIL && (DETAIL.indie || []).find(x => x.map === v.name);
  if (indie) {
    const th = (indie.themes || []).map(([name, pct]) =>
      `<b>${esc(name)}</b><em>${pct}%</em><i><span style="width:${Math.min(100, pct)}%"></span></i>`
    ).join("");
    body += `<div class="sec"><h3>What reviewers say</h3>
      <div class="pricetab" style="margin-bottom:9px">
        <b>${indie.n ? indie.n.toLocaleString("en-US") + " Google reviews" : "Google rating"}</b>
        <em>${indie.rating != null ? indie.rating.toFixed(1) + " \u2605" : "&mdash;"}</em></div>
      ${th ? `<div class="thm">${th}</div>` : ""}
      <p class="note">No showtimes here: this one publishes nothing a page like this can
      read, so the map marker and this are what there is.</p></div>`;
  } else if (live) {
    // A mapped venue that IS a cinema in the list gets the same detail as its row.
    body += priceSection(live.id) + reviewSection(live.id);
  }
  openSheet(head, go, body, v.grp === "indie" ? "var(--c-art)" : "var(--c-std)");
}

/* ---------- the rooms that cost nothing ----------

   WHAT COUNTS AS FREE IS THE AUDIT'S OWN `price` FIELD, split on whether it says only
   "free" or merely mentions it. Nothing is listed here by name: a venue that starts
   charging leaves this list by having its audit edited, which is the only place that
   fact should live. Both groups are empty on a payload where nobody is free, and then
   the button does not render at all rather than opening an empty sheet. */
const FREE = V.map((v, i) => ({ v, i }))
  .filter(x => /free/i.test(String(x.v.price || "")));
const isFreeAlways = v => String(v.price || "").trim().toLowerCase() === "free";

function freeRows(list) {
  return list.map(({ v, i }) => {
    const F = far(km(origin, { lat: v.lat, lng: v.lng }));
    // The operator and what kind of room it is, which between them are the whole reason
    // to pick one of these over another: a Filmoteca satellite and a bar cineclub are
    // not the same evening.
    const what = [v.op, ...(v.f || [])].filter(Boolean).join(" \u00b7 ");
    return `<button class="frow" data-venue="${i}">
      <span><span class="n">${esc(v.name)}</span>
        <span class="s">${esc(what)}</span>
        ${isFreeAlways(v) ? "" : `<span class="at"><b>${esc(v.price)}</b></span>`}</span>
      <span class="cnt"><b>${F.d}</b><em>${esc(F.w)}</em></span></button>`;
  }).join("");
}

function freeSheet() {
  const rows = FREE.map(x => ({ ...x, d: km(origin, { lat: x.v.lat, lng: x.v.lng }) }))
    .sort((a, b) => a.d - b.d);
  if (!rows.length) return;
  const always = rows.filter(x => isFreeAlways(x.v)), sometimes = rows.filter(x => !isFreeAlways(x.v));
  const near = far(rows[0].d);
  const head = `<div><h2>Free screens</h2><div class="addr">${always.length} rooms near
      here show films for nothing${sometimes.length
        ? `, and ${sometimes.length} more sometimes do` : ""}.</div></div>
    <div class="far"><b>${near.d}</b><em>nearest</em></div>`;
  // THE HONEST SENTENCE, and it is the reason this is not called "free tonight". These
  // venues are in the app because somebody audited them by hand; not one of them
  // publishes a machine-readable programme, which is exactly why they have no showtimes
  // anywhere else in the app either.
  const body = `<p class="plain">None of these publishes a programme this app can read,
      so it cannot tell you what is on tonight at any of them. What it can tell you is
      that they exist, how far they are, and what each one is &mdash; which is more than
      any ticketing app will.</p>
    <div class="sec"><h3>Free</h3></div>${freeRows(always)}
    ${sometimes.length ? `<div class="sec"><h3>Sometimes free</h3></div>${freeRows(sometimes)}` : ""}
    <div class="sec"><p class="note" style="margin:0">Tap any of them for the full
      write-up: how often it runs, what it programmes, and how well each of those is
      known. ${always.length + sometimes.length} of the ${V.length} audited venues are on
      this list.</p></div>`;
  openSheet(head, "", body, "var(--c-free)");
}

/* ===================== MAP ===================== */
let map, layer;
const CAT = v => /free/i.test(String(v.price || "")) ? "var(--c-free)"
  : v.grp === "indie" ? "var(--c-art)"
  : (v.f || []).some(x => /IMAX|CinemeXtremo|4DX|ScreenX/i.test(x)) ? "var(--c-big)"
  : (v.f || []).some(x => /Platino|VIP/i.test(x)) ? "var(--c-lux)" : "var(--c-std)";

function initMap() {
  if (map) return;

  // OPENFREEMAP, VECTOR, NO KEY. See swap-map.py for the three hosts that were tried and
  // why two of them are refusals wearing an HTTP 200. Two styles because the app has two
  // themes and a dark map should be a dark map rather than an inverted light one.
  const styleFor = () => document.documentElement.getAttribute("data-theme") === "light"
      || (!document.documentElement.getAttribute("data-theme")
          && !window.matchMedia("(prefers-color-scheme: dark)").matches)
    ? "https://tiles.openfreemap.org/styles/bright"
    : "https://tiles.openfreemap.org/styles/dark";

  map = new maplibregl.Map({
    container: "map",
    style: styleFor(),
    center: [HOME.lng, HOME.lat],           // MapLibre takes lng first, Leaflet took lat
    zoom: 13.1, minZoom: 11.5, maxZoom: 18.5,
    maxBounds: [[-99.34, 19.26], [-99.01, 19.56]],
    attributionControl: false,
    dragRotate: false, pitchWithRotate: false, touchPitch: false,
    // The whole point of this change: no upscaled raster anywhere.
    fadeDuration: 120,
  });
  map.touchZoomRotate.disableRotation();
  // COMPACT, since 2026-09-08. Expanded, this wraps to two full-width lines across the
  // bottom of a 393px phone and it was only ever tolerable because the legend button sat
  // in front of it. The legend is gone, so the attribution is a tappable (i) instead --
  // still there, still one tap, no longer a paragraph laid over Roma Sur.
  map.addControl(new maplibregl.AttributionControl({
    compact: true,
    customAttribution: "OpenFreeMap, OpenMapTiles, OpenStreetMap contributors",
  }), "bottom-right");

  // A circle of a real radius on the ground, as a polygon, because a styled circle layer
  // is sized in screen pixels and would stay the same size as you zoom -- which is the
  // opposite of what a "2 km from here" ring means.
  const ringOf = (m, steps) => {
    const pts = [], latR = m / 111320,
          lngR = m / (111320 * Math.cos(HOME.lat * Math.PI / 180));
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * 2 * Math.PI;
      pts.push([HOME.lng + lngR * Math.cos(t), HOME.lat + latR * Math.sin(t)]);
    }
    return pts;
  };

  // OpenFreeMap's dark style paints parks, woods and water the same near-black as the
  // ground -- landuse_park reads rgb(32,32,32) against a rgb(12,12,12) background. On a
  // map whose whole frame of reference is "distance from Parque Mexico", the park being
  // invisible is the one thing it cannot afford. These four are the only overrides, and
  // they are guarded so a style that renames a layer skips it rather than throwing.
  const tunePaint = () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark"
      || (!document.documentElement.getAttribute("data-theme")
          && window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (!dark) return;
    const set = (id, prop, val) => { if (map.getLayer(id)) map.setPaintProperty(id, prop, val); };
    set("landuse_park", "fill-color", "#16281D");
    set("landcover_wood", "fill-color", "#16281D");
    set("water", "fill-color", "#12222B");
  };

  const addRings = () => {
    if (map.getSource("rings")) return;
    const lamp = getComputedStyle(document.documentElement).getPropertyValue("--lamp").trim();
    map.addSource("rings", { type: "geojson", data: { type: "FeatureCollection",
      features: [1000, 2000, 3000, 5000].map(r => ({ type: "Feature", properties: { r },
        geometry: { type: "LineString", coordinates: ringOf(r, 96) } })) } });
    map.addLayer({ id: "rings", type: "line", source: "rings",
      paint: { "line-color": lamp, "line-width": 1.3, "line-opacity": .55,
               "line-dasharray": [2, 5] } });
  };

  map.on("load", () => {
    addRings();
    tunePaint();
    mapReady = true;
    placeMarkers();
    // MapLibre renders a compact attribution OPEN and only collapses it on the first
    // pan, so the map opens with two lines of credits laid over Roma Sur and then tidies
    // itself once you touch it. Collapse it up front: the (i) is still there and the
    // credit is still one tap away.
    document.querySelectorAll(".maplibregl-ctrl-attrib.maplibregl-compact-show")
      .forEach(el => el.classList.remove("maplibregl-compact-show"));
  });

  // The theme can change under a running map -- he picks it in Settings,
  // and iOS flips it at sunset on its own. setStyle drops every source and layer with it,
  // so the rings and the dots have to go back on after the new style loads.
  const themeWatch = () => {
    if (!map) return;
    map.setStyle(styleFor());
    // setStyle drops every source and layer with the old style, so the rings and the
    // park colours have to go back on once the new one has loaded.
    map.once("styledata", () => { addRings(); tunePaint(); });
  };
  window.addEventListener("sala:theme", themeWatch);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeWatch);

}

// Markers are DOM elements, so the dots keep a real tap target and a focus ring. 74 of them
// is well inside what this costs nothing for; a canvas layer would be faster and would lose
// the keyboard path.
let mapReady = false, markersPlaced = false;
function placeMarkers() {
  if (markersPlaced || !map) return;
  markersPlaced = true;

  const home = document.createElement("div");
  home.className = "homedot";
  new maplibregl.Marker({ element: home }).setLngLat([HOME.lng, HOME.lat]).addTo(map);
  const lbl = document.createElement("div");
  lbl.className = "homelbl";
  lbl.textContent = "Parque Mexico";
  new maplibregl.Marker({ element: lbl, anchor: "bottom" })
    .setLngLat([HOME.lng, HOME.lat]).addTo(map);

  V.forEach((v, i) => {
    const el = document.createElement("button");
    el.className = "vdot";
    el.style.setProperty("--dc", CAT(v));
    el.style.setProperty("--s", (v.dim ? 11 : 15) + "px");
    el.setAttribute("aria-label", v.name);
    el.addEventListener("click", (e) => { e.stopPropagation(); venueSheet(i); });
    new maplibregl.Marker({ element: el }).setLngLat([v.lng, v.lat]).addTo(map);
  });

  SHOWS.cin.filter(c => c.v == null).forEach(c => {
    const el = document.createElement("button");
    el.className = "vdot hollow";
    el.style.setProperty("--dc", "var(--ink-3)");
    el.style.setProperty("--s", "10px");
    el.setAttribute("aria-label", c.n || "Cinema");
    el.addEventListener("click", (e) => { e.stopPropagation(); cinemaSheet(c.id); });
    new maplibregl.Marker({ element: el }).setLngLat([c.lng, c.lat]).addTo(map);
  });
}

/* ===================== GUIDE ===================== */
function renderGuide() {
  const indies = V.map((v, i) => ({ v, i })).filter(x => x.v.grp === "indie");
  const nearest = (pred) => V.map((v, i) => ({ v, i, d: km(origin, { lat: v.lat, lng: v.lng }) }))
    .filter(x => pred(x.v)).sort((a, b) => a.d - b.d)[0];
  const picks = [
    ["Closest screen", nearest(() => true)],
    ["Closest IMAX", nearest(v => (v.f || []).some(f => /IMAX/i.test(f)))],
    ["Best independent", nearest(v => v.name.indexOf("Tonala") >= 0)],
    ["35 mm still runs", nearest(v => (v.f || []).some(f => /35 mm/i.test(f)))],
  ].filter(x => x[1]);
  // THE GUIDE TAB IS GONE (2026-09-08, his words: "i dont like the guide tab to begin w").
  // The function stays because the CONTENT is the part no ticketing app has -- what IMAX
  // with Laser actually means in this city, which room still runs 35 mm, what CDMX does
  // not have at all -- and it is waiting for a home inside the venue and film sheets
  // rather than behind a tab nobody opened. #doc-guide no longer exists, so this returns
  // instead of throwing if anything calls it before that home is built.
  if (!$("doc-guide")) return;
  $("doc-guide").innerHTML = `
    <p class="lede">Forty-two places within about five kilometres of Parque Mexico, audited one by
    one. Every claim is tagged: <span class="tag v">verified</span> means it was read off the

    <span class="tag u">unknown</span> means nobody publishes it. This is the part no ticketing app
    has.</p>
    <h2>Nearest of each kind</h2>
    <div class="picks">${picks.map(([k, x]) =>
      `<button class="pick" data-venue="${x.i}"><span class="k">${esc(k)}</span>
        <span class="n">${esc(x.v.name.replace(/^Cinemex |^Cinepolis /, ""))}</span>
        <span class="d">${far(x.d).d} &middot; ${far(x.d).w}</span></button>`).join("")}</div>
    <h2>What the formats actually mean</h2>
    ${[["IMAX with Laser", "A 4K laser projector, twelve channels of sound and a 1.90:1 screen. In this area only Cinemex Parque Delta and Cinemex Antara have it. Antara's is billed as the largest in Latin America at about 300 square metres."],
       ["CinemeXtremo (CX)", "Cinemex's own big-screen room, usually with Dolby Atmos. Cheaper than IMAX and often the same film."],
       ["Dolby Atmos", "Speakers overhead as well as around. You hear it most in a room built for it, which here means the CX rooms."],
       ["Platino", "Full recliners, a waiter, a menu. A flat price, usually 200 to 230 pesos. It is about the seat, not the screen."],
       ["Premium", "Just a wider, softer seat. Not a format. Most Cinemex sites near Roma sell every seat as Premium."],
       ["Casa de Arte", "Cinemex's art-house programming: restorations, festival films, subtitled. Insurgentes and Reforma are the closest."],
       ["Subtitulada vs Espanol", "Subtitled versus dubbed. Worth checking before you book &mdash; most family films only play dubbed."],
      ].map(([h, t]) => `<div class="card"><h3>${esc(h)}</h3><p class="tech">${esc(t)}</p></div>`).join("")}
    <h2>What is not here at all</h2>
    <table class="ruled">
      <tr><td>Dolby Cinema</td><td>Nowhere in Mexico City.</td></tr>
      <tr><td>70 mm</td><td>Nowhere in Mexico City.</td></tr>
      <tr><td>1.43:1 IMAX</td><td>Nowhere in Mexico. Every IMAX here is the 1.90:1 digital kind.</td></tr>
      <tr><td>35 mm</td><td>Survives at Cinematografo del Chopo, Filmoteca UNAM.</td></tr>
    </table>
    <h2>The independents and the free rooms</h2>
    <p class="lede">${indies.length} of the ${V.length}. None of these appear in a ticketing app,
    several are free, and one of them is the only screening room actually inside Condesa.</p>
    ${indies.map(x => {
      const d = km(origin, { lat: x.v.lat, lng: x.v.lng });
      return `<button class="frow" data-venue="${x.i}">
        <span><span class="n">${esc(x.v.name)}</span>
          <span class="s">${esc(x.v.op)}${x.v.price ? " &middot; " + esc(x.v.price) : ""}</span></span>
        <span class="cnt"><b>${far(d).d}</b><em>${esc(far(d).w)}</em></span></button>`;
    }).join("")}
    <h2>How this was made</h2>
    <p class="lede">Showtimes come from Cinemex's own public listings and were read at
    ${esc(SHOWS.at.replace("T", " "))}. The venue audit was done by hand in September 2026.
    Distances are straight-line from ${esc(origin.name || "where you are")}; walking time assumes
    4.5 km/h, which is optimistic on Insurgentes.</p>`;
}

/* ===================== WIRING ===================== */
function setTab(t) {
  S.tab = t;
  document.querySelectorAll(".tabs button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  ["films", "shows", "map", "settings"].forEach(k =>
    $("pane-" + k).classList.toggle("on", k === t));
  if (t === "map") { initMap(); setTimeout(() => map && map.resize(), 60); }
  if (t === "films") renderFilms();
  if (t === "settings") renderSettings();
}
document.addEventListener("click", e => {
  const tab = e.target.closest(".tabs button"); if (tab) return setTab(tab.dataset.tab);
  const day = e.target.closest("[data-day]");
  // renderFilters BEFORE renderShows, and it is not cosmetic: it is what greys out the
  // chips that cannot match the newly-selected day, and it is also what drops a filter
  // that has just become impossible back to "Everything". Without it here, moving along
  // the date rail while a filter is on lands on an empty list under a chip that is still
  // lit up.
  if (day) { S.day = +day.dataset.day; renderDates(); renderFilters(); renderShows();
             if (S.tab === "films") renderFilms(); return; }
  const f = e.target.closest("[data-filter]");
  if (f) {
    const k = f.dataset.filter;
    // "Everything" is not a sixth filter, it is the button that clears the other five.
    if (k === "all") S.filters.clear();
    else if (S.filters.has(k)) S.filters.delete(k);
    else S.filters.add(k);
    saveFilters();
    renderFilters(); renderShows();
    if (S.tab === "films") renderFilms();
    return;
  }
  // Before [data-cin] and [data-film]: the button sits inside a sheet whose rows carry both.
  const star = e.target.closest("[data-star]");
  if (star) {
    const id = star.dataset.star;
    if (S.starred.has(id)) S.starred.delete(id); else S.starred.add(id);
    saveStarred();
    const on = S.starred.has(id);
    star.setAttribute("aria-pressed", String(on));
    star.querySelector("span").textContent = on ? "Starred" : "Star this film";
    renderFilters(); renderShows();
    if (S.tab === "films") renderFilms();
    return;
  }
  const cin = e.target.closest("[data-cin]"); if (cin) return cinemaSheet(cin.dataset.cin);
  const film = e.target.closest("[data-film]");
  if (film) {
    // A Coming up row carries the day it starts. Move the whole app to that day before
    // opening the sheet: the sheet lists cinemas for S.day, so without this it would open
    // empty under a row that had just said which day to go.
    if (film.dataset.jump != null) {
      S.day = +film.dataset.jump;
      renderDates(); renderFilters(); renderShows(); renderFilms();
    }
    return filmSheet(film.dataset.film);
  }
  const ven = e.target.closest("[data-venue]"); if (ven) return venueSheet(+ven.dataset.venue);
  // After [data-venue], never before: the rows inside this sheet carry one, and a row tap
  // has to open that venue rather than redraw the list it was tapped from.
  if (e.target.closest("#freebtn")) return freeSheet();
  if (e.target.closest("#scrim")) return closeSheet();
  if (e.target.closest("#zin")) return map && map.zoomIn();
  if (e.target.closest("#zout")) return map && map.zoomOut();
  if (e.target.closest("#recenter"))
    return map && map.easeTo({ center: [HOME.lng, HOME.lat], zoom: 13.1, duration: 450 });
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ONE BOX, TWO INPUTS. Showtimes and Films are separate panes, and the box has to be at
   the top of whichever list he is looking at, so the two are kept in step through S.q
   rather than through the DOM. Debounced: re-drawing 8,300 showtimes on every keystroke
   is felt on a phone. */
let qTimer = null;
function onQuery(e) {
  const raw = e.target.value;
  const v = fold(raw).trim();
  [$("q"), $("qf")].forEach(el => { if (el && el !== e.target) el.value = raw; });
  if (v === S.q) return;
  S.q = v;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    renderFilters();
    renderShows();
    if (S.tab === "films") renderFilms();
  }, 120);
}
["q", "qf"].forEach(id => {
  const el = $(id);
  if (el) el.addEventListener("input", onQuery);
});

/* SUGGESTIONS. Ask 8 on 12 September, "make the search bar better". The box only ever
   filtered: "insurg" emptied the list while Cinemex Insurgentes was 300 metres away. Now it
   also suggests, in four groups, from the second letter. Movies and cinemas carry the same
   data-film and data-cin as the lists, so the tap handler that already opens those sheets
   opens these too; a person or a genre fills the box instead. */
let FILM_CINEMAS = null;
function filmCinemaCounts() {
  if (FILM_CINEMAS) return FILM_CINEMAS;
  FILM_CINEMAS = new Map();
  for (const c of SHOWS.cin) {
    const seen = new Set(c.s.map(x => String(x[0])));
    seen.forEach(fid => FILM_CINEMAS.set(fid, (FILM_CINEMAS.get(fid) || 0) + 1));
  }
  return FILM_CINEMAS;
}
function suggest(q) {
  const f = fold(q).trim();
  if (f.length < 2) return [];
  const rank = t => { const x = fold(t); return x.startsWith(f) ? 0 : x.includes(" " + f) ? 1 : x.includes(f) ? 2 : -1; };
  const best = (a, b) => a.r - b.r;
  const counts = filmCinemaCounts();
  const films = Object.entries(SHOWS.films)
    .map(([fid, x]) => ({ fid, x, r: Math.min(...[rank(x.n), rank(x.o || "")].map(v => (v < 0 ? 9 : v))) }))
    .filter(o => o.r < 9)
    .sort((a, b) => best(a, b) || (b.x.c || 0) - (a.x.c || 0)).slice(0, 4)
    .map(o => { const n = counts.get(String(o.fid)) || 0;
      return { g: "Movies", t: "film", id: o.fid, n: o.x.n, d: `at ${n} ${n === 1 ? "cinema" : "cinemas"}` }; });
  const people = new Map();
  for (const x of Object.values(SHOWS.films)) {
    if (!x.dir) continue;
    for (const who of String(x.dir).split(/\s*,\s*/)) {
      const r = rank(who);
      if (r >= 0 && who.length > 2) {
        const p = people.get(who) || { r, films: [] };
        p.films.push(x.n); people.set(who, p);
      }
    }
  }
  const dirs = [...people.entries()].sort((a, b) => a[1].r - b[1].r).slice(0, 2)
    .map(([who, p]) => ({ g: "People", t: "q", q: who, n: who, d: "Director of " + p.films.slice(0, 2).join(", ") }));
  const cins = SHOWS.cin.map(c => ({ c, r: rank(c.n) })).filter(o => o.r >= 0)
    .sort((a, b) => best(a, b) || km(origin, a.c) - km(origin, b.c)).slice(0, 3)
    .map(o => { const F = far(km(origin, { lat: o.c.lat, lng: o.c.lng }));
      return { g: "Cinemas", t: "cin", id: o.c.id, n: o.c.n, d: `${F.d} · ${F.w}` }; });
  const genres = new Map();
  for (const x of Object.values(SHOWS.films)) for (const g of x.g || []) if (rank(g) >= 0) genres.set(g, (genres.get(g) || 0) + 1);
  const gens = [...genres.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || b[1] - a[1]).slice(0, 2)
    .map(([g, n]) => ({ g: "Genres", t: "q", q: g, n: g, d: `${n} ${n === 1 ? "movie" : "movies"}` }));
  return [...films, ...dirs, ...cins, ...gens];
}
function renderSuggest(input) {
  const box = $(input.id + "-sugg"), clear = document.querySelector(`[data-clear="${input.id}"]`);
  if (clear) clear.hidden = !input.value;
  if (!box) return;
  const list = document.activeElement === input ? suggest(input.value) : [];
  if (!list.length) { box.hidden = true; box.innerHTML = ""; return; }
  let group = "";
  box.innerHTML = list.map(o => {
    const head = o.g !== group ? `<div class="sgh">${esc(o.g)}</div>` : "";
    group = o.g;
    const attr = o.t === "film" ? `data-film="${esc(String(o.id))}"` : o.t === "cin" ? `data-cin="${esc(String(o.id))}"`
      : `data-sgq="${esc(o.q)}" data-for="${input.id}"`;
    return `${head}<button class="sgr${o.t === "cin" ? " place" : ""}" ${attr}><b>${esc(o.n)}</b><em>${esc(o.d)}</em></button>`;
  }).join("");
  box.hidden = false;
}
["q", "qf"].forEach(id => {
  const el = $(id);
  if (!el) return;
  el.addEventListener("input", () => renderSuggest(el));
  el.addEventListener("focus", () => renderSuggest(el));
  // Late enough that a tap on a suggestion lands first; the panel never steals the tap.
  el.addEventListener("blur", () => setTimeout(() => { const b = $(id + "-sugg"); if (b) b.hidden = true; }, 180));
  el.addEventListener("keydown", e => { if (e.key === "Enter") { el.blur(); } });
});
document.addEventListener("click", e => {
  const pick = e.target.closest(".sugg [data-film], .sugg [data-cin], .sugg [data-sgq]");
  if (pick) {
    const box = pick.closest(".sugg");

  [/\bwithin walking distance\b/g, "a poca distancia a pie"],

  [/\bshowings\b/g, "funciones"], [/\bshowing\b/g, "función"],
  [/\bcinemas\b/g, "cines"], [/\bcinema\b/g, "cine"],
  [/\bfilms\b/g, "películas"], [/\bfilm\b/g, "película"],

/* PUTTING ENGLISH BACK.

 * Most of the page is redrawn by renderShows/renderFilms/renderSettings, which emit English,

 * aria-labels are written once in the markup and no render function owns them. Translating
 * them is a one-way door -- nothing would ever write English back.

 * after Spanish then English the tabs still read Películas, Horarios, Mapa, Ajustes.
 *
 * So every node this layer edits records what it said BEFORE the first edit, and going back

/* SWIPE DOWN TO REFRESH. Ask 1 on 12 September, "like most apps". The listings are a
   snapshot published with the page, so a pull asks the site for a newer one. A new build
   comes through the service worker, which takes over and reloads the page. New showtimes on
   the same build come by fetching the page fresh -- the query string keeps the worker's
   cache out of it -- and are written into the shell cache BEFORE reloading, because the
   worker answers a navigation from that cache first and a plain reload would put the old
   listings straight back. Otherwise it says when these were read, and with no signal it
   says that instead of pretending. */

  // tests does not count one inside the regex. Keep literal braces out of this comment too.
  const m = String(html).match(/const SHOWS=\x7B"at":"([^"]+)"/);
