<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">

<title>Sala Nearby</title>
<meta name="description" content="Every cinema within walking distance of Parque Mexico, with tonight's real showtimes.">

<!-- THE TAGS THAT MAKE IT AN APP AND NOT A PAGE. iOS reads these at the moment you tap
     Add to Home Screen. Without apple-mobile-web-app-capable the icon opens Safari with
     an address bar and a toolbar; with it there is no browser furniture at all. The
     status-bar style has to be black-translucent for the app to draw under the notch,
     which is what env(safe-area-inset-top) in the stylesheet is already compensating
     for -- the two only make sense together. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sala">
<meta name="format-detection" content="telephone=no">

<!-- Two, because the browser chrome is painted before any CSS runs and a single colour
     would flash the wrong ground on launch in one of the themes. -->
<meta name="theme-color" content="#FAF6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100E" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- crossorigin ON ALL THREE, and it is what makes the app work with no signal.
     A plain cross-origin <link> or <script> is a no-cors request, so the service
     worker sees an OPAQUE response -- status 0, ok false -- and every branch in
     sw.js correctly refuses to cache one. The result was that the map ran offline
     purely on the browser's own HTTP cache, which is evictable. Both hosts send
     access-control-allow-origin: *, checked, so asking in CORS mode costs nothing
     and gives the worker a response it is allowed to keep. -->
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>

<style>
:root{color-scheme:light dark}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]:not([hidden=until-found]){display:none!important}

/* THE LAUNCH SCREEN. iOS shows a white rectangle between the tap and the first paint
   unless you ship a splash image per device size, which is a dozen PNGs and a dozen
   media queries. This is the cheap version that covers every device: paint the app's
   own ground colour immediately, with the wordmark, and take it away on load. It is
   inside the document so it costs no extra request. */
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
      background:#FAF6F0;color:#191310;transition:opacity .28s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .w{font:800 30px/1 "Bricolage Grotesque",system-ui,-apple-system,sans-serif;
         letter-spacing:-.03em}
#boot .t{margin-top:9px;font:500 10px/1 ui-monospace,"IBM Plex Mono",Menlo,monospace;
         letter-spacing:.22em;text-transform:uppercase;color:#8B7C72}
@media (prefers-color-scheme:dark){#boot{background:#14100E;color:#F4EDE5}
  #boot .t{color:#8A7C72}}
</style>
</head>
<body>
<div id="boot"><div><div class="w">Sala Nearby</div><div class="t">Roma &middot; Condesa</div></div></div>
<style>
/* LEAFLET 1.9.4 core, inlined because the CSP admits scripts from cdnjs but not stylesheets */
/* ============================================================
   SALA NEARBY  --  a darkened auditorium with a tungsten lamp on.
   The ground is warm and red-biased rather than neutral black,
   because a cinema at night is never grey; the one accent is
   projector amber. Format colours are a legend, not decoration.
   ============================================================ */
:root{
  --ground:#FAF6F0; --surface:#FFFFFF; --sunk:#F1EAE1; --sunk2:#E9DFD3;
  --ink:#191310; --ink-2:#5C4F47; --ink-3:#73655C;
  --line:#E4DACE; --line-2:#EFE7DC;
  --lamp:#9A5C08; --lamp-ink:#FFFFFF; --lamp-soft:#F7EBD6;
  --beam:#1E6E86;
  --c-big:#C4471C; --c-lux:#7B4FA6; --c-std:#2C6AA8; --c-art:#1E7C52; --c-free:#96700E;
  --ok:#18704A; --ok-soft:#E2F0E8;
  --maybe:#8A6A1F; --maybe-soft:#F5EDD9;
  --no:#9B3F2B; --no-soft:#F7E4DD;
  --tilefilter:none;
  --sheet-shadow:0 -8px 40px rgba(25,19,16,.16);
  --tap:rgba(154,92,8,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#14100E; --surface:#1F1815; --sunk:#0E0B0A; --sunk2:#2A211C;
    --ink:#F4EDE5; --ink-2:#BCADA2; --ink-3:#9A8C82;
    --line:#332A25; --line-2:#261F1B;
    --lamp:#E8A33D; --lamp-ink:#14100E; --lamp-soft:#3A2A12;
    --beam:#86C6DA;
    --c-big:#F0855A; --c-lux:#BE95E0; --c-std:#7FADE0; --c-art:#6DC79C; --c-free:#DCB44E;
    --ok:#6DC79C; --ok-soft:#152A20;
    --maybe:#DCB44E; --maybe-soft:#2E2411;
    --no:#E58A6E; --no-soft:#341C15;
    --tilefilter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.92) saturate(.55) sepia(.18);
    --sheet-shadow:0 -8px 40px rgba(0,0,0,.55);
    --tap:rgba(232,163,61,.14);
  }
}
:root[data-theme="dark"]{
  --ground:#14100E; --surface:#1F1815; --sunk:#0E0B0A; --sunk2:#2A211C;
  --ink:#F4EDE5; --ink-2:#BCADA2; --ink-3:#9A8C82;
  --line:#332A25; --line-2:#261F1B;
  --lamp:#E8A33D; --lamp-ink:#14100E; --lamp-soft:#3A2A12;
  --beam:#86C6DA;
  --c-big:#F0855A; --c-lux:#BE95E0; --c-std:#7FADE0; --c-art:#6DC79C; --c-free:#DCB44E;
  --ok:#6DC79C; --ok-soft:#152A20;
  --maybe:#DCB44E; --maybe-soft:#2E2411;
  --no:#E58A6E; --no-soft:#341C15;
  --tilefilter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.92) saturate(.55) sepia(.18);
  --sheet-shadow:0 -8px 40px rgba(0,0,0,.55);
  --tap:rgba(232,163,61,.14);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:var(--lamp);text-decoration:none}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.read{font-family:Newsreader,Georgia,"Times New Roman",serif}

.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--ground)}
.chrome{-webkit-user-select:none;user-select:none}

.top{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 9px) 14px 9px;
  padding-left:calc(env(safe-area-inset-left,0px) + 14px);
  padding-right:calc(env(safe-area-inset-right,0px) + 14px);
  background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30;
}
.top .from{flex:1;min-width:0;text-align:left;display:block;border-radius:10px;padding:3px 6px;margin:-3px -6px}
.top .from:active{background:var(--tap)}
/* The chevron is what says the name can be changed. Beam blue, because it is about place. */
.top .from .n::after{content:"";display:inline-block;width:6px;height:6px;margin-left:9px;
  border-right:1.8px solid var(--beam);border-bottom:1.8px solid var(--beam);transform:translateY(-3px) rotate(45deg)}
.pksrch{margin-top:10px}
.pksrch input,.pksave input{-webkit-appearance:none;appearance:none;width:100%;min-width:0;min-height:44px;border-radius:12px;
  border:1px solid var(--line);background:var(--ground);color:var(--ink);font:inherit;font-size:16px;padding:0 13px}
.pksrch input:focus,.pksave input:focus{outline:2px solid var(--beam);outline-offset:-1px;border-color:var(--beam)}
.pkrow{display:block;width:100%;text-align:left;padding:11px 18px;border-bottom:1px solid var(--line-2);min-height:54px}
.pkrow:active{background:var(--tap)}
.pkrow.on{box-shadow:inset 3px 0 0 var(--beam)}
.pkn{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.3}
.pkn em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:8px;font-weight:500}
.pkl{display:block;margin-top:3px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--beam);line-height:1.4}
.pksaved{display:grid;grid-template-columns:1fr auto;align-items:stretch;border-bottom:1px solid var(--line-2)}
.pksaved .pkrow{border-bottom:none}
.pkx{padding:0 16px;font-size:12.5px;color:var(--ink-2);min-height:44px}
.pksave{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 18px 12px;border-bottom:1px solid var(--line-2)}
.pksave button{min-height:44px;border-radius:12px;background:var(--lamp);color:var(--lamp-ink);font-weight:700;padding:0 18px;font-size:14px}
.note.pkhint{padding:12px 18px 0;margin:0}
.note.pksrc{padding-bottom:18px;font-size:11px}
.top .from .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:block}
.top .from .n{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.2}
.iconbtn{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--sunk)}
.iconbtn:active{background:var(--tap)}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:var(--ink-2);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp)}
.iconbtn[aria-pressed="true"] svg{stroke:var(--lamp-ink)}
/* The location button is about place, so it is drawn in the beam colour until it is on,
   when it lights amber like every other control that is on. */
#locbtn[aria-pressed="false"] svg{stroke:var(--beam)}

.panes{position:relative;min-height:0}
.pane{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:none}
.pane.on{display:block}
.pane.map{overflow:hidden}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);position:relative;z-index:30}
.tabs button{display:grid;place-items:center;gap:3px;padding:8px 4px 7px;min-height:52px;color:var(--ink-3);position:relative}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.tabs button[aria-selected="true"]{color:var(--lamp)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--lamp);border-radius:0 0 2px 2px}
.tabs button:active{background:var(--tap)}
/* SWIPE TO REFRESH. Grows under the finger from nothing, in the beam colour, because it is
   about how fresh the listing is rather than a choice he is making. */
.ptr{height:0;overflow:hidden;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--beam);background:var(--surface);transition:height .22s ease}
.ptr.drag{transition:none}
/* SETTINGS. The same grouped-card language as the sheets, and the segmented controls light in
   the lamp colour a pressed chip already uses, so "chosen" looks the same everywhere. */
.set{max-width:720px;margin:0 auto;padding:18px 16px 32px}
.seth{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 2px 16px}
.setgrp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.setgrp h3{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 10px 2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--sunk);border:1px solid var(--line-2)}
.seg button{min-height:44px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);padding:0 6px}
.seg button:active{background:var(--tap)}
.seg button[aria-checked="true"]{background:var(--lamp);color:var(--lamp-ink)}
.setnote{font-size:13px;line-height:1.5;color:var(--ink-2);margin:10px 2px 0}
.setnote b{color:var(--ink);font-weight:600}

/* ---------- date + filter rails ---------- */
.rail{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail.dates{border-bottom:none;padding-bottom:4px}
.rail button{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--ground);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;gap:7px}
.rail button i{width:8px;height:8px;border-radius:50%;display:block}
.rail button[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
/* Nothing of this kind on the selected day. Kept in place rather than removed so the row
   does not reflow under his thumb as he moves along the date rail. */
.rail button[disabled]{opacity:.34;border-style:dashed}
.rail button[aria-pressed="true"] i{box-shadow:0 0 0 1.5px var(--lamp-ink)}
.rail .day{flex-direction:column;gap:1px;padding:5px 12px;min-width:56px}
.rail .day b{font-size:15px;font-weight:700;line-height:1.1}
.rail .day em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}

/* SEARCH. 73 films across 35 cinemas and 31 days, and the only way to find one was to
   scroll. One box, one piece of state, drawn into both lists. */
.srch{padding:9px 14px 4px;background:var(--surface)}
.srch input{-webkit-appearance:none;appearance:none;width:100%;min-height:42px;
  padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--ground);
  color:var(--ink);font:400 15px/1 "Bricolage Grotesque",system-ui,-apple-system,sans-serif}
.srch input::placeholder{color:var(--ink-3)}
.srch{position:relative}
.srch input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.srch input{padding-right:46px}
/* CLEAR. A drawn cross, 44 points square, inside the box's right edge. */
.srx{position:absolute;right:14px;bottom:3px;width:44px;height:44px;border-radius:0 12px 12px 0}
.srx::before,.srx::after{content:"";position:absolute;left:50%;top:50%;width:13px;height:1.8px;background:var(--ink-3);border-radius:1px}
.srx::before{transform:translate(-50%,-50%) rotate(45deg)}
.srx::after{transform:translate(-50%,-50%) rotate(-45deg)}
.srx:active{background:var(--tap)}
.sugg{position:absolute;left:14px;right:14px;top:calc(100% + 2px);z-index:60;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.22);max-height:62vh;overflow-y:auto;overscroll-behavior:contain;padding:4px 0}
.sgh{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:9px 14px 3px}
.sgr{display:block;width:100%;text-align:left;padding:8px 14px;min-height:48px}
.sgr:active{background:var(--tap)}
.sgr b{display:block;font-weight:700;font-size:14.5px;letter-spacing:-.01em;line-height:1.25}
.sgr em{display:block;font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.sgr.place em{color:var(--beam)}
.srch input:focus{outline:2px solid var(--lamp);outline-offset:-1px;border-color:var(--lamp)}

.count{padding:11px 16px 7px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.count b{color:var(--lamp);font-weight:600}

/* ---------- showtime blocks ---------- */
.cin{border-bottom:1px solid var(--line-2);padding:13px 16px 15px}
.cin .hdr{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;width:100%;text-align:left}
.cin .hdr:active{background:var(--tap)}
.cin .n{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.25}
.cin .s{color:var(--ink-2);font-size:12.5px;margin-top:2px;line-height:1.35}
.cin .far{text-align:right;flex:none}
.cin .far b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--beam)}
.cin .far em{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;font-style:normal;color:var(--ink-3);letter-spacing:.06em;margin-top:2px;white-space:nowrap}
/* WHEN TO LEAVE. Spans both columns under the name and the distance, because it is a
   sentence about the pair of them rather than a property of either. Amber only when the
   answer is "now" -- an urgent colour on every row is not urgency, it is wallpaper. */
.cin .lv{grid-column:1/-1;margin-top:7px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.cin .lv.now{color:var(--lamp);font-weight:600}

/* THE SHOWTIMES LIST CARRIES POSTERS TOO. It was the one place in the app that did not,
   and it is the place he actually reads -- a wall of cinema names and times with nothing
   to recognise a film by. The poster is the tap target for the film sheet, so it is a
   button rather than an image. */
.film{margin-top:14px;display:grid;grid-template-columns:46px 1fr;gap:11px;align-items:start}
.film .fb{min-width:0}
.film .pw{width:46px;height:69px}
/* Title on its own line, same reasoning as the films index: name, runtime, rating and
   genre ran together into one wrapped paragraph and stopped being scannable. */
.film .ft{display:block}
.film .ft b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.film .ft span{display:block;margin-top:3px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.04em}

/* A POSTER THAT IS ALLOWED TO BE MISSING. Cineteca Nacional publishes no artwork on any
   page we can read -- checked, its cartelera and its film pages carry only site chrome --
   so 33 of the 73 films here have no poster and never will. An empty box is a bug; a
   designed empty state is not. The initials sit on a tint derived from the film's own id,
   which keeps one film the same colour in the list, the sheet and the index. */
.pw{position:relative;display:block;flex:none;border-radius:5px;overflow:hidden;padding:0;
  background:var(--sunk2);border:1px solid var(--line-2)}
.pw::after{content:attr(data-ini);position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font:700 var(--pf,15px)/1 "IBM Plex Mono",monospace;letter-spacing:.05em;
  color:color-mix(in srgb,var(--ink) 58%,transparent);
  background:linear-gradient(155deg,color-mix(in srgb,hsl(var(--ph,210) 44% 52%) 34%,var(--sunk2)),var(--sunk2))}
.pw img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
button.pw:active{opacity:.72}
.vgrp{margin-top:6px}
.vgrp .vl:empty{display:none}
.vgrp .vl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* The observed adult price, on the version line. Brighter than the format label beside it
   because it is the value and the label is the caption, and monospace so a column of them
   down the list lines up. */
.vgrp .vl .pri{color:var(--ink-2);font-weight:600;letter-spacing:.04em;font-size:10.5px}
.rooms{width:100%;border-collapse:collapse;font-size:12.5px;margin:0}
.rooms th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:0 8px 5px 0;white-space:nowrap}
.rooms td{padding:4px 8px 4px 0;border-top:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.rooms td:first-child{color:var(--ink);font-weight:500}
.rooms .no{color:var(--ink-3)}
/* A correction appended to an audit row. Set apart from his sentence rather than run into
   it, so it reads as the showtimes answering back and not as part of the original note. */
.spec .qual{display:block;margin-top:4px;color:var(--ink-3);font-size:12.5px;line-height:1.45}
.rmwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* One theme reviewers keep returning to, as a bar rather than a number: 45% reads faster
   as a length than as two digits. */
.thm{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px;margin:0}
.thm b{font-weight:500;color:var(--ink-2)}
.thm em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.thm i{grid-column:1/3;height:3px;border-radius:2px;background:var(--sunk2);display:block;margin-bottom:4px}
.thm i span{display:block;height:100%;border-radius:2px;background:var(--lamp)}
.warm{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.warm b{color:var(--ink);display:block;font-size:13px;margin-bottom:3px}
.warm .q{color:var(--ink-3);font-style:italic}
.pricetab{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;align-items:baseline}
.pricetab b{font-weight:500;color:var(--ink-2)}
.pricetab em{font-style:normal;font-family:"IBM Plex Mono",monospace;color:var(--ink);font-weight:600}
.note{font-size:12px;line-height:1.5;color:var(--ink-3);margin:7px 0 0}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.t{
  min-height:38px;min-width:62px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
}
.t:active{background:var(--tap)}
.t.past{opacity:.34}
.t.soon{border-color:var(--lamp);color:var(--lamp);font-weight:600}
.t.low{border-color:var(--no);color:var(--no)}
/* Cinemex reports three seat states and only "low" was ever shown. There are rarely many
   of the middle one -- 26 showings out of 8,300 today -- but those 26 are exactly the ones
   worth knowing about before he walks there. */
.t.mid{border-color:var(--maybe);color:var(--maybe)}
.t em{font-style:normal;font-size:9px;margin-left:4px;opacity:.75}
/* The room. Cinemex sends it with every session and it was going into the aria-label and
   nowhere a sighted person could see it. On the film sheet, where he is picking one
   showing rather than scanning a list, it belongs under the time. */
.t.room{flex-direction:column;gap:0;padding:5px 10px;min-width:66px}
.t.room i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:8.5px;
  letter-spacing:.06em;color:var(--ink-3);margin-top:2px;text-transform:uppercase}

.badge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:4px;line-height:1.35;white-space:nowrap;background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.badge.imax{background:var(--beam);color:var(--ground);box-shadow:none}
.badge.atmos{background:var(--c-lux);color:var(--ground);box-shadow:none}
.badge.plat{background:var(--c-big);color:var(--ground);box-shadow:none}
.badge.sub{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.badge.dub{background:transparent;color:var(--ink-2)}

.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;line-height:1.35;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.tag.imax{background:var(--beam);color:var(--ground)}
.tag.v{background:var(--ok-soft);color:var(--ok)}
.tag.l{background:var(--maybe-soft);color:var(--maybe)}
.tag.u{background:var(--no-soft);color:var(--no)}

/* ---------- films index ---------- */
.frow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:13px 16px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
/* A film row carries its poster, so the grid gains a column. The guide's independent-venue
   rows use .frow too and have no poster, which is why the poster column only appears on
   rows that actually have one. */
.frow.haspos{grid-template-columns:52px 1fr auto}
.frow .pw{width:52px;height:78px;--pf:16px}
.frow:active{background:var(--tap)}
/* THE TITLE IS ITS OWN LINE. These were inline spans, so a film's name and its runtime,
   rating, genres and nearest cinema ran together into one paragraph -- "Coyote Vs Acme
   1h38m A Comedia, Sci-Fi nearest Insurgentes 302 m" as a single wrapped blob. On a phone
   that is the difference between scanning a list and reading it. */
.frow .n{display:block;font-weight:700;font-size:15.5px;letter-spacing:-.01em;line-height:1.25}
.frow .s{display:block;color:var(--ink-2);font-size:12.5px;margin-top:4px;line-height:1.4}
/* And the badges are capped at three with a count, because five of them wrapped onto two
   rows and made every row twice as tall as the thing it was describing. */
.frow .fm{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.frow .fm .more{font:500 10px/1 "IBM Plex Mono",monospace;color:var(--ink-3);
  letter-spacing:.04em;padding:0 2px}
/* WHERE IT IS PLAYING IS NOT THE SAME KIND OF FACT AS HOW LONG IT IS. The two ran
   together into one wrapped grey paragraph -- "1h38m - A - Comedia, Sci-Fi - nearest
   Insurgentes 302 m" -- and the half he acts on was the tail of it. Own line, own colour,
   the distance in the same mono face the rest of the app measures distance in. */
.frow .at{display:block;margin-top:3px;font-size:12px;color:var(--ink-2);line-height:1.35}
.frow .at b{font-weight:600;color:var(--ink)}
.frow .at span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--beam);letter-spacing:.02em;
  white-space:nowrap}
.frow .cnt{text-align:right;font-family:"IBM Plex Mono",monospace}
.frow .cnt b{display:block;font-size:16px;font-weight:600;color:var(--lamp)}
/* COMING UP. Separated from the day's films by a rule and a mono heading, the same
   vocabulary the sheet sections already use, because it is a different question rather
   than more of the same answer. */
.up{border-top:1px solid var(--line);margin-top:10px;background:var(--sunk)}
.up h3{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0;padding:14px 16px 6px}
.up .frow{background:var(--surface)}
.up .note{padding:0 16px 18px;margin:9px 0 0}
/* The last-day badge borrows the format badge's shape and the lamp, which is the one
   colour in this palette that means act on this -- it is already the leave-now line and
   the showings count. NOT --c-big: that is the Platino badge, and a film can be both, so
   the two would be the same orange rectangle side by side on the same row. */
.badge.last{background:var(--lamp);color:var(--lamp-ink)}
.badge.last{box-shadow:none}
/* STAR. 44 points tall like every other control he taps, and lit in the lamp colour the
   pressed chips already use, so a starred film reads as the same kind of "on". */
.starbtn{display:inline-flex;align-items:center;gap:7px;min-height:44px;margin:8px 0 4px;padding:0 14px;
  border-radius:11px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);
  font:600 13.5px/1 "Bricolage Grotesque",system-ui,-apple-system,sans-serif}
.starbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.starbtn:active{background:var(--tap)}
.starbtn[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.starbtn[aria-pressed="true"] svg{fill:currentColor}
.stm{width:12px;height:12px;fill:var(--lamp);stroke:none;vertical-align:-1px;margin-right:5px}
.frow .cnt em{display:block;font-style:normal;font-size:9.5px;color:var(--ink-3);letter-spacing:.06em;margin-top:2px}
/* The poster at the top of a film's sheet. Kept small on purpose: the file is 346 px wide,
   so anything above about 120 pt would start to look soft on a 3x screen, which is the
   complaint this whole change exists to answer. */
.sheet .poshead{position:relative;display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:start;
  padding:14px 18px 16px;margin:0 -18px}
.sheet .poshead .pw{width:88px;height:132px;border-radius:7px;--pf:24px;box-shadow:0 4px 18px rgba(0,0,0,.32)}

/* THE POSTER, BEHIND ITS OWN HEADER. The image is already being fetched for the thumbnail
   in front of it, so this costs no request. Blurred hard and pushed under a scrim because
   it is a ground, not a picture -- at full strength it fights every word on top of it. The
   scrim is a gradient to the sheet's own surface colour so the header dissolves into the
   body rather than ending on a line. `overflow:hidden` on the header is what keeps the
   blur's soft edge from bleeding over the rounded top corners of the sheet. */
.sheet .poshead{overflow:hidden;isolation:isolate}
.sheet .poshead .bd{position:absolute;inset:-28px -28px auto;height:calc(100% + 56px);z-index:-1;
  background-position:center 22%;background-size:cover;filter:blur(26px) saturate(1.25);
  opacity:.30;transform:scale(1.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet .poshead .bd{opacity:.34}}
:root[data-theme="dark"] .sheet .poshead .bd{opacity:.34}
.sheet .poshead .sc{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 46%,transparent) 0%,
                                    color-mix(in srgb,var(--surface) 78%,transparent) 58%,
                                    var(--surface) 100%)}

/* THE SYNOPSIS, THREE LINES UNTIL HE ASKS FOR MORE. Coyote vs Acme's runs 96 words and
   pushed every showtime below the fold on a 390 px screen, which is the opposite of what
   this sheet is for. `-webkit-line-clamp` is the only thing that truncates on a line
   boundary rather than a character count, and it is supported everywhere this runs.
   The toggle is a real button so it is reachable by keyboard and reads to VoiceOver. */
.sheet .syn{color:var(--ink-2);font-size:13px;line-height:1.5;margin-top:9px}
.sheet .syn p{margin:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.sheet .syn.open p{-webkit-line-clamp:unset;display:block}
.sheet .syn .more{margin-top:5px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--lamp);min-height:28px}
.sheet .syn .more:active{opacity:.6}

/* ---------- map ---------- */
#map{position:absolute;inset:0;background:var(--sunk)}
/* MapLibre draws its own canvas, so the dark-mode tile filter that used to invert a
   light raster tile is gone -- the dark map is a real dark style now, not a photographic
   negative of a light one, which is why the labels are legible on it. */
.maplibregl-canvas{outline:none}
.maplibregl-ctrl-attrib{background:color-mix(in srgb,var(--surface) 82%,transparent)!important;color:var(--ink-3);font-size:9.5px;font-family:"IBM Plex Mono",monospace;padding:1px 6px;border-radius:6px 0 0 0}
.maplibregl-ctrl-attrib a{color:var(--ink-2);text-decoration:none}
.maplibregl-ctrl-bottom-right{z-index:400}
/* The venue dots. Real DOM elements rather than canvas circles, so they keep the tap
   target and the focus ring the rest of the app already has. */
.vdot{width:var(--s);height:var(--s);border-radius:50%;border:2px solid var(--dc);
  background:color-mix(in srgb,var(--dc) 55%,transparent);cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.35)}
.vdot.hollow{background:color-mix(in srgb,var(--dc) 12%,transparent);border-width:1.5px}
.vdot:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.homedot{width:13px;height:13px;border:3px solid var(--lamp);border-radius:50%;background:var(--surface)}
.homelbl{font:600 10px/1 "IBM Plex Mono",monospace;color:var(--ink-2);
  background:color-mix(in srgb,var(--surface) 88%,transparent);padding:3px 6px;border-radius:5px;
  transform:translateY(-26px);white-space:nowrap}
.lbl{background:none;border:none;box-shadow:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:11.5px;color:var(--ink);text-shadow:0 0 4px var(--ground),0 0 4px var(--ground),0 0 8px var(--ground);padding:0;white-space:nowrap}
.lbl::before{display:none}
.mapctl{position:absolute;right:12px;top:12px;z-index:600;display:grid;gap:8px}
.mapctl button{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.mapctl button:active{background:var(--tap)}
/* THE MAP'S ONLY WORDS. Bottom left, opposite the attribution, in the colour this palette
   has carried for free venues since the first build and never used. It is a caption as
   much as a control: the legend came off on his say-so and the map has said nothing about
   itself since. */
.mapfree{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  z-index:600;min-height:38px;padding:0 14px;border-radius:19px;background:var(--surface);
  border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--c-free);font-weight:600}
.mapfree:active{background:var(--tap)}
.stale{display:block;margin:0 0 10px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--c-free);background:var(--surface);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13px;line-height:1.45;text-transform:none;letter-spacing:0}
.stale b{display:block;color:var(--c-free);margin-bottom:2px}
/* An empty action bar is 25 pixels of padding and a rule under a heading. A sheet that
   has no single action -- fifteen venues have fifteen -- should not draw one. */
.sheet .go:empty{display:none}
.mapctl svg{width:20px;height:20px;fill:none;stroke:var(--ink-2);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}








/* ---------- bottom sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,7,6,.42);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:900}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:var(--sheet-shadow);transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);max-height:92dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:translateY(0)}
.grab{padding:9px 0 4px;display:grid;place-items:center;flex:none;touch-action:none;cursor:grab}
.grab::before{content:"";width:38px;height:4px;border-radius:2px;background:var(--line);display:block}
.sheet .head{padding:4px 18px 12px;border-bottom:1px solid var(--line-2);flex:none;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;border-left:4px solid var(--cat,var(--lamp))}
.sheet h2{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:0;text-wrap:balance}
.sheet .addr{color:var(--ink-2);font-size:13px;margin-top:4px;line-height:1.35}
.sheet .far{text-align:right;flex:none}
.sheet .far b{display:block;font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;letter-spacing:-.02em}
.sheet .far em{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;font-style:normal;color:var(--ink-3);margin-top:2px;white-space:nowrap}
.sheet .go{display:flex;gap:8px;padding:12px 18px;flex:none;border-bottom:1px solid var(--line-2)}
.sheet .go a{flex:1;min-height:44px;display:grid;place-items:center;border-radius:12px;font-size:14px;font-weight:700;border:1px solid var(--line);color:var(--ink);text-align:center;padding:0 6px}
.sheet .go a.pri{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
/* Trailer takes its own width and leaves the rest of the bar to Walk to, whose label is the
   long one. */
.sheet .go a.yt{flex:none;padding:0 18px}
.sheet .made{color:var(--ink-2);font-size:12.5px;line-height:1.45;margin-top:5px}
.sheet .rate{color:var(--ink-2);font-size:12px;line-height:1.4;margin-top:6px}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:20px}
.sheet .plain{font-family:Newsreader,Georgia,serif;font-size:16.5px;line-height:1.55;padding:14px 18px 4px;margin:0;color:var(--ink)}
.sec{padding:14px 18px;border-top:1px solid var(--line-2)}
.sec h3{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 9px}
.spec{display:grid;grid-template-columns:82px 1fr;gap:8px 12px;margin:0;font-size:13.5px}
.spec dt{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.spec dd{margin:0;line-height:1.45}
.spec dd .tag{margin-left:5px;vertical-align:1px}

/* ---------- reading panes ---------- */
.doc{padding:18px 16px calc(30px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.doc h2{font-size:13px;font-family:"IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:26px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
.doc h2:first-child{margin-top:0;padding-top:0;border-top:none}
.doc .lede{font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.55;color:var(--ink-2);margin:0 0 16px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px}
.card h3{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:0 0 7px;line-height:1.2}
.card .say{font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.55;margin:0 0 9px;color:var(--ink)}
.card .tech{font-size:12.5px;line-height:1.5;color:var(--ink-2);margin:0}
.ruled{width:100%;border-collapse:collapse;font-size:13.5px}
.ruled td{padding:10px 0;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.45;color:var(--ink-2)}
.ruled td:first-child{font-weight:700;color:var(--ink);padding-right:14px;width:38%}
.srcs{font-size:12px;color:var(--ink-2);line-height:1.5}
.srcs p{margin:0 0 8px;padding-left:14px;text-indent:-14px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;margin-bottom:6px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left}
.pick:active{background:var(--tap)}
.pick .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pick .n{font-size:16px;font-weight:700;letter-spacing:-.015em;margin-top:5px;line-height:1.2}
.pick .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--lamp);margin-top:5px;font-weight:500}
.empty{padding:44px 22px;text-align:center;color:var(--ink-3)}
.empty b{display:block;font-size:17px;color:var(--ink-2);margin-bottom:5px;font-weight:700}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);padding:10px 16px 22px;line-height:1.6;border-top:1px solid var(--line-2);margin-top:8px}
.stamp b{color:var(--ink-2);font-weight:600}

/* THUMBS. Everything tappable clears 44px on a touch screen -- measured on a real 375px
   viewport, where the time chips were 38px tall and the rail buttons 38px. Scoped to
   pointer:coarse so no desktop layout moves, and placed below every rule it overrides
   because a media query adds no specificity. */
@media (pointer:coarse){
  .t{min-height:44px;min-width:66px;font-size:15px}
  .rail button{min-height:44px}
  .rail .day{min-height:46px;padding:6px 13px}
  .iconbtn{width:44px;height:44px}
  .tabs button{min-height:56px}
  
  /* Measured at 42x42 on a 390px viewport, which misses by two pixels in both directions.
     A short control and a narrow one fail a thumb the same way. */
  .mapctl button{width:44px;height:44px}
  /* Same rule, same reason: this went in at 38 and is the only control in the app that
     was under the line. */
  .mapfree{min-height:44px}
  .frow,.cin .hdr{min-height:52px}
  .badge{font-size:10.5px}
  /* .vgrp .vl, not .vl -- the base rule is two classes deep and a media query adds no
     specificity, so the bare selector lost and the format label stayed at 9.5px. */
  .vgrp .vl{font-size:11px}
  .count{font-size:11px}
  .sheet .go a{min-height:48px}
}

/* TABLET, and this is a rejection reason rather than a nicety. Apple runs every
   submission on an iPad whether or not you built for one, and "iPad UI broken" is on the
   short list of things they turn apps away for. Stretched to 1024 points this layout put
   the venue name at the far left with its walking distance pinned nine hundred pixels
   away on the right, and a row of sixty-pixel time chips floating in an ocean of empty
   ground. Nothing was broken; it just read as a phone screen someone had dragged wider.

   The fix is a reading column, not a tablet redesign -- none of these panes wants to be
   two panes, and a second column of showtimes would be worse than one. The chrome keeps
   its full-bleed background and centres its own contents with padding instead of a
   max-width, so the top bar and the tab bar still read as bars rather than as cards
   hovering in the middle of the screen.

   The map is deliberately exempt. It is a map; it should have the whole screen. */
@media (min-width:760px){
  :root{--col:720px}
  .top{padding-left:max(calc(env(safe-area-inset-left,0px) + 14px),calc((100% - var(--col))/2));
       padding-right:max(calc(env(safe-area-inset-right,0px) + 14px),calc((100% - var(--col))/2))}
  .rail{padding-left:max(14px,calc((100% - var(--col))/2));
        padding-right:max(14px,calc((100% - var(--col))/2))}
  .tabs{padding-left:max(0px,calc((100% - var(--col))/2));
        padding-right:max(0px,calc((100% - var(--col))/2))}

"Cinemex Insurgentes":["lux","A five-minute walk from Parque Mexico. Seven small rooms, all with the wider, softer Premium seats, and it is one of Cinemex's art-house venues, so you get subtitled indie and restored films alongside the blockbusters. Regular screens and sound, nothing giant. This is the everyday neighborhood cinema."],
"Cinemex Pabellon Cuauhtemoc":["std","The cheap, no-frills multiplex on the Roma Norte side of Av. Cuauhtemoc. Twelve rooms, four of them with the nicer Premium seats. Standard screens and sound. Go here for a quick weekday showing when the movie matters more than the room."],
"Cinemex Reforma Casa de Arte":["art","A four-room art-house tucked behind Reforma, all Premium seats, dedicated to independent and festival films. Small rooms, quiet crowd, subtitles. Good for the film you would otherwise stream."],
"Cinemex Reforma 222 Market":["big","The newest-feeling cinema near Roma: fully remodeled in March 2026 with laser projectors in every room and a food hall instead of a candy bar. Eleven Premium rooms; room 4 is the big-screen CinemeXtremo room with Dolby Atmos overhead sound. Expect to pay about double a regular ticket. Best pick for a bright, sharp picture within walking distance of Reforma."],
"Cinemex Centro Telmex":["std","Ten plain rooms on Av. Cuauhtemoc at Chapultepec, two with 3D. Nothing premium, nothing large. It exists for convenience and price."],
"Cinemex Parque Delta + Parque Delta Platino":["big","The best screens closest to Condesa and Roma, in the Parque Delta mall. Room 3 is a real IMAX with laser projection and IMAX's 12-channel sound, the nearest IMAX of any brand. Room 10 is the CinemeXtremo big screen with Dolby Atmos. Next door is a separate five-room Platino cinema with full recliners and waiters bringing food and cocktails to your seat. If someone visiting asks where to see a big movie, this is the answer."],
"Cinemas WTC":["lux","An independent cinema opened in 2023 by the people who founded Cinemex, on the third floor of the World Trade Center mall in Napoles. Fourteen rooms, five of them VIP with recliners. They advertise very large screens and strong sound with acoustic panels, but publish no numbers. Worth a visit to judge for yourself."],
"Cinemex Galerias (Plaza de las Estrellas)":["std","Fourteen rooms in the Plaza de las Estrellas mall on Circuito Interior. One Premium room, one 3D room, the rest standard. Cheap tickets. Convenient if you are already at the mall."],
"Cinemex Patriotismo Market + Patriotismo Platino":["lux","Two cinemas in one mall at Patriotismo and Viaducto. The Market side has eight Premium rooms and a food hall; the Platino side is a small four-room recliner cinema with waiter service, the cheapest Platino in the area. No giant screen, but a comfortable night out."],
"Cinemex Real":["std","Eight standard rooms inside what was the grand 1950 Cine Real near the Alameda. Among the cheapest tickets in the city. Historic shell, ordinary rooms."],
"Cinemex Portal Centro":["std","Nine standard rooms in a newer mall east of Centro. Nothing special; listed so nothing is missed."],
"Cinemex San Antonio":["std","Fourteen standard rooms in San Pedro de los Pinos. Room 1 is big enough to carry Disney's Infinity Vision label, which means a wide screen and at least 7.1 sound. Cheap."],
"Cinepolis Diana":["std","The Cinepolis on Reforma, in the shell of the 1961 Cine Diana. Eight ordinary rooms with non-reclining seats, one 3D room and one art-house room. No VIP, no IMAX. The land has been for sale for years, so do not expect upgrades. Handy location, dated rooms."],
"Cinepolis Forum Buenavista":["big","The nearest Cinepolis with the big formats: a large IMAX room (about the size of two tennis courts of screen) and a 4DX room with moving seats, wind and water. Sixteen rooms total, very busy, book ahead. Reachable by Metro and Metrobus at Buenavista."],
"Cinepolis VIP Miyana Polanco":["lux","An all-VIP Cinepolis in Polanco: seven recliner rooms with food and cocktails served to your seat, and one ScreenX room where the picture wraps onto the side walls in selected scenes. Pricey, comfortable, good for a date or for visitors."],
"Cinemex Universidad":["big","Twelve rooms in Plaza Universidad. Room 1 is a CinemeXtremo big screen with Dolby Atmos and is the cheapest large-format ticket in this list. Worth the taxi if you want the big room without paying IMAX prices."],
"Cinemex Antara Market + Antara Platino":["big","The showpiece cinema in Polanco. Its IMAX with laser is billed as the largest IMAX screen in Latin America, roughly 300 square meters, and it sits inside the Platino recliner wing with waiter service. There is also a CinemeXtremo room with Dolby Atmos and a Market food hall. The most expensive ticket in the area and the most impressive room."],
"Cinemex Felix Cuevas Platino":["lux","A small seven-room cinema in Del Valle that is entirely Platino: recliners, waiters, bar. Quiet and exclusive. No big screen."],
"Cinepolis Plaza Carso + VIP Plaza Carso":["lux","Two Cinepolis under one roof in Plaza Carso, next to the Soumaya museum: five standard rooms and four VIP recliner rooms. Free parking with your ticket. Solid but no large format."],
"Cinemex Manacar":["std","A thirteen-room cinema in the Torre Manacar tower on Insurgentes Sur, reopened in 2022. Every room has the wider Premium seats and it programs art-house films too. Regular screens."],
"Cinemex Galerias Insurgentes Market":["std","A Cinemex Market (food hall concept) in Galerias Insurgentes. Not researched in detail yet."],
"Cinepolis Universidad + VIP Universidad":["big","Outside the five-kilometer ring but home to the largest Cinepolis IMAX in the city, about 21 by 14 meters, plus 4DX and VIP."],
"Cinepolis Mitikah + VIP Mitikah":["lux","A huge new Cinepolis in the Mitikah tower complex: 23 rooms including VIP, ScreenX, 4DX and a kids' room with a playground. Outside the ring."],
"Cine Tonala":["art","The neighborhood art-house, in Roma Sur. One screen with a 4K projector and Dolby Atmos sound after a 2021 refit, plus a bar, a pizza kitchen and a bookstore. Indie and foreign films, restorations, festivals, and stand-up on other nights. The place to take a friend who likes cinema more than blockbusters."],
"Centro Cultural Bella Epoca, Cine Lido":["free","The old Cine Lido in Condesa, now a bookstore and cafe with a 150-seat screening room. The national film archive shows free classic Mexican films here on a loose schedule. Not a daily cinema, but it is the only screen inside Condesa proper."],

"Cinematografo del Chopo (Filmoteca UNAM)":["art","The university film archive's cinema at Museo del Chopo. One room of about 130 seats that can still run 35 mm film. Restorations, retrospectives and festival premieres, daily, very cheap."],

/* =====================================================================
   SALA NEARBY
   Two data sources, deliberately kept apart.

   SHOWS is live: 5,445 real sessions pulled from the endpoint cinemex.com
   itself calls, with real auditorium names, seat availability and checkout
   links. It is a SNAPSHOT with a timestamp on it, not a live feed -- a
   published page cannot fetch across origins, so the page says when it was
   read and links straight to the cinema's own page for the live version.

   V is curated: 42 venues with every claim tagged verified / likely /
   unknown. It knows which IMAX is laser, which rooms are Casa de Arte, what
   a ticket costs and where 35 mm survives. No ticketing app carries that,
   and it is the reason this is not just a worse Fandango.

   Nineteen cinemas appear in both and are shown merged. Thirteen have live
   times and no audit (they are outside the original 5 km study) and say so.
   The rest are audit-only -- the independents, the free cineclubs, the
   Filmoteca -- and no ticketing app lists them at all. Every count the page
   PRINTS is computed from the data rather than written into the prose, because
   a hardcoded "twenty-three" was rendering next to a list of nineteen.
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const HOME = { lat: 19.4117, lng: -99.1690, name: "Parque Mexico" };
let origin = { ...HOME };
let liveLoc = false;

/* TWO CHAINS NOW, so these are functions rather than a template repeated at five call
   sites. Cinemex sessions carry a bare checkout id; Cineteca's are written
   "cineteca:<sede>:<session>" because its ticketing lives on its own host and needs both
   numbers. Anything unrecognised falls back to Cinemex, which is what every row was
   until 2026-09-08. Written by add-chain-links.py -- edit that, not this. */
function ticketUrl(s) {
  const id = s[5];
  if (!id) return "#";
  const ct = String(id).match(/^cineteca:(\d+):(\d+)$/);
  if (ct) return `https://rbvfcn.cinetecanacional.net/Ticketing/visSelectTickets.aspx?cinemacode=${ct[1]}&txtSessionId=${ct[2]}&visLang=1`;
  return `https://cinemex.com/checkout/${encodeURIComponent(id)}`;
}
function cinemaUrl(c) {
  const ct = String(c.id).match(/^cineteca-(\d+)$/);
  if (ct) return `https://www.cinetecanacional.net/cartelera.php?cinemaId=${ct[1]}`;
  return `https://cinemex.com/cinema/${encodeURIComponent(c.id)}`;
}
/* The operator for a cinema with no curated venue behind it. A default that is right for
   every row is not a default, it is an assumption waiting for the second case. */
function chainOf(c) {
  if (/^cineteca-/.test(String(c.id))) return "Cineteca Nacional";
  return "Cinemex";
}

/* ---------- posters, including the ones that do not exist ----------
   Cinemex ships artwork for its own catalogue and Cineteca ships none, so a poster is a
   thing that may or may not be there and the layout has to hold either way. One helper
   for every place a poster appears, so the missing case cannot be handled well in one
   place and forgotten in another -- which is what "visibility:hidden" was doing before:
   a correctly-sized empty rectangle. */
const STOPWORD = /^(la|el|los|las|un|una|unos|unas|de|del|y|o|en|con|por|para|al|a|the|of|and|to|in|on)$/i;
function initials(name) {
  const words = String(name || "").replace(/[^\p{L}\p{N} ]/gu, " ").split(/\s+/).filter(Boolean);
  const big = words.filter(w => w.length > 1 && !STOPWORD.test(w));
  const pick = big.length ? big : words;
  // One significant word gets its first two letters rather than a lone capital: "La
  // negociacion" reading as a single "N" looks like a rendering fault rather than a choice.
  const ini = pick.length > 1 ? pick.slice(0, 2).map(w => w[0]).join("")
            : (pick[0] || "?").slice(0, 2);
  return ini.toUpperCase();
}
/* The tint is a hash of the id, not a random colour, so a film keeps the same one in the
   showtimes list, the films index and its own sheet. */
function hueOf(fid) {
  const s = String(fid);
  let h = 7;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}
/* Artwork exists for Cinemex's catalogue and for nothing else. Cineteca's film ids are
   "ct-HO00009798" against Cinemex's plain numbers, so asking for a file we know is not
   there is a request that can be skipped rather than an error to recover from -- 33 films
   on the page, and without this the console fills with 404s on every single launch. Any
   Cinemex film whose poster is genuinely missing still falls back through onerror. */
function hasArtwork(fid) { return /^\d+$/.test(String(fid)); }

/* Search folds accents both ways, so "senoritas" finds "Señoritas" and "Odisea" finds it
   back. Half these titles carry a tilde or an accent and nobody types them on a phone.
   The original title is searched too -- he is as likely to think "The Odyssey". */
function fold(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}
/** Four fields, in the order a person would think of them: the title he saw on a poster,
 *  the original title (which is how an English speaker knows a film released here under a
 *  Spanish name), the director, and the genre.
 *
 *  The genre is in the list because the payload is in Spanish and the chips are not: there
 *  are five horror films on this board and "terror" was the obvious thing to type. The
 *  director is in it because "nolan" returned nothing while La Odisea played at
 *  twenty-five cinemas.
 *
 *  Cinemex truncates some director strings mid-word -- one of them ends "Direccion 1990:
 *  Benjamin " -- so a surname search can still miss. That is a hole in their data and it
 *  is left as a hole rather than filled in with a name nobody read. */
function matchesQuery(f) {
  if (!S.q) return true;
  if (!f) return false;
  return fold(f.n).includes(S.q) || fold(f.o).includes(S.q) ||
         fold(f.dir).includes(S.q) || fold((f.g || []).join(" ")).includes(S.q);
}
function posterCard(fid, name, cls, tappable) {
  const t = tappable ? "button" : "span";
  const attrs = tappable
    ? `data-film="${esc(fid)}" aria-label="${esc(name)}"`
    : 'aria-hidden="true"';
  const img = hasArtwork(fid)
    ? `<img src="posters/${esc(fid)}.jpg" alt="" loading="lazy" onerror="this.remove()">`
    : "";
  return `<${t} class="pw ${cls}" style="--ph:${hueOf(fid)}" data-ini="${esc(initials(name))}" ${attrs}
    >${img}</${t}>`;
}

function km(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dp = (b.lat - a.lat) * r, dl = (b.lng - a.lng) * r;
  const h = Math.sin(dp / 2) ** 2 +
    Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const walkMin = d => Math.max(1, Math.round(d / 0.075));   // 4.5 km/h
/* WHERE A WALK STOPS BEING A WALK. Every row says "min walk" up to here and "min drive"
   past it, leave-by uses the same travel time, and the Walkable chip means exactly the
   rows that say walk. Nobody measured how far he will go on foot: this is the line the
   rows have always drawn, kept in one place so the three cannot disagree. Forty minutes
   at 4.5 km/h is about three kilometres straight-line. */
const WALK_MAX = 40;
function walkable(d) { return walkMin(d) <= WALK_MAX; }
/** Minutes to get there, by whichever means far() is about to name. One function, because
 *  a header that says "19 min walk" and a leave-by computed from a drive time would be two
 *  numbers contradicting each other on the same row. */
function travelMin(d) {
  const w = walkMin(d);
  return walkable(d) ? w : Math.round(d / 0.35);
}
function far(d) {
  const w = walkMin(d);
  return { d: d < 1 ? Math.round(d * 1000) + " m" : d.toFixed(1) + " km",
           w: walkable(d) ? w + " min walk" : Math.round(d / 0.35) + " min drive" };
}

/* WHEN TO LEAVE, against the BILLED time and nothing else.
   There is no ad-reel allowance in this subtraction on purpose. The reel is real -- a
   Cinemex feature typically starts fifteen to twenty minutes after the time on the ticket
   -- but nobody here has measured it, and an allowance that is too generous sends him out
   of the door late. Against the billed time the worst this can do is make him early.
   Returns null where the question does not apply: another day, or a showing already gone. */
function leaveBy(startMins, distKm, dayIso) {
  if (!isToday(dayIso)) return null;
  if (startMins < nowMins()) return null;          // it has already started
  return startMins - travelMin(distKm);            // may be in the past: that means leave now
}

/* ---------- format vocabulary ---------- */
const FT = {
  imax: ["IMAX", "imax"], dolby_atmos: ["Atmos", "atmos"], platinum: ["Platino", "plat"],
  premium: ["Premium", ""], "infinity-vision": ["Infinity", ""], v3d: ["3D", ""],
  lang_sub: ["Subtitled", "sub"], lang_es: ["Dubbed", "dub"], traditional: ["Standard", ""],
  // No class, so it takes the plain muted badge. Cineteca does not always say whether a
  // screening is subtitled or dubbed, and this is the app saying so out loud rather than
  // leaving a row with no language on it and letting the filter it appears under imply
  // one.
  lang_unknown: ["Language unknown", ""],
};
// `cap` limits how many badges are drawn and adds a count for the rest. A film row was
// carrying five -- PREMIUM, DUBBED, SUBTITLED, STANDARD, PLATINO -- which wrapped onto a
// second line and doubled the height of every row in the list. The sheet, where there is
// room and the detail is the point, passes no cap and still shows all of them.
/* THE FORMAT LINE SAID EVERYTHING TWICE. "PREMIUM  DUBBED  PREMIUM ESPAÑOL" -- two badges
   and then Cinemex's own label repeating both of them in Spanish, on every version group
   of every film. The badges are built from the same `type` array the label is written
   from, so whenever there is at least one badge the words behind it are already on screen.
   Cineteca sends no types at all, and there the label is the only thing there is. */
function versionLabel(fmt) {
  const badges = fmtBadges(fmt.t);
  if (badges) return badges;
  // Cineteca files some screenings under the label "CINETECA", which is the name of the
  // cinema you are already reading. Nothing is better than a line that says where you are.
  if (/^cineteca$/i.test(String(fmt.l || "").trim())) return "";
  return `<span>${esc(fmt.l)}</span>`;
}
function fmtBadges(types, cap) {
  const all = (types || []).filter(t => FT[t]);
  const show = cap ? all.slice(0, cap) : all;
  const rest = all.length - show.length;
  return show.map(t => {
    const [label, cls] = FT[t];
    return `<span class="badge ${cls}">${esc(label)}</span>`;
  }).join(" ") + (rest > 0 ? `<span class="more">+${rest}</span>` : "");
}

/* ---------- state ---------- */
/* THE FILTERS STACK. This was one string, so the chips were mutually exclusive and
   "subtitled IMAX" could not be asked for at all -- 126 such showings are in the payload.
   It is a Set now, empty meaning everything, and "Everything" is the button that empties
   it rather than a sixth member.

   Insertion order matters and Set keeps it: when a day change makes the whole combination
   impossible, the chip dropped is the one added last. */
const S = {
  day: 0,
  filters: new Set(),   // any of: now | sub | imax | atmos | plat
  tab: "films",
  q: "",                // the search box, shared by both lists
  starred: new Set(),   // film ids he has starred, as strings; saved as sala.starred
};
try { const t = localStorage.getItem("sala.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

/* SUBTITLED IS A STANDING PREFERENCE, NOT A TAP. Across the payload it is 7,750 dubbed
   against 3,335 subtitled, so the default in this city is against him and he was
   re-stating the same thing on every launch. The set is saved beside sala.theme and
   restored here.

   "Starting soon" is deliberately dropped on the way back in. It is a mood, not a
   preference, and restoring it means opening the app at 09:00 to a page that says nothing
   is on.

   Every read and write is wrapped, and an empty or unreadable value has to render the
   page correctly rather than throw: a private window, cleared site data and the
   thumbnail capture all hand back nothing, and one of them throws on the accessor
   itself. */
const FILTER_KEYS = ["now", "sub", "imax", "atmos", "plat"];
function loadFilters() {
  try {
    const raw = localStorage.getItem("sala.filters");
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!Array.isArray(saved)) return;
    saved.filter(k => FILTER_KEYS.includes(k) && k !== "now").forEach(k => S.filters.add(k));
  } catch (e) { /* no saved preference, which is the ordinary first-launch case */ }
}
function saveFilters() {
  try {
    localStorage.setItem("sala.filters", JSON.stringify([...S.filters].filter(k => k !== "now" && k !== "star" && k !== "walk")));
  } catch (e) { /* storage refused; the filters still work for this session */ }
}
loadFilters();

/* STARRED FILMS, his own short list, saved beside sala.filters under the same rule.
   Ids are kept as strings: Cinemex ids are numbers and Cineteca's start with "ct-", and
   the payload hands out both. A starred film that is not in this week's listing stays
   starred, because it may be back in the next pull. */
const STAR_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.3l2.6 5.5 6 .8-4.4 4.2 1.1 6L12 17l-5.3 2.8 1.1-6-4.4-4.2 6-.8z"/></svg>`;
const STAR_MARK = `<svg class="stm" viewBox="0 0 24 24" role="img" aria-label="Starred"><path d="M12 3.3l2.6 5.5 6 .8-4.4 4.2 1.1 6L12 17l-5.3 2.8 1.1-6-4.4-4.2 6-.8z"/></svg>`;
function loadStarred() {
  try {
    const raw = localStorage.getItem("sala.starred");
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!Array.isArray(saved)) return;
    saved.forEach(id => { if (typeof id === "string" || typeof id === "number") S.starred.add(String(id)); });
  } catch (e) { /* nothing starred yet, or storage refused */ }
}
function saveStarred() {
  try { localStorage.setItem("sala.starred", JSON.stringify([...S.starred])); }
  catch (e) { /* storage refused; the stars still work for this session */ }

function isStarred(fid) { return fid != null && S.starred.has(String(fid)); }

  const on = isStarred(fid);
  return `<button class="starbtn" data-star="${esc(String(fid))}" aria-pressed="${on}">${STAR_SVG}<span>${on ? "Starred" : "Star this film"}</span></button>`;

loadStarred();

/* the day the snapshot was taken, so "today" means the right row */
const DAYS = SHOWS.days;
const DOW_ES = ["dom", "lun", "mar", "mie", "jue", "vie", "sab"];
function dayLabel(iso, i) {
  const d = new Date(iso + "T12:00:00");
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const diff = Math.round((d - today) / 86400000);
  const es = typeof langPref === "function" && langPref() === "es";
  const dow = es ? DOW_ES[d.getDay()] : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getDay()];
  if (diff === 0) return { b: es ? "Hoy" : "Today", e: dow + " " + d.getDate() };
  if (diff === 1) return { b: es ? "Mañana" : "Tomorrow", e: dow + " " + d.getDate() };
  return { b: dow, e: d.getDate() + "/" + (d.getMonth() + 1) };
}
function nowMins() { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }
function isToday(iso) {
  const d = new Date(iso + "T12:00:00"), t = new Date(); t.setHours(12, 0, 0, 0);
  return +d === +t;
}
function isPast(iso) {
  const d = new Date(iso + "T12:00:00"), t = new Date(); t.setHours(12, 0, 0, 0);
  return +d < +t;
}
/** Has this whole snapshot run out? True only when there is not one day left in it that
 *  has not already been and gone -- which is the case liveDayIdxs falls back on, and the
 *  one case where everything the app draws is a description of the past. */
function listingIsDead() {
  return DAYS.length > 0 && DAYS.every(isPast);
}
/** The sentence, or nothing at all. Built here rather than at each call site so the two
 *  tabs cannot drift into saying it differently. */
function staleLine() {
  if (!listingIsDead()) return "";
  return `<div class="stale"><b>These showtimes have run out.</b>
    The last day this page holds is ${esc(dateAbs(DAYS.length - 1))}, and everything on it
    has already played. Tapping a time still opens the cinema's own page, which is live.</div>`;
}

/** The day indices worth putting on the rail: every day the payload has a session on,
 *  minus the ones that have already been and gone.
 *
 *  The snapshot is baked into the page and the page is opened on later days than the one
 *  it was built on -- two days later, the morning this was written. A chip for a day that
 *  is over is not a stale listing, it is a dead one: nothing on it can be bought, and the
 *  row-level dimming that marks a time as past only runs on today, so those chips look
 *  exactly like live ones.
 *
 *  When EVERY day is in the past the filter would empty the rail, so it returns all of
 *  them instead. A month-old listing that admits its dates beats a blank screen. */
function liveDayIdxs() {
  const have = new Set();
  SHOWS.cin.forEach(c => c.s.forEach(s => have.add(s[2])));
  const all = [...have].sort((a, b) => a - b);
  const live = all.filter(i => !isPast(DAYS[i]));
  return live.length ? live : all;
}
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");

/* ---------- filters ---------- */
/* One chip's question, unchanged from when there was only ever one of them. */
function passesOne(key, fmtIdx, mins, dayIso, fid, cin) {
  const t = SHOWS.fmts[fmtIdx].t || [];
  switch (key) {
    case "now": return isToday(dayIso) && mins >= nowMins() - 10 && mins <= nowMins() + 240;
    // SUBTITLED MEANS NOT DUBBED, and the difference is 155 showings across 36 films.
    // Cineteca marks the language in its own title and often does not bother, so a
    // strict `lang_sub` test threw away 167 of its 185 screenings the moment subtitled
    // became a saved preference -- the arthouse programming, hidden by the setting he
    // turned on to find it. Including the unknowns is the lesser error by a distance,
    // and each one carries a Language unknown badge in the list so the row is not
    // claiming to be subtitled.
    //
    // Scoped by the data rather than by intent: this reads lang_unknown, which is only
    // ever put on Cineteca's own unlabelled format, and not "has no language", which
    // would leak dubbed showings in the day a Cinemex format arrives untagged. All
    // 11,067 Cinemex showings carry a language today, so nothing of theirs moves.
    case "sub": return t.includes("lang_sub") || t.includes("lang_unknown");
    case "imax": return t.includes("imax");
    case "atmos": return t.includes("dolby_atmos");
    case "plat": return t.includes("platinum");
    // The one chip that asks about the FILM rather than the format or the time, which is
    // why every caller now hands the id through. No id means no answer, never a pass.
    case "star": return isStarred(fid);
    // A question about the CINEMA, measured from whichever origin is live, so it moves
    // with the location button. No cinema means no answer, never a pass.
    case "walk": return cin != null && walkable(km(origin, { lat: cin.lat, lng: cin.lng }));
    default: return true;
  }
}
/* Every active chip, and optionally one more.
   `extra` is what makes the counts honest: a chip has to be counted against the set it
   would JOIN, not on its own, or the number on the chip contradicts the list the moment
   two are lit. "all" is the empty set, so it counts everything. */
function passes(fmtIdx, mins, dayIso, extra, fid, cin) {
  if (extra === "all") return true;
  for (const k of S.filters) if (!passesOne(k, fmtIdx, mins, dayIso, fid, cin)) return false;
  if (extra && !S.filters.has(extra) && !passesOne(extra, fmtIdx, mins, dayIso, fid, cin)) return false;
  return true;
}

/* ---------- how long a film's run is, and whether we can see the end of it ----------

   A COMPLETE PROGRAMMING WEEK IS THE UNIT, because a count of showings is not evidence
   of rarity. Cinema weeks here start on Thursday, which is why a Tuesday pull sees less
   than a Thursday one, so a complete week is seven consecutive published days beginning
   on a Thursday. `weekAfter` is the latest such week each cinema has published; a film's
   run can only be called finished when every cinema showing it has published a whole
   week that does not contain it.

   Cineteca publishes two days at a time -- 2026-09-09 and 2026-09-10 on this payload,
   against Cinemex's thirty -- so it has never published a complete week and nothing there
   is ever called a last day. That is the whole reason this is a week test and not a
   count: twenty-two of the twenty-three films with three or fewer showings are Cineteca
   titles, and they are rare in the data because the listing stops, not because the film
   does. */
const DOW_OF = i => new Date(DAYS[i] + "T12:00:00").getDay();   // 4 = Thursday
const WEEK_AFTER = new Map();     // cinema id -> latest complete Thu..Wed week it publishes
for (const c of SHOWS.cin) {
  const have = new Set(c.s.map(x => x[2]));
  let best = -1;
  for (const start of have) {
    if (DOW_OF(start) !== 4) continue;
    let whole = true;
    for (let k = 1; k < 7; k++) if (!have.has(start + k)) { whole = false; break; }
    // The seven days have to be seven CONSECUTIVE DATES, and a day index is only the
    // same thing as a date while the payload has no gaps in it. It does: the tail of the
    // advance window jumps 2026-10-04 to 2026-10-07. So the run of indices is checked
    // against the calendar rather than assumed to be one.
    if (whole && (new Date(DAYS[start + 6] + "T12:00:00") - new Date(DAYS[start] + "T12:00:00"))
        !== 6 * 86400000) whole = false;
    if (whole && start > best) best = start;
  }
  WEEK_AFTER.set(String(c.id), best);
}

/** Every film that survives the filters and the search, with the dates it plays on.
 *  ONE PASS over the payload rather than one per film, and the dates are the FILTERED
 *  ones on purpose: with Subtitled on, "1 date" means one subtitled date, which is the
 *  question he is actually asking. Whether a week has been PUBLISHED is a fact about the
 *  listing and is never filtered. */
function filmRuns() {
  const out = new Map();
  for (const c of SHOWS.cin) {
    const wk = WEEK_AFTER.get(String(c.id));
    for (const x of c.s) {
      if (!passes(x[1], x[3], DAYS[x[2]], null, x[0], c)) continue;
      if (!matchesQuery(SHOWS.films[x[0]])) continue;
      const k = String(x[0]);
      let r = out.get(k);
      if (!r) { r = { fid: k, days: new Set(), cin: new Set(), n: 0,
                      first: Infinity, last: -1, week: Infinity }; out.set(k, r); }
      r.days.add(x[2]); r.cin.add(c.id); r.n++;
      if (x[2] < r.first) r.first = x[2];
      if (x[2] > r.last) r.last = x[2];
      if (wk < r.week) r.week = wk;        // the weakest listing decides, never the best
    }
  }
  for (const r of out.values()) r.closed = r.week > r.last;
  return out;
}

/** "Thu 24 Sep", always, and "Tomorrow" only where a row is naming a day to go on. The
 *  day rail already says Today and Tomorrow, so a row reads the same way as the rail --
 *  but a sentence about how far a listing REACHES needs the date, because "Cineteca goes
 *  out to Tomorrow" is a sentence that stops being true overnight. */
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
             "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MON_ES = ["ene", "feb", "mar", "abr", "may", "jun",
                "jul", "ago", "sep", "oct", "nov", "dic"];
function dateAbs(i) {
  const d = new Date(DAYS[i] + "T12:00:00");
  const es = typeof langPref === "function" && langPref() === "es";
  const dow = es ? DOW_ES[d.getDay()] : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getDay()];
  return `${dow} ${d.getDate()} ${es ? MON_ES[d.getMonth()] : MON[d.getMonth()]}`;
}
function dateWords(i) {
  const L = dayLabel(DAYS[i], i);
  return L.b === "Today" || L.b === "Tomorrow" || L.b === "Hoy" || L.b === "Mañana" ? L.b : dateAbs(i);
}

/* ---------- distance-aware cinema list ---------- */
function cinemasSorted() {
  return SHOWS.cin.map(c => ({ ...c, dist: km(origin, { lat: c.lat, lng: c.lng }) }))
    .sort((a, b) => a.dist - b.dist);
}

/* ===================== SHOWTIMES ===================== */
function renderDates() {
  // EVERY DAY THAT HAS A SHOWING, not the first fortnight. This used to be
  // `.slice(0, 14)`, and the payload carries whatever Cinemex has on sale -- 31 days on
  // the 8 September pull -- so 1,045 showings were being shipped in the page and could
  // not be reached from the interface at all. That includes the things most worth
  // knowing about in advance: the Avengers Endgame bonus week, Linkin Park in October,
  // and the Queen and Lalisa IMAX dates at Parque Delta.
  //
  // liveDayIdxs reads the sessions themselves, so every chip on the rail is a day with
  // something on it that has not already happened. The rail scrolls; that is what it is
  // for.
  const idxs = liveDayIdxs();
  $("dates").innerHTML = idxs.map(i => {
    const L = dayLabel(DAYS[i], i);
    return `<button class="day" data-day="${i}" aria-pressed="${S.day === i}">
      <b>${esc(L.b)}</b><em>${esc(L.e)}</em></button>`;
  }).join("");
}
const FILTER_OPTS = [["all", "Everything"], ["now", "Starting soon"], ["star", "Starred"], ["walk", "Walkable"], ["sub", "Subtitled"],
                     ["imax", "IMAX"], ["atmos", "Atmos"], ["plat", "Platino"]];

/* The count line has to compose now that chips stack. "126 subtitled IMAX showings" is
   the sentence, so the language adjective comes first and the room second, and "starting
   soon" is a clause rather than an adjective because "starting soon subtitled showings"
   is not English. */
const FILTER_WORD = { star: "starred", sub: "subtitled", imax: "IMAX", atmos: "Dolby Atmos", plat: "Platino" };
const WORD_ORDER = ["star", "sub", "imax", "atmos", "plat"];
/* `unlisted` is how many of the results are Cineteca screenings that do not say which
   language they are. When there are any, the word has to be "subtitled or unlisted": the
   Subtitled chip now includes them, and a line reading "437 subtitled showings" over a
   set where 79 of them are unknown is the one kind of small lie this app is built not to
   tell. */
function filterWords(unlisted) {
  return WORD_ORDER.filter(k => S.filters.has(k))
    .map(k => (k === "sub" && unlisted ? "subtitled or unlisted" : FILTER_WORD[k]))
    .join(" ");
}
function countLabel(n, unlisted) {
  const w = filterWords(unlisted);
  const noun = n === 1 ? "showing" : "showings";
  const head = (w ? w + " " + noun : noun) + (S.filters.has("walk") ? " within walking distance" : "");
  return S.filters.has("now") ? head + " starting in the next four hours" : head;
}
/** Where "near" is measured from, said as what it is: the park until the location button
 *  is on, the phone after. With Walkable on it says walking distance, as the Showtimes
 *  line does, so the two tabs never make different claims about one filter. */
function whereFrom() {
  const who = liveLoc ? "you" : origin.name;
  return S.filters.has("walk") ? "within walking distance of " + who : "near " + who;
}

/** How many showings each chip would leave on the selected day if it were tapped ON --
 *  so, the active set PLUS that chip -- along with `active`, what the set finds as it
 *  stands. One pass over the day rather than one pass per chip. */
function filterCounts() {
  const dayIso = DAYS[S.day], out = { active: 0 };
  for (const [k] of FILTER_OPTS) out[k] = 0;
  for (const c of SHOWS.cin) {
    for (const s of c.s) {
      if (s[2] !== S.day) continue;
      // The search narrows these too, or a chip stays lit for showings the search has
      // already taken off the list and tapping it lands on an empty page.
      if (!matchesQuery(SHOWS.films[s[0]])) continue;
      if (passes(s[1], s[3], dayIso, null, s[0], c)) out.active++;
      for (const [k] of FILTER_OPTS) if (passes(s[1], s[3], dayIso, k, s[0], c)) out[k]++;
    }
  }
  return out;
}

function renderFilters() {
  // A CHIP THAT CANNOT FIND ANYTHING IS NOW DISABLED RATHER THAN OFFERED.
  //
  // Sweeping every day against every filter, 63 of the 186 combinations rendered
  // "Nothing matches", and 30 of those were a single chip: "Starting soon" means the next
  // four hours, so it can never match on a day that is not today -- and it was offered on
  // all thirty future days anyway. The rest are real absences: no IMAX showing on a given
  // Tuesday, no Platino on a sparse advance-sale date.
  //
  // Offering a control that is guaranteed to find nothing is a dead end, which is one of
  // the things App Review turns apps away for, and it is bad on its own terms: a greyed
  // chip tells him at a glance what is actually on that day, which is information the
  // empty screen was making him hunt for.
  // If the day changed out from under the combination -- he was on subtitled IMAX and
  // tapped a day with no IMAX -- drop chips rather than showing him an empty list under
  // chips that are all still lit. Last one added goes first, because that is the one he
  // is least attached to, and because Set keeps insertion order so "last" is a real
  // thing and not an arbitrary pick.
  while (S.filters.size && !filterCounts().active) {
    const last = [...S.filters].pop();
    S.filters.delete(last);
  }
  const counts = filterCounts();
  const draw = FILTER_OPTS.map(([k, l]) => {
