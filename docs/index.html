    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});

    .then(r => (r.ok ? r.text() : Promise.reject(new Error("HTTP " + r.status))))
    .then(async html => {
      const at = stampOf(html);
      if (!(at && at > SHOWS.at)) return say("Up to date · read " + read);

  });
})();

/* WHERE DISTANCES START, TYPED. Ask 5 on 12 September: "I wanna type in there in a unique
   good way that's useful to a user". The places are OpenStreetMap's colonias, stations and
   landmarks, baked into places.json by build-places.py, so the picker works with no signal
   and nothing he types leaves the phone. Every suggestion answers the question the picker
   is for: how many cinemas are a walk from there, and which is nearest. */
let PLACES = null, LAST_HITS = [];
const PLACE_KIND = { col: "Neighbourhood", q: "Area", d: "District", m: "Metro", mb: "Metrobús",
                     tl: "Tren Ligero", cb: "Cablebús", sub: "Suburbano", lm: "Landmark" };
function loadPlaces() {
  if (PLACES) return Promise.resolve(PLACES);
  return fetch("places.json").then(r => (r.ok ? r.json() : null)).then(j => {
    PLACES = j && Array.isArray(j.p)
      ? j.p.map(r => ({ n: r[0], k: r[1], lat: r[2], lng: r[3], cp: r[4] || "", f: fold([r[0], ...r.slice(5)].join(" ")) }))
      : [];
    return PLACES;
  }).catch(() => (PLACES = []));
}
/** Best first: the name starts with it, then a word in it does, then it appears anywhere. A
 *  postcode matches its colonia. places.json is nearest-first, and the sort is stable, so
 *  within a rank the nearer place wins. */
function placeMatches(q) {
  const raw = String(q || "").trim(), f = fold(raw);
  if (!f || !PLACES) return [];
  const cp = /^\d{3,5}$/.test(raw);
  const ranked = [];
  for (const p of PLACES) {
    const r = cp ? (p.cp.startsWith(raw) ? 0 : -1)
      : p.f.startsWith(f) ? 0 : p.f.includes(" " + f) ? 1 : p.f.includes(f) ? 2 : -1;
    if (r >= 0) ranked.push([r, p]);
  }
  return ranked.sort((a, b) => a[0] - b[0]).slice(0, 8).map(x => x[1]);
}
function reachFrom(pt) {
  let n = 0, near = null, nd = Infinity;
  for (const c of SHOWS.cin) {
    const d = km(pt, { lat: c.lat, lng: c.lng });
    if (walkable(d)) n++;
    if (d < nd) { nd = d; near = c; }
  }
  return { n, near, nd };
}
function reachLine(pt) {
  const r = reachFrom(pt);
  const lead = r.n ? `${r.n} ${r.n === 1 ? "cinema" : "cinemas"} within a walk` : "No cinema within a walk";
  return r.near ? `${lead} · nearest ${r.near.n}, ${far(r.nd).w}` : lead;
}
function savedPlaces() {
  try {
    const a = JSON.parse(localStorage.getItem("sala.places") || "[]");
    return Array.isArray(a) ? a.filter(x => x && typeof x.l === "string" && typeof x.n === "string"
      && Number.isFinite(x.lat) && Number.isFinite(x.lng)) : [];
  } catch (e) { return []; }
}
function writeSaved(list) {
  try { localStorage.setItem("sala.places", JSON.stringify(list.slice(0, 12))); } catch (e) { /* this launch only */ }
}
/** The chosen place, or the park. A saved value that is not a place near this city -- junk,
 *  or 0,0 -- is the park, never a distance measured from the Gulf of Guinea. */
function savedOrigin() {
  try {
    const o = JSON.parse(localStorage.getItem("sala.origin") || "null");
    if (o && typeof o.n === "string" && Number.isFinite(o.lat) && Number.isFinite(o.lng)
        && km(HOME, { lat: o.lat, lng: o.lng }) < 40) return { lat: o.lat, lng: o.lng, name: o.n };
  } catch (e) { /* the park */ }
  return { ...HOME };
}
function setOrigin(p) {
  if (liveLoc) { liveLoc = false; $("locbtn").setAttribute("aria-pressed", "false"); }
  origin = p ? { lat: p.lat, lng: p.lng, name: p.n } : { ...HOME };
  try {
    if (p) localStorage.setItem("sala.origin", JSON.stringify({ n: p.n, lat: p.lat, lng: p.lng }));
    else localStorage.removeItem("sala.origin");
  } catch (e) { /* this launch only */ }
  $("fromk").textContent = "Distances from"; $("fromn").textContent = origin.name;
  renderFilters(); renderShows(); if (S.tab === "films") renderFilms();
  window.dispatchEvent(new Event("sala:origin"));
}
function placeSheet() {
  const head = `<div><h2>Distances from</h2>
      <div class="pksrch"><input id="pkq" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
        placeholder="Neighbourhood, Metro, postcode" aria-label="Type a neighbourhood, station, landmark or postcode"></div></div>`;
  openSheet(head, "", `<div id="pkbody"></div>`, "var(--beam)");
  renderPicker("");
  loadPlaces().then(() => renderPicker($("pkq") ? $("pkq").value : ""));
}
function renderPicker(q) {
  const box = $("pkbody");
  if (!box) return;
  const row = (attrs, name, kind, line, on) => `<button class="pkrow${on ? " on" : ""}" ${attrs}>
      <span class="pkn">${esc(name)}${kind ? `<em>${esc(kind)}</em>` : ""}</span>
      <span class="pkl">${esc(line)}</span></button>`;
  const atHome = !liveLoc && origin.lat === HOME.lat && origin.lng === HOME.lng;
  let html = "";
  if (!String(q).trim()) {
    const saved = savedPlaces();
    html += row('data-pick="here"', "Where I am", "", liveLoc ? "On now" : "Uses the phone's location", liveLoc)
      + row('data-pick="home"', HOME.name, "", reachLine(HOME), atHome);
    if (!atHome && !liveLoc && !saved.some(x => x.lat === origin.lat && x.lng === origin.lng))
      html += row('data-pick="current"', origin.name, "Now", reachLine(origin), true)
        + `<div class="pksave"><input id="pklabel" maxlength="24" autocomplete="off"
            placeholder="Name ${esc(origin.name)}, like Home" aria-label="A name for ${esc(origin.name)}">
            <button data-pick="save">Save</button></div>`;
    if (saved.length) html += `<div class="sec"><h3>Saved</h3></div>` + saved.map((x, i) =>
      `<div class="pksaved">${row(`data-pick="saved" data-i="${i}"`, x.l, x.n !== x.l ? x.n : "", reachLine(x),
        !liveLoc && origin.lat === x.lat && origin.lng === x.lng)}<button class="pkx" data-forget="${i}"
        aria-label="Forget ${esc(x.l)}">Forget</button></div>`).join("");
    html += `<p class="note pkhint">Type a neighbourhood, a Metro or Metrobús station, a landmark or a postcode.
      Every distance, walking time and the Walkable chip then start from there.</p>`;
  } else if (PLACES === null) {
    html = `<p class="note pkhint">Loading places</p>`;
  } else {
    LAST_HITS = placeMatches(q);
    html = LAST_HITS.length
      ? LAST_HITS.map((p, i) => row(`data-pick="place" data-i="${i}"`, p.n,
          PLACE_KIND[p.k] + (p.cp ? " · CP " + p.cp : ""), reachLine(p))).join("")
      : `<p class="note pkhint">Nothing called that within 15 km. Try a colonia, a station or a five-digit postcode.</p>`;
  }
  box.innerHTML = html + `<p class="note pkhint pksrc">Places from OpenStreetMap contributors, ODbL.</p>`;
}
document.addEventListener("click", e => {
  if (e.target.closest("#fromopen")) return placeSheet();
  const pk = e.target.closest("[data-pick]");
  if (pk) {
    const kind = pk.dataset.pick;
    if (kind === "here") { closeSheet(); if (!liveLoc) $("locbtn").click(); return; }
    if (kind === "home") { closeSheet(); return setOrigin(null); }
    if (kind === "current") return closeSheet();
    if (kind === "place") { const p = LAST_HITS[+pk.dataset.i]; if (p) { closeSheet(); setOrigin(p); } return; }
    if (kind === "saved") {
      const x = savedPlaces()[+pk.dataset.i];
      if (x) { closeSheet(); setOrigin({ n: x.n, lat: x.lat, lng: x.lng }); }
      return;
    }
    if (kind === "save") {
      const label = ((($("pklabel") || {}).value) || "").trim().slice(0, 24) || origin.name;
      const list = savedPlaces().filter(x => !(x.lat === origin.lat && x.lng === origin.lng));
      list.unshift({ l: label, n: origin.name, lat: origin.lat, lng: origin.lng });
      writeSaved(list);
      return renderPicker("");
    }
  }
  const fg = e.target.closest("[data-forget]");
  if (fg) { const list = savedPlaces(); list.splice(+fg.dataset.forget, 1); writeSaved(list); renderPicker(""); }
});
document.addEventListener("input", e => { if (e.target && e.target.id === "pkq") renderPicker(e.target.value); });

$("locbtn").addEventListener("click", () => {
  if (liveLoc) {
    liveLoc = false; origin = savedOrigin();
    $("locbtn").setAttribute("aria-pressed", "false");
    $("fromk").textContent = "Distances from"; $("fromn").textContent = origin.name;
    renderFilters(); renderShows(); if (S.tab === "films") renderFilms();
    window.dispatchEvent(new Event("sala:origin"));
    return;
  }
  if (!navigator.geolocation) { $("fromn").textContent = "Location unavailable"; return; }
  $("fromk").textContent = "Finding you";
  navigator.geolocation.getCurrentPosition(p => {
    origin = { lat: p.coords.latitude, lng: p.coords.longitude, name: "where you are" };
    liveLoc = true;
    $("locbtn").setAttribute("aria-pressed", "true");
    $("fromk").textContent = "Distances from"; $("fromn").textContent = "Where you are standing";
    // Walkable is measured from here now, so the chips are recounted BEFORE the list, the
    // same order the date rail uses: a lit Walkable with nothing in reach is dropped rather
    // than left lit over an empty page.
    renderFilters(); renderShows(); if (S.tab === "films") renderFilms();
    window.dispatchEvent(new Event("sala:origin"));
  }, () => {
    $("fromk").textContent = "Distances from";
    $("fromn").textContent = origin.name + " (location refused)";
    window.dispatchEvent(new Event("sala:origin"));
  }, { enableHighAccuracy: true, timeout: 8000 });
});

/* Start on today when the snapshot has it, and otherwise on the first day it still
   offers -- never on day 0, which is only today on the morning the payload was pulled. */
const todayIdx = DAYS.findIndex(isToday);
const liveIdxs = liveDayIdxs();
S.day = liveIdxs.includes(todayIdx) ? todayIdx : (liveIdxs.length ? liveIdxs[0] : 0);
// Where distances start comes back before the first list is drawn, or the app would open
// measuring from the park and jump when it remembered.
origin = savedOrigin(); $("fromn").textContent = origin.name;
document.documentElement.lang = langPref() === "es" ? "es" : "en";
renderDates(); renderFilters(); renderShows();
// Movies is the leftmost tab and the one the app opens on, his order on 12 September.
setTab(S.tab); renderSettings();
// The button says how many, and the number is counted rather than written down. No free
// venues means no button, which is the only honest empty state for a caption.
if (FREE.length) $("freebtn").textContent = `${FREE.length} free screens`;
else $("freebtn").remove();

</script>


<script>
// The launch screen goes as soon as the map and the lists exist, not on `load` -- `load`
// waits for every font and tile and would sit there for a second on a cold cellular
// connection. requestAnimationFrame twice guarantees one painted frame first, so the
// fade never reveals a half-built page.
requestAnimationFrame(function () { requestAnimationFrame(function () {
  var b = document.getElementById("boot");
  if (b) { b.classList.add("gone"); setTimeout(function () { b.remove(); }, 320); }
}); });

// Offline. Registered after load so it never competes with the first paint.
if ("serviceWorker" in navigator) {
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
    // Hand the worker the posters this launch already loaded, which on a first visit it
    // never saw (see the message handler at the end of sw.js).
    navigator.serviceWorker.ready.then(function (reg) {
      function send(entries) {
        var urls = entries.map(function (r) { return r.name; })
          .filter(function (u) { return /\/posters\/[^\/]+\.jpg$/.test(u.split("?")[0]); });
        if (urls.length && reg.active) reg.active.postMessage({ type: "keep-posters", urls: urls });
      }
      send(performance.getEntriesByType("resource"));
      // A poster still downloading when the worker took over lands after the list above
      // was read, and the worker never saw its request either: measured 1 of 16 on a fast
      // first visit and far more on a slow one. Catch those as they finish, for a minute.
      if (window.PerformanceObserver) {
        try {
          var po = new PerformanceObserver(function (l) { send(l.getEntries()); });
          po.observe({ type: "resource" });
          setTimeout(function () { po.disconnect(); }, 60000);
        } catch (_) { /* older browsers: the first list above still went */ }
      }
    }).catch(function () {});
  });
}

// Add to Home Screen, offered once, only where the browser supports the prompt -- which
// is Android and desktop Chrome. iOS has no such API, so iOS gets the instructions
// instead, and only in Safari, and only when not already installed.
var deferred = null;
addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); deferred = e; showInstall(function () {
    deferred.prompt(); deferred = null;
  });
});
(function () {
  var standalone = matchMedia("(display-mode: standalone)").matches
                || navigator.standalone === true;
  if (standalone || localStorage.getItem("sala.install") === "done") return;
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent)
         || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var safari = ios && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);
  // AND NOT WHILE HE IS READING SOMETHING. The prompt used to arrive on a bare 2.6
  // second timer, so tapping a film in the first three seconds got a banner dropped over
  // its showtimes. If a sheet is open when the timer fires, wait and offer it once the
  // sheet is closed instead.
  if (safari) setTimeout(function () {
    var sheet = document.getElementById("sheet");
    var open = function () { return sheet && sheet.getAttribute("aria-hidden") === "false"; };
    if (!open()) return showInstall(null);
    var iv = setInterval(function () {
      if (open()) return;
      clearInterval(iv);
      showInstall(null);
    }, 700);
  }, 2600);
})();
function showInstall(onTap) {
  var d = document.createElement("div");
  d.setAttribute("role", "dialog");
  // BELOW THE SHEET, NOT ABOVE IT. At 1200 against the sheet's 901 this banner covered
  // the showtimes of whatever he had just opened. 880 puts it under both the sheet and
  // its scrim and still above the map controls and the tab bar.
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);"
    + "z-index:880;background:var(--surface);border:1px solid var(--line);border-radius:16px;"
    + "padding:14px 16px;box-shadow:0 8px 34px rgba(0,0,0,.28);display:grid;gap:9px;"
    + "font-family:'Bricolage Grotesque',system-ui,sans-serif;max-width:520px;margin:0 auto";
  d.innerHTML = '<div style="font-weight:700;font-size:15.5px;letter-spacing:-.01em">Put it on your home screen</div>'
    + '<div style="font-size:13.5px;line-height:1.45;color:var(--ink-2)">'
    + (onTap ? 'Installs like an app. No store, nothing to pay.'
             : 'Tap Share, then <b>Add to Home Screen</b>. It opens full screen with no browser bars, and works with no signal.')
    + '</div><div style="display:flex;gap:8px;margin-top:2px">'
    + (onTap ? '<button id="sala-ok" style="flex:1;min-height:44px;border-radius:11px;background:var(--lamp);color:var(--lamp-ink);font-weight:700;font-size:14px">Install</button>' : '')
    + '<button id="sala-no" style="flex:' + (onTap ? '0 0 34%' : '1') + ';min-height:44px;border-radius:11px;'
    + 'border:1px solid var(--line);background:var(--sunk);font-weight:600;font-size:14px">'
    + (onTap ? 'Not now' : 'Got it') + '</button></div>';
  document.body.appendChild(d);
  var close = function () { localStorage.setItem("sala.install", "done"); d.remove(); };
  d.querySelector("#sala-no").onclick = close;
  if (onTap) d.querySelector("#sala-ok").onclick = function () { close(); onTap(); };
}
</script>
