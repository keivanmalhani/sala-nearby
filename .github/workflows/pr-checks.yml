name: Offline regression checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic tests without network access
        run: |
          python3 test-refresh-guards.py
          python3 test-cineteca-sessions.py
          node test-search-more.mjs
          node test-sw-upgrade.mjs
